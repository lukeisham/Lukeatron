# !OutgoingContentCheck — Approval Whitelist (SUPERSEDED)
# As of 2026-06-24, the tier model (interaction_tier field on Person records in
# Memory/Long-Term/People/) is the primary gate. This file is kept as a legacy
# fallback only — it is consulted only if the People store lookup fails entirely.
# Do NOT add new entries here; set interaction_tier on the Person record instead.
# Existing entries below are preserved for reference. Amy (AI79), Luke PCV (LI78),
# and Keith (KF19) are now gold-tier on their Person records.
#
# Owner is always Luke. luke.isham@gmail.com is implicitly trusted and is NOT an
# external recipient — sending to it never triggers this checkpoint.
#
# Each entry supports PARTIAL approval via `scope`:
#   scope: full        → no approval needed for any action to this target
#   scope: <list>      → only the listed action types skip approval; anything else
#                        still prompts (e.g. an address cleared to receive a weekly
#                        report but not arbitrary mail).
# Optional `expires:` (YYYY-MM-DD) auto-retires an entry; omit for permanent.

