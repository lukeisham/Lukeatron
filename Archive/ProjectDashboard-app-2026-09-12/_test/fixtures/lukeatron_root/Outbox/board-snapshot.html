<html lang="en">
<head>

  <style>
/* Project Dashboard — Design Tokens (the styleguide spec, FR-1/FR-2)

   Every colour, size and weight the app uses lives here as a custom property on :root.
   No other module writes a colour literal, a spacing value, or a radius of its own —
   add a token here instead and reference it (documentation.spec.md, "colours live in
   exactly one file"). STYLE.md is this file's companion: every value below is explained
   there, and AC-2 checks the two against each other in both directions. */

:root {
  /* Ground and ink — Dusk (FR-4, FR-5) */
  --bg: #11131a;
  --ink: #e6e6ee;            /* body text on --bg, 14.95:1 */
  --ink-guessed: #e6e6ee8c;  /* FR-14: the guessed-vs-stated underline — --ink at 55% */
  --panel: #1b2030;
  --line: #ffffff10;
  --bare: #1b2030;           /* an unused lattice slot */
  --mind: #2a3040;           /* a mind project's plate */
  --edge: #00000055;         /* the stroke between cube faces */

  /* Quadrant hues (degrees) and the project-colour ramp. A project's own fill is
     generated from these, never listed (FR-6) — the generator lives in monitor. */
  --hue-CH: 212;
  --hue-PP: 34;
  --hue-TE: 148;
  --hue-PR: 280;
  --sat: 42%;
  --light-lo: 34%;
  --light-hi: 70%;
  --hue-variance: 13deg;     /* FR-6: hue ± this, per project */
  --sat-variance: 8%;        /* FR-6: sat ± this, per project */
  --hue-step: 137.508deg;    /* the golden angle — FR-6's per-project stepping constant */

  /* Kind — 1 waiting, 2 unshaped, 3 mine, 4 hand-over, 5 incoming (FR-5) */
  --k1: #7f93b8;
  --k2: #8e8b84;
  --k3: #ffc46b;
  --k4: #7fd6a2;
  --k5: #b79be8;

  /* Fluorescent — reserved for the two urgency outlines and nothing else (FR-7).
     A third reference anywhere in the app fails AC-3. */
  --fluoro-week: #00e5ff;    /* due within seven days, 12.06:1 on --bg */
  --fluoro-over: #ff2d78;    /* overdue, 5.21:1 on --bg */

  /* Cube face shading — one fill, two filters, via feColorMatrix (FR-11).
     The crown's "waiting" state reuses --face-shade-mid rather than a new colour (FR-10). */
  --face-shade-mid: 0.78;    /* right face; also the crown's "waiting" dim */
  --face-shade-dark: 0.56;   /* left face */

  /* Stack-outline urgency stroke — the guaranteed channel. Colour alone collides with
     the cube fill it sits against (ΔL 0.015 week, 0.014 overdue), so weight carries it (FR-8) */
  --stroke-week: 2.4px;
  --stroke-over: 3.1px;      /* always the thicker of the two */
  --glow-blur: 4px;          /* soft blur behind the stroke; never animated (FR-9) */

  /* Small-mark halo — the week rail's 11px dots can't carry a stroke, so the fluorescent
     is a two-ring halo instead: an inner ring in --bg, then a coloured outer ring (FR-8a) */
  --halo-inner: 2.4px;
  --halo-outer-week: 4.6px;
  --halo-outer-over: 5.5px;  /* always the wider of the two */
  --mark-size: 11px;         /* week-rail dot: circle = due, square = wake, diamond = incoming (FR-9b) */

  /* Mind plate vs bare tile — close in lightness; dash is the second cue (FR-6a) */
  --dash-mind: 3 2;
  --dash-bare: none;

  /* The one moving element in the app — the depot ticker (FR-9) */
  --tick-rate: 10.5s;        /* per job; a lane's cycle time is this × its job count */
  --tick-ease: linear;       /* the only permitted timing function anywhere in the app */
  --tick-rest-below: 8;      /* a lane holding fewer jobs than this does not roll */

  /* Type — one system stack, no web font (FR-12) */
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-size-body: 13px;
  --line-height-body: 1.45;

  /* Spacing — a 4px scale (FR-13) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  /* Radii — exactly three, no more (FR-13) */
  --r-swatch: 2px;
  --r-panel: 8px;
  --r-rail: 26px;
}

/* FR-9a: the ticker freezes under reduced motion, defined here rather than in a module
   so no module can forget it. Contract: the element that actually carries the rolling
   animation (`.ticker-track-rolling`, monitor.css) must keep that exact class name for
   this rule to reach it — CSS `animation` is not inherited, so a rule on an ancestor
   (`.ticker-lane`) cannot stop a descendant's own animation. `.ticker-viewport` is the
   actual scroll container (`overflow: hidden` in monitor.css), so that is what relaxes
   to hand-scrollable, not its ancestor. */
@media (prefers-reduced-motion: reduce) {
  .ticker-track-rolling {
    animation: none;
  }
  .ticker-viewport {
    overflow-x: auto;
  }
}

/* STYLE.md "Guessed, not stated" — the one treatment, defined once here so
   `monitor.css` and `unblock.css`/`candidate-list.css` (both loaded on every
   page, index.html) never author their own competing `.guessed` rule that
   would stack with this one (FR-14/AC-9: a single identical treatment). */
.guessed {
  text-decoration: underline dashed var(--ink-guessed) 1px;
  text-underline-offset: 2px;
  cursor: help;
}

/* FR-15: print drops to ink on white and drops both fluorescents — the project sheet is
   a list, not a picture, so it names kind in words instead of leaning on colour. Kind
   colours and shading are read unchanged; the board itself does not print (no furniture). */
@media print {
  :root {
    --bg: #ffffff;
    --ink: #11131a;
    --ink-guessed: #11131a99;  /* 60%, not the screen palette's 55% (AC-7: 55% only clears 4.09:1 on white) */
    --panel: #ffffff;
    --line: #00000022;
    --fluoro-week: transparent;
    --fluoro-over: transparent;
  }
}


/* Monitor's own shared chrome — page shell, buttons, toolbar/breadcrumb/
   legend, the this-week panel. Every colour is a token from shared/tokens.css
   (documentation spec: "colours live in exactly one file"). This file styles
   layout, spacing and motion only.

   Split by component (CSS-1: one file, one job, under 150 lines) —
   board-view.css, list-view.css, week-view.css, ticker.css and
   opened-stack.css each style one rendering module; this file keeps only
   what more than one of them shares. */

.monitor {
  color: var(--ink);
  background: var(--bg);
  font-family: var(--font-body);
  font-size: var(--font-size-body);
  line-height: var(--line-height-body);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.muted {
  color: var(--ink-guessed);
}

/* .guessed lives in shared/tokens.css (FR-14/AC-9: one treatment, defined once). */

.link-button,
.icon-button,
.primary-button,
.toggle {
  font: inherit;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-panel);
  padding: var(--space-1) var(--space-3);
  cursor: pointer;
}

.link-button {
  background: none;
  border: none;
  padding: 0;
  text-decoration: underline;
}

.primary-button {
  background: var(--k3);
  color: var(--bg);
  border: none;
  font-weight: 600;
}

.toggle-active {
  outline: 2px solid var(--k3);
}

/* ---------------------------------------------------------------------- */
/* Toolbar, breadcrumb, diagnostics                                       */
/* ---------------------------------------------------------------------- */

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--line);
}

.toggle-group {
  display: flex;
  gap: var(--space-1);
}

.breadcrumb {
  font-family: var(--font-mono);
  color: var(--ink-guessed);
}

.occlusion-diagnostic {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 0.85em;
  color: var(--ink-guessed);
}

.wiki-door {
  color: var(--ink);
}

/* FR-0b: the legend, always on screen — never a hover-only tooltip (FR-0c). */
.legend {
  margin: 0;
  padding: var(--space-1) var(--space-4);
  color: var(--ink-guessed);
  font-size: 0.85em;
}

/* The page's one <h1> (HTML-3): present at every altitude, but Monitor's own
   landing job is "eight seconds, no decisions" — a screen-reader-only
   heading satisfies the semantic requirement without adding visible chrome
   the design doesn't call for. */
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* The loading/error states (monitor.js) — CSS-2: a token, not an inline style. */
.state-message {
  padding: var(--space-8);
}

.this-week-panel {
  padding: var(--space-2) var(--space-4);
  border-bottom: 1px solid var(--line);
}

.this-week-panel summary {
  cursor: pointer;
}

.nothing-needs-you {
  font-weight: 600;
}

/* ---------------------------------------------------------------------- */
/* Print (styleguide FR-15, monitor FR-8) — furniture never prints. Kept   */
/* here rather than in any one component file since it names selectors    */
/* from all of them at once.                                              */
/* ---------------------------------------------------------------------- */

@media print {
  .toolbar,
  .this-week-panel,
  .depot-ticker,
  .mass-svg,
  .quadrant-labels,
  .week-view,
  .list-view,
  .opened-toolbar {
    display: none;
  }

  .opened-stack {
    display: block;
  }
}


/* The board altitude — the packed mass, quadrant labels, the hover HUD
   (board-view.js). Split out of monitor.css (CSS-1: one file, one job). */

.view-body {
  flex: 1;
  overflow: auto;
  padding: var(--space-4);
}

.mass-svg {
  width: 100%;
  max-width: 900px;
  display: block;
  margin: 0 auto;
}

.stack {
  cursor: pointer;
  /* FR-9: the ticker is the app's one moving element — a plain state swap on
     hover/dim, not a second animation (`--tick-ease: linear` is the only
     permitted timing function anywhere in the app). */
}

.stack.dimmed {
  opacity: 0.35;
}

.stack:focus-visible {
  outline: 2px solid var(--ink);
}

.quadrant-label {
  fill: var(--ink);
  font-size: 13px;
  font-weight: 600;
}

.hover-hud {
  fill: var(--ink);
  font-size: 14px;
  font-family: var(--font-mono);
}


/* The list view (list-view.js). Split out of monitor.css (CSS-1: one file,
   one job). */

.list-section h2 {
  margin: var(--space-4) 0 var(--space-2);
  font-size: 1em;
  color: var(--ink);
}

.list-rows {
  list-style: none;
  margin: 0;
  padding: 0;
}

.list-row {
  display: grid;
  grid-template-columns: 4.5em 1fr 3em 8em 2em;
  gap: var(--space-2);
  align-items: center;
  padding: var(--space-1) var(--space-2);
  border-bottom: 1px solid var(--line);
}

/* styleguide FR-7/AC-3: the two fluorescents are reserved for exactly two
   sites — the stack silhouette (board-view.js) and the week-rail halo
   (week-view.js). This list-view echo of the same project-level outline
   state carries it through weight alone (D-27's own doctrine for the
   fluorescents: stroke weight is the guaranteed channel, colour is the
   pleasant one) rather than spending a third fluorescent site on it. */
.list-row.outline-this-week {
  border-left: var(--stroke-week) solid var(--ink);
}

.list-row.outline-overdue {
  border-left: var(--stroke-over) solid var(--ink);
}

.list-row-id {
  font-family: var(--font-mono);
}


/* The week rail, reading strip and day view (week-view.js). Split out of
   monitor.css (CSS-1: one file, one job). */

.week-nav {
  font: inherit;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-panel);
  padding: var(--space-1) var(--space-3);
  cursor: pointer;
}

.week-rail {
  display: flex;
  gap: var(--space-2);
  align-items: stretch;
  overflow-x: auto;
}

.week-overdue-cap {
  flex: 0 0 auto;
  background: var(--panel);
  /* styleguide FR-7/AC-3: not a third fluorescent site — the cap's own count
     and the word "overdue" beside it (renderWeekView) already name this. */
  border: var(--stroke-over) solid var(--ink);
  border-radius: var(--r-rail);
  padding: var(--space-2);
  color: var(--ink);
  cursor: pointer;
}

.week-overdue-count {
  font-weight: 700;
  font-size: 1.2em;
}

.week-day {
  flex: 1 1 0;
  min-width: 5.5em;
  background: none;
  border: 1px solid var(--line);
  border-radius: var(--r-rail);
  padding: var(--space-2);
  color: var(--ink);
  cursor: pointer;
  text-align: left;
}

.week-weekday {
  font-size: 0.8em;
  color: var(--ink-guessed);
}

.week-date-past {
  color: var(--ink-guessed);
}

.week-date-today {
  font-weight: 700;
}

.week-count {
  color: var(--ink-guessed);
}

.week-strip {
  margin-top: var(--space-3);
  padding: var(--space-2) var(--space-3);
  background: var(--panel);
  border-radius: var(--r-panel);
  min-height: 3em;
}

.week-strip-heading {
  font-weight: 600;
  margin-bottom: var(--space-1);
}

.week-strip-row {
  display: flex;
  gap: var(--space-2);
  padding: 2px 0;
}

.week-strip-source {
  color: var(--ink-guessed);
  min-width: 5em;
}


/* The depot ticker — the app's one moving element (ticker.js). Split out of
   monitor.css (CSS-1: one file, one job). */

.depot-ticker {
  border-top: 1px solid var(--line);
  padding: var(--space-2) var(--space-4);
  background: var(--panel);
}

.ticker-lane {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin: var(--space-1) 0;
}

.ticker-lane-count {
  flex: 0 0 auto;
  font-weight: 600;
  min-width: 8em;
}

.ticker-viewport {
  flex: 1;
  overflow: hidden;
}

.ticker-track {
  display: flex;
  gap: var(--space-2);
  width: max-content;
}

/* FR-1f: constant rate, no easing but the one named in tokens.css, and only
   the rolling lanes move at all — a lane below the rest threshold renders
   `.ticker-track` without `.ticker-track-rolling` and never animates. */
.ticker-track-rolling {
  animation: ticker-scroll calc(var(--tick-rate) * var(--ticker-job-count)) var(--tick-ease) infinite;
}

.ticker-lane-right .ticker-track-rolling {
  animation-direction: reverse;
}

.ticker-lane:hover .ticker-track-rolling {
  animation-play-state: paused;
}

@keyframes ticker-scroll {
  from {
    transform: translateX(0);
  }
  to {
    transform: translateX(-50%);
  }
}

.ticker-chip {
  flex: 0 0 auto;
  background: var(--bg);
  border: none;
  border-left: 3px solid var(--chip-kind, var(--ink));
  border-radius: var(--r-swatch);
  padding: var(--space-1) var(--space-2);
  color: var(--ink);
  cursor: pointer;
  white-space: nowrap;
}

.ticker-detail-slot {
  margin-top: var(--space-2);
}

.ticker-detail {
  background: var(--bg);
  border-radius: var(--r-panel);
  padding: var(--space-2) var(--space-3);
}


/* The opened stack — the third altitude (opened-stack.js). Split out of
   monitor.css (CSS-1: one file, one job). */

.opened-toolbar {
  display: flex;
  gap: var(--space-2);
  margin-bottom: var(--space-3);
}

.opened-heading {
  font-size: 1.4em;
  margin: 0 0 var(--space-3);
}

.slice-line {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-1) 0;
}

.slice-leader {
  stroke: var(--line);
  stroke-width: 1;
  stroke-dasharray: 2 3;
}

.slice-group {
  margin: var(--space-2) 0;
  padding-left: var(--space-2);
  border-left: 2px solid var(--line);
}

.slice-stem {
  font-weight: 600;
  margin-bottom: var(--space-1);
}

.slice-due {
  color: var(--ink-guessed);
  margin-left: var(--space-2);
}

.footings,
.incoming {
  margin-top: var(--space-4);
}


#snapshot-stamp {
  background: var(--panel);
  color: var(--ink);
  border-bottom: 1px solid var(--line);
  padding: var(--space-2) var(--space-4);
  font-family: var(--font-body);
  font-size: var(--font-size-body);
  text-align: center;
}
@media print {
  #snapshot-stamp { display: none; }
}
  </style>
</head>

 *                 | {type: "single", id: string, text: string}>}

    result.push({ type: "group", stem, entries });

 * looser one would also qualify. */

    const buckets = new Map(); // stem string -> indexes

      buckets.get(key).push(i);
