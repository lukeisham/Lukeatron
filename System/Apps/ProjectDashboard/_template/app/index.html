<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Dashboard</title>
  <link rel="stylesheet" href="/shared/tokens.css" />
  <!-- HTML-4: CSS in <head>. Each rendering module's own stylesheet, added
       as that module lands — CSS-1 keeps each file to one job, so B-7
       (unblock) is two files, not one. -->
  <link rel="stylesheet" href="/monitor/monitor.css" />
  <link rel="stylesheet" href="/monitor/board-view.css" />
  <link rel="stylesheet" href="/monitor/list-view.css" />
  <link rel="stylesheet" href="/monitor/week-view.css" />
  <link rel="stylesheet" href="/monitor/ticker.css" />
  <link rel="stylesheet" href="/monitor/opened-stack.css" />
  <link rel="stylesheet" href="/unblock/unblock.css" />
  <link rel="stylesheet" href="/unblock/candidate-list.css" />
</head>
<body>
  <!--
    Host shell only — this is server.py's "GET / (the front end)" (server
    spec §2), not a rendering module. It decides nothing about what a mark
    means; monitor.js and unblock.js own their own mount points' contents,
    including the page's one <h1> (HTML-3), once B-6/B-7 land. The ids
    below (monitor-root, unblock-root) are this file's proposal — the
    modules that mount into them are the authority on what they need.
  -->
  <main id="monitor-root" aria-label="Monitor"></main>
  <section id="unblock-root" aria-label="Unblock" hidden></section>
  <script type="module" src="/monitor/monitor.js"></script>
  <script type="module" src="/unblock/unblock.js"></script>
</body>
</html>
