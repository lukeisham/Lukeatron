<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Example</title> 2: Sequence Completion</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; background: #f0f2f5; color: #222; padding: 24px; display: flex; justify-content: center; }
  .container { max-width: 800px; width: 100%; }
  .card { background: #fff; border-radius: 12px; padding: 28px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  .subtitle { color: #666; font-size: 0.85rem; margin-bottom: 16px; }
  .question-svg { text-align: center; margin: 8px 0; }
  .question-svg svg { max-width: 100%; height: auto; }
  h2 { font-size: 1rem; margin-bottom: 12px; color: #333; }
  .options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 480px) { .options { grid-template-columns: repeat(2, 1fr); } }
  .option { border: 2px solid #ddd; border-radius: 10px; padding: 16px 8px 8px; text-align: center; cursor: pointer; transition: all 0.15s; background: #fafafa; position: relative; }
  .option:hover { border-color: #888; background: #f5f5f5; }
  .option.selected-correct { border-color: #27ae60; background: #eafaf1; }
  .option.selected-wrong { border-color: #e74c3c; background: #fdedec; }
  .option.reveal-correct { border-color: #27ae60; background: #eafaf1; }
  .option .label { font-weight: 700; font-size: 0.8rem; color: #888; margin-bottom: 6px; }
  .option svg { display: block; margin: 0 auto; }
  .badge { position: absolute; top: 6px; right: 8px; font-size: 1.1rem; font-weight: 700; }
  .feedback { margin-top: 14px; padding: 12px 16px; border-radius: 8px; font-size: 0.9rem; display: none; }
  .feedback.correct { background: #eafaf1; color: #1e7e34; display: block; border: 1px solid #a3d9b1; }
  .feedback.wrong { background: #fdedec; color: #b03a2e; display: block; border: 1px solid #f5b7b1; }
  .explanation { margin-top: 10px; font-size: 0.85rem; color: #555; display: none; }
  .explanation.visible { display: block; }
  .btn { display: inline-block; margin-top: 10px; padding: 6px 14px; font-size: 0.8rem; border: 1px solid #bbb; border-radius: 6px; background: #fff; cursor: pointer; color: #555; }
  .btn:hover { background: #f0f0f0; }
</style>
</head>
<body>
<div class="container">

  <div class="card">
    <h1>Example</h1> 2: Sequence Completion</h1>
    <p class="subtitle">Linear Series — "Next in the Series"</p>

    <div class="question-svg">
      <svg viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg">
        <rect width="600" height="120" fill="#ffffff"/>
        <rect x="10" y="10" width="100" height="100" fill="none" stroke="#ccc" stroke-width="1.5" rx="4"/>
        <rect x="125" y="10" width="100" height="100" fill="none" stroke="#ccc" stroke-width="1.5" rx="4"/>
        <rect x="240" y="10" width="100" height="100" fill="none" stroke="#ccc" stroke-width="1.5" rx="4"/>
        <rect x="355" y="10" width="100" height="100" fill="none" stroke="#ccc" stroke-width="1.5" rx="4"/>
        <rect x="470" y="10" width="100" height="100" fill="#f7f7f7" stroke="#aaa" stroke-width="1.5" stroke-dasharray="5,3" rx="4"/>
        <defs>
          <g id="arrow">
            <line x1="0" y1="22" x2="0" y2="-22" stroke="#333" stroke-width="3" stroke-linecap="round"/>
            <polygon points="0,-32 -9,-18 9,-18" fill="#333"/>
          </g>
        </defs>
        <g transform="translate(60, 60)"><use href="#arrow"/></g>
        <g transform="translate(175, 60) rotate(90)"><use href="#arrow"/></g>
        <g transform="translate(290, 60) rotate(180)"><use href="#arrow"/></g>
        <g transform="translate(405, 60) rotate(270)"><use href="#arrow"/></g>
        <text x="520" y="63" text-anchor="middle" font-size="28" font-family="Arial, sans-serif" font-weight="bold" fill="#999">?</text>
      </svg>
    </div>
  </div>

  <div class="card">
    <h2>Select the</h2> next figure</h2>
    <div class="options" id="options">
      <!-- A: arrow up (CORRECT) -->
      <div class="option" data-answer="correct">
        <div class="label">A</div>
        <svg viewBox="0 0 80 80" width="70" height="70" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(40,40)">
            <line x1="0" y1="18" x2="0" y2="-18" stroke="#333" stroke-width="3" stroke-linecap="round"/>
            <polygon points="0,-26 -7,-14 7,-14" fill="#333"/>
          </g>
        </svg>
      </div>
      <!-- B: arrow left -->
      <div class="option" data-answer="wrong">
        <div class="label">B</div>
        <svg viewBox="0 0 80 80" width="70" height="70" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(40,40) rotate(270)">
            <line x1="0" y1="18" x2="0" y2="-18" stroke="#333" stroke-width="3" stroke-linecap="round"/>
            <polygon points="0,-26 -7,-14 7,-14" fill="#333"/>
          </g>
        </svg>
      </div>
      <!-- C: arrow down -->
      <div class="option" data-answer="wrong">
        <div class="label">C</div>
        <svg viewBox="0 0 80 80" width="70" height="70" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(40,40) rotate(180)">
            <line x1="0" y1="18" x2="0" y2="-18" stroke="#333" stroke-width="3" stroke-linecap="round"/>
            <polygon points="0,-26 -7,-14 7,-14" fill="#333"/>
          </g>
        </svg>
      </div>
      <!-- D: arrow right -->
      <div class="option" data-answer="wrong">
        <div class="label">D</div>
        <svg viewBox="0 0 80 80" width="70" height="70" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(40,40) rotate(90)">
            <line x1="0" y1="18" x2="0" y2="-18" stroke="#333" stroke-width="3" stroke-linecap="round"/>
            <polygon points="0,-26 -7,-14 7,-14" fill="#333"/>
          </g>
        </svg>
      </div>
      <!-- E: arrow up-right (45° distract) -->
      <div class="option" data-answer="wrong">
        <div class="label">E</div>
        <svg viewBox="0 0 80 80" width="70" height="70" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(40,40) rotate(45)">
            <line x1="0" y1="18" x2="0" y2="-18" stroke="#333" stroke-width="3" stroke-linecap="round"/>
            <polygon points="0,-26 -7,-14 7,-14" fill="#333"/>
          </g>
        </svg>
      </div>
      <!-- F: circle (wrong shape) -->
      <div class="option" data-answer="wrong">
        <div class="label">F</div>
        <svg viewBox="0 0 80 80" width="70" height="70" xmlns="http://www.w3.org/2000/svg">
          <circle cx="40" cy="40" r="20" fill="#fff" stroke="#333" stroke-width="2.5"/>
        </svg>
      </div>
    </div>

    <div class="feedback" id="feedback"></div>
    <div class="explanation" id="explanation">
      <strong>Rule:</strong> The arrow rotates 90° clockwise at</strong> each step: up → right → down → left → <strong>up</strong>.</strong> After four 90° rotations it returns to its starting position.
    </div>
    <button class="btn" id="showExplain" style="display:none;">Show explanation</button>
  </div>

</div>

<script>
(function() {
  var answered = false;
  var options = document.querySelectorAll('.option');
  var feedback = document.getElementById('feedback');
  var explanation = document.getElementById('explanation');
  var showBtn = document.getElementById('showExplain');

  options.forEach(function(opt) {
    opt.addEventListener('click', function() {
      if (answered) return;
      answered = true;
      var isCorrect = opt.getAttribute('data-answer') === 'correct';

      if (isCorrect) {
        opt.classList.add('selected-correct');
        opt.querySelector('.label').insertAdjacentHTML('beforeend', ' <span class="badge">&#10003;</span>');
        feedback.textContent = 'Correct! The arrow completes a full 360° rotation and returns to pointing up.';
        feedback.className = 'feedback correct';
      } else {
        opt.classList.add('selected-wrong');
        opt.querySelector('.label').insertAdjacentHTML('beforeend', ' <span class="badge">&#10007;</span>');
        feedback.textContent = 'Not quite. Look at how the arrow changes from one position to the next.';
        feedback.className = 'feedback wrong';
        options.forEach(function(o) {
          if (o.getAttribute('data-answer') === 'correct') o.classList.add('reveal-correct');
        });
      }

      explanation.classList.add('visible');
      showBtn.style.display = 'none';
    });
  });

  showBtn.addEventListener('click', function() {
    explanation.classList.add('visible');
    showBtn.style.display = 'none';
  });

  setTimeout(function() {
    if (!answered) showBtn.style.display = 'inline-block';
  }, 3000);
})();
</script>
</body>
</html>
