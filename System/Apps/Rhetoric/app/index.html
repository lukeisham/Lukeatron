<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhetoric — A Forum of Devices</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="header.css">
<link rel="stylesheet" href="list.css">
<link rel="stylesheet" href="topical.css">
<link rel="stylesheet" href="print.css">
</head>
<body>
<header class="masthead">
  <h1 class="masthead-title">Rhetoric</h1>
  <p class="masthead-subrule">A Forum of Devices <span id="device-count" class="masthead-count"></span></p>
  <div class="toolbar">
    <div class="search-row">
      <label class="search-field">
        <span class="visually-hidden">Search devices</span>
        <span class="search-glyph" aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Search devices…" autocomplete="off">
      </label>
      <label class="toolbar-check"><input id="fuzzy" type="checkbox"> Fuzzy match</label>
    </div>
    <div id="sort" class="sort-list" role="group" aria-label="Sort order"></div>
    <div class="options-row">
      <div class="menu">
        <button id="display-button" class="btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="display-panel">Display <span class="btn-caret" aria-hidden="true">▾</span></button>
        <div id="display-panel" class="menu-panel" role="group" aria-label="Display options" hidden>
          <label class="menu-item"><input id="show-definitions" type="checkbox" checked> Show definitions</label>
          <label class="menu-item"><input id="show-examples" type="checkbox" checked> Show examples</label>
          <label class="menu-item"><input id="show-confidence" type="checkbox" checked> Show AI confidence</label>
          <label class="menu-item" title="On: only groups and types show, each with a button that reveals its devices. Off: every device is listed."><input id="reveal" type="checkbox" checked> Indent</label>
        </div>
      </div>
      <label class="toolbar-check">Open on
        <select id="default-sort" class="toolbar-select">
          <option value="none">Search only</option>
          <option value="alphabetical">Alphabetical</option>
          <option value="form">Form</option>
          <option value="function">Function</option>
          <option value="category">Category</option>
          <option value="popularity">Popularity</option>
          <option value="topical">Topical</option>
        </select>
      </label>
      <button id="print" class="btn" type="button">Print</button>
      <button id="copy" class="btn" type="button">Copy</button>
      <span id="copy-status" class="toolbar-status" role="status"></span>
      <a class="toolbar-link" href="about.html">About the scores</a>
    </div>
  </div>
  <p class="ornament" aria-hidden="true">── ❧ ──</p>
</header>
<main class="workspace">
  <div class="workspace-bar">
    <button id="home" class="home-link" type="button" hidden>← Home</button>
    <form id="type-form" class="type-form" autocomplete="off" hidden>
      <label class="type-field"><span class="visually-hidden">New Type name</span>
        <input id="type-name" type="text" maxlength="80" placeholder="New Type…"></label>
      <button class="btn" type="submit">Add Type</button>
      <span id="type-status" class="toolbar-status" role="status"></span>
    </form>
  </div>
  <div id="list" class="list" aria-live="polite"></div>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
