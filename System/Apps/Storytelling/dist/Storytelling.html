  <style>
:root {
  /* Colour tokens — sampled from reference/periodic-table-of-storytelling.png (PRD Style guide) */

  /* Ground and ink */
  --color-ground: #d3e1d2; /* PRD page ground */
  --color-ink: #1a1a1c; /* Darkened for 4.5:1 contrast on all group colours (FR-S8) */
  --color-ink-soft: #505050; /* Darkened for ≥3:1 contrast on all group colours (popularity, FR-S14) */
  --color-edge: #404040; /* Darkened for ≥3:1 contrast on all group colours (UI outlines) */

  /* Group colours — PRD Colour table */
  --g-structure: #bdbec0;
  --g-setting: #e4d1ba;
  --g-storymod: #f0e7d9;
  --g-plotdev: #e7e8e9;
  --g-genre: #d9cfe8; /* Added, PRD "new lavender" */
  --g-heroes: #c6e9f2;
  --g-charmod: #cae4b7;
  --g-archetypes: #83c76f;
  --g-villains: #fabba3; /* Main villains tiles */
  --g-villains2: #fcd7c8; /* PRD "four paler villain tiles" */
  --g-metatropes: #faf8c1;
  --g-production: #fdbf68;
  --g-fandom: #f6adcd;
  --g-highlight: #fff200; /* PRD highlight yellow for Cal, 5ma, 4wl */
  --g-rogue: #ffffff; /* Rogue card, FR-S16 */

  /* Accent */
  --color-highlight: #fff200; /* Drop target and save cue (PRD highlight yellow) */

  /* Grayscale tokens for print (FR-S11) — each group differs by ≥10 L* from touching neighbours */
  /* Touching pairs (revised layout order): Fandom·Production·Metatropes·Charmod·Villains·Villains2·Archetypes·Heroes·Genre·Plotdev·Storymod·Setting·Structure */
  --gray-fandom: #d8d8d8; /* L* ≈ 85 */
  --gray-production: #b0b0b0; /* L* ≈ 69 — Δ16 from fandom */
  --gray-metatropes: #f0f0f0; /* L* ≈ 94 — Δ25 from production */
  --gray-charmod: #d0d0d0; /* L* ≈ 83.5 — Δ11.3 from metatropes */
  --gray-villains: #a0a0a0; /* L* ≈ 65.9 */
  --gray-villains2: #c8c8c8; /* L* ≈ 80.6 — Δ14.7 from villains */
  --gray-archetypes: #989898; /* L* ≈ 60 — Δ17 from villains2 */
  --gray-heroes: #e8e8e8; /* L* ≈ 91 — Δ31 from archetypes */
  --gray-genre: #c8c8c8; /* L* ≈ 79 — Δ12 from heroes */
  --gray-plotdev: #f0f0f0; /* L* ≈ 94 — Δ15 from genre */
  --gray-storymod: #d0d0d0; /* L* ≈ 83.5 — Δ11.3 from plotdev */
  --gray-setting: #b0b0b0; /* L* ≈ 71.8 — Δ11.6 from storymod */
  --gray-structure: #888888; /* L* ≈ 56.7 — Δ15.1 from setting */
  --gray-highlight: #f8f8f8; /* L* ≈ 97 */
  --gray-rogue: #ffffff; /* L* ≈ 100 */

  /* Typography */
  --font-title: Georgia, serif; /* FR-S5 */
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; /* System sans */

  /* Spacing */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;

  /* Radii */
  --radius-none: 0;
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 8px;

  /* Motion tokens — FR-S6 */
  --m-fast: 90ms;
  --m-base: 180ms;
  --m-slow: 320ms;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in: cubic-bezier(0.55, 0.055, 0.675, 0.19);
  --ease-mid: cubic-bezier(0.42, 0, 0.58, 1);

// ---- data/layout.js ----
/**
 * The revised table as data (diagram spec FR-D11, AD-5). Pure: no DOM, no I/O.
 *
 * One column permutation turns poster positions into the shipped table; the 36 added
 * elements have fixed placements; the Five Man Band sub-tiles mirror about their parent.
 * The generator calls `tileRect` / `viewBoxFor` / `blockSpan` and verify.html calls
 * `checkLayout`, so a later block reorder is a one-line edit here.
 */

const GRID_ORIGIN_X = 29;
const GRID_ORIGIN_Y = 49;
const CELL_WIDTH = 62.1;
const CELL_HEIGHT = 75;

const ORIGINAL_COLUMNS = 20;
const REVISED_COLUMNS = 23;

/** Right margin is the poster's own: 1303 - (29 + 20 * 62.1). */
const VIEWBOX_ORIGINAL = Object.freeze({ x: 0, y: 0, w: 1303, h: 1632 });
const VIEWBOX_REVISED = Object.freeze({ x: 0, y: 0, w: 1489.3, h: 1632 });

/** Poster column i (0-based) -> revised column; `row` is unchanged. */
const POSTER_TO_REVISED = Object.freeze([
  22, 20, 19, 18, 15, 14, 13, 5, 4, 12, 11, 10, 9, 8, 7, 6, 3, 2, 1, 0,
]);

/** Poster column ranges (inclusive) of each block, as printed on the poster. */
const POSTER_BLOCK_COLUMNS = Object.freeze({
  structureA: [0, 0],
  setting: [1, 1],
  storymod: [2, 2],
  plotdev: [3, 3],
  heroes: [4, 6],
  charmod: [7, 8],
  archetypes: [9, 11],
  villains: [12, 15],
  metatropes: [16, 17],
  production: [18, 18],
  fandom: [19, 19],
});

/** Revised columns of the two blocks that exist only in the revised layout. */
const ADDED_BLOCK_COLUMNS = Object.freeze({
  genre: [16, 17],
  structureB: [21, 21],
});

const ADDED_FIRST_ROW = 2;

/**
 * Where each of the 36 added elements sits in the revised layout, by id.
 * Mirrors `reference/work/added-elements.json` (structureB = column 21; genre1 = 16; genre2 = 17;
 * rows 2-13 top to bottom).
 */
const ADDED_PLACEMENT = Object.freeze(buildAddedPlacement());

function buildAddedPlacement() {
  const columns = [
    [21, ["Pro", "Imr", "Inc", "Fsh", "Sbp", "Rsa", "Tck", "Rts", "Pt", "Fbk", "Clh", "Epi"]],
    [16, ["Com", "Tra", "Sat", "Rom", "Whd", "Ccs", "Dys", "Hei", "Hor", "Cma", "Rdt", "Sol"]],
    [17, ["Fnt", "Sf", "Wst", "Thr", "Adv", "War", "Esp", "Sup", "Fty", "Gth", "Fnr", "Hfc"]],
  ];
  const placement = {};
  for (const [col, ids] of columns) {
    ids.forEach((id, index) => {
      placement[id] = Object.freeze({ col, row: ADDED_FIRST_ROW + index });
    });
  }
  return placement;
}

/** Sub-tiles hang under a parent; the parent's poster column is a poster fact the rule needs. */
const PARENT_POSTER_COLUMN = Object.freeze({ "5ma": 5 });

const POSTER_ELEMENT_COUNT = 181;

/** Measurement noise: the poster's sub-tiles are 62 apart, a cell is 62.1 wide. */
const OVERLAP_TOLERANCE = 0.5;

const posterBlockByColumn = buildPosterBlockByColumn();

function buildPosterBlockByColumn() {
  const byColumn = [];
  for (const [block, [first, last]] of Object.entries(POSTER_BLOCK_COLUMNS)) {
    for (let col = first; col <= last; col += 1) byColumn[col] = block;
  }
  return Object.freeze(byColumn);
}

const revisedSpans = buildRevisedSpans();
const originalSpans = Object.freeze(
  Object.fromEntries(
    Object.entries(POSTER_BLOCK_COLUMNS).map(([block, [first, last]]) => [block, [first, last]]),
  ),
);

function buildRevisedSpans() {
  const spans = {};
  for (const [block, [first, last]] of Object.entries(POSTER_BLOCK_COLUMNS)) {
    const mapped = [];
    for (let col = first; col <= last; col += 1) mapped.push(POSTER_TO_REVISED[col]);
    spans[block] = [Math.min(...mapped), Math.max(...mapped)];
  }
  for (const [block, range] of Object.entries(ADDED_BLOCK_COLUMNS)) spans[block] = [...range];
  return Object.freeze(spans);
}

function byFirstColumn(spans) {
  return Object.entries(spans)
    .sort(([, a], [, b]) => a[0] - b[0])
    .map(([block]) => block);
}

/** Revised, left to right: fandom, production, metatropes(2), charmod(2), villains(4), archetypes(3), heroes(3), genre(2), plotdev, storymod, setting, structureB, structureA. */
const REVISED_BLOCK_ORDER = Object.freeze(byFirstColumn(revisedSpans));

/** The poster's own left-to-right order. */
const ORIGINAL_BLOCK_ORDER = Object.freeze(byFirstColumn(originalSpans));

function assertLayoutName(layoutName) {
  if (layoutName !== "original" && layoutName !== "revised") {
    throw new Error(`layout.js: layoutName must be "original" or "revised", got ${JSON.stringify(layoutName)}`);
  }
}

function round3(value) {
  return Math.round(value * 1000) / 1000;
}

function isGridElement(element) {
  return Number.isInteger(element.col) && Number.isInteger(element.row);
}

function columnRect(col, row) {
  return {
    x: round3(GRID_ORIGIN_X + col * CELL_WIDTH),
    y: round3(GRID_ORIGIN_Y + row * CELL_HEIGHT),
    w: CELL_WIDTH,
    h: CELL_HEIGHT,
  };
}

function parentColumnOf(element) {
  const parentColumn = PARENT_POSTER_COLUMN[element.parent];
  if (parentColumn === undefined) {
    throw new Error(`layout.js: element ${element.id} has unknown parent ${JSON.stringify(element.parent)}`);
  }
  return parentColumn;
}

function subTileRect(element, layoutName) {
  if (!Number.isFinite(element.x) || !Number.isFinite(element.y)) {
    throw new Error(`layout.js: sub-tile ${element.id} needs numeric x and y`);
  }
  if (layoutName === "original") {
    return { x: element.x, y: element.y, w: CELL_WIDTH, h: CELL_HEIGHT };
  }
  const posterParentColumn = parentColumnOf(element);
  const originalParentCentre = GRID_ORIGIN_X + posterParentColumn * CELL_WIDTH + CELL_WIDTH / 2;
  const revisedParentCentre =
    GRID_ORIGIN_X + POSTER_TO_REVISED[posterParentColumn] * CELL_WIDTH + CELL_WIDTH / 2;
  // Reflecting a centre about the parent's centre: new = parent' - (old - parent).
  const originalCentre = element.x + CELL_WIDTH / 2;
  const revisedCentre = revisedParentCentre - (originalCentre - originalParentCentre);
  return { x: round3(revisedCentre - CELL_WIDTH / 2), y: element.y, w: CELL_WIDTH, h: CELL_HEIGHT };
}

function addedCell(element) {
  const cell = ADDED_PLACEMENT[element.id];
  if (!cell) throw new Error(`layout.js: added element ${element.id} has no placement`);
  return cell;
}

/**
 * Rectangle of a tile in viewBox pixels.
 * @param {{id:string, col?:number, row?:number, x?:number, y?:number, parent?:string, added?:boolean}} element
 * @param {"original"|"revised"} layoutName
 * @returns {{x:number, y:number, w:number, h:number} | null} null only for an added element in `original`
 *   (added tiles are not drawn there, AC-D6). Throws for an element it cannot place.
 */
function tileRect(element, layoutName) {
  assertLayoutName(layoutName);
  if (element.added === true) {
    if (layoutName === "original") return null;
    const { col, row } = addedCell(element);
    return columnRect(col, row);
  }
  if (element.parent !== undefined) return subTileRect(element, layoutName);
  if (!isGridElement(element)) {
    throw new Error(`layout.js: element ${element.id} has neither col/row nor parent`);
  }
  const col = layoutName === "revised" ? POSTER_TO_REVISED[element.col] : element.col;
  if (col === undefined) throw new Error(`layout.js: element ${element.id} has poster column ${element.col} outside 0-19`);
  return columnRect(col, element.row);
}

/**
 * @param {"original"|"revised"} layoutName
 * @returns {{x:number, y:number, w:number, h:number, attr:string}} `attr` is the string for the SVG `viewBox` attribute.
 */
function viewBoxFor(layoutName) {
  assertLayoutName(layoutName);
  const box = layoutName === "revised" ? VIEWBOX_REVISED : VIEWBOX_ORIGINAL;
  return { ...box, attr: `${box.x} ${box.y} ${box.w} ${box.h}` };
}

/**
 * The block an element belongs to, independent of layout. Poster tiles are placed by poster
 * column (so highlight and paler-villain tiles land in the block they sit in); sub-tiles take
 * their parent's block; added tiles take the block of their placement.
 * @returns {string} a name in `REVISED_BLOCK_ORDER`
 */
function blockOf(element) {
  if (element.added === true) {
    const { col } = addedCell(element);
    return col === ADDED_BLOCK_COLUMNS.structureB[0] ? "structureB" : "genre";
  }
  const posterCol = element.parent !== undefined ? parentColumnOf(element) : element.col;
  const block = posterBlockByColumn[posterCol];
  if (!block) throw new Error(`layout.js: element ${element.id} has poster column ${element.col} outside 0-19`);
  return block;
}

/**
 * Horizontal extent of a block, for anchoring headings and callouts (FR-D11 d).
 * @returns {{firstCol:number, lastCol:number, columns:number, x:number, w:number} | null} null when the block
 *   does not exist in that layout (genre and structureB have no original position).
 */
function blockSpan(block, layoutName) {
  assertLayoutName(layoutName);
  const range = (layoutName === "revised" ? revisedSpans : originalSpans)[block];
  if (!range) return null;
  const [firstCol, lastCol] = range;
  const columns = lastCol - firstCol + 1;
  return { firstCol, lastCol, columns, x: round3(GRID_ORIGIN_X + firstCol * CELL_WIDTH), w: round3(columns * CELL_WIDTH) };
}

function layoutRectsOverlap(a, b) {
  const across = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
  const down = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
  return across > OVERLAP_TOLERANCE && down > OVERLAP_TOLERANCE;
}

function placeAll(elements, layoutName, problems) {
  const placed = [];
  for (const element of elements) {
    if (layoutName === "original" && element.added === true) continue;
    try {
      const rect = tileRect(element, layoutName);
      placed.push({ element, rect, block: blockOf(element) });
    } catch (error) {
      problems.push(`${element.id}: ${error.message}`);
    }
  }
  return placed;
}

function checkIds(placed, problems) {
  const seen = new Set();
  for (const { element } of placed) {
    if (seen.has(element.id)) problems.push(`duplicate id ${element.id}`);
    seen.add(element.id);
  }
}

function checkCounts(elements, layoutName, problems) {
  const poster = elements.filter((element) => element.added !== true);
  if (poster.length !== POSTER_ELEMENT_COUNT) {
    problems.push(`expected ${POSTER_ELEMENT_COUNT} poster elements, found ${poster.length}`);
  }
  for (const element of poster.filter((el) => el.parent !== undefined)) {
    const parent = poster.find((el) => el.id === element.parent);
    if (!parent) problems.push(`sub-tile ${element.id} has no parent element ${element.parent} in the data`);
    else if (parent.col !== PARENT_POSTER_COLUMN[element.parent]) {
      problems.push(`parent ${parent.id} is at poster column ${parent.col}, layout.js assumes ${PARENT_POSTER_COLUMN[element.parent]}`);
    }
  }
  if (layoutName !== "revised") return;
  const presentAdded = new Set(elements.filter((el) => el.added === true).map((el) => el.id));
  for (const id of Object.keys(ADDED_PLACEMENT)) {
    if (!presentAdded.has(id)) problems.push(`missing added element ${id}`);
  }
}

function checkOverlaps(placed, problems) {
  for (let i = 0; i < placed.length; i += 1) {
    for (let j = i + 1; j < placed.length; j += 1) {
      const a = placed[i];
      const b = placed[j];
      if (layoutRectsOverlap(a.rect, b.rect)) {
        problems.push(`${a.element.id} and ${b.element.id} share a cell or overlap near (${a.rect.x}, ${a.rect.y})`);
      }
    }
  }
}

function checkInsideViewBox(placed, layoutName, problems) {
  const box = viewBoxFor(layoutName);
  for (const { element, rect } of placed) {
    const outside = rect.x < box.x || rect.y < box.y || rect.x + rect.w > box.x + box.w || rect.y + rect.h > box.y + box.h;
    if (outside) problems.push(`${element.id} lies outside the viewBox`);
  }
}

function occupiedColumnsByBlock(placed) {
  const byBlock = new Map();
  for (const { element, rect, block } of placed) {
    if (element.parent !== undefined) continue; // hanging tiles sit outside the grid columns
    const col = Math.round((rect.x - GRID_ORIGIN_X) / CELL_WIDTH);
    if (!byBlock.has(block)) byBlock.set(block, new Set());
    byBlock.get(block).add(col);
  }
  return byBlock;
}

function checkBlocks(placed, layoutName, problems) {
  const spans = layoutName === "revised" ? revisedSpans : originalSpans;
  const occupied = occupiedColumnsByBlock(placed);
  for (const [block, [first, last]] of Object.entries(spans)) {
    const columns = occupied.get(block);
    if (!columns) {
      if (layoutName === "revised" || POSTER_BLOCK_COLUMNS[block]) problems.push(`block ${block} has no tiles`);
      continue;
    }
    for (let col = first; col <= last; col += 1) {
      if (!columns.has(col)) problems.push(`block ${block} is not contiguous: column ${col} is empty`);
    }
    for (const col of columns) {
      if (col < first || col > last) problems.push(`block ${block} has a tile in column ${col}, outside its columns ${first}-${last}`);
    }
  }
}

function checkColumnTotals(placed, layoutName, problems) {
  const used = new Set();
  for (const columns of occupiedColumnsByBlock(placed).values()) for (const col of columns) used.add(col);
  const expected = layoutName === "revised" ? REVISED_COLUMNS : ORIGINAL_COLUMNS;
  for (let col = 0; col < expected; col += 1) {
    if (!used.has(col)) problems.push(`column ${col} of ${expected} is empty`);
  }
  for (const col of used) {
    if (col >= expected) problems.push(`tile in column ${col}, beyond the ${expected} columns`);
  }
}

function checkRightHandBlock(layoutName, problems) {
  if (layoutName !== "revised") return;
  const first = revisedSpans.genre[0];
  const last = revisedSpans.structureA[1];
  if (last - first + 1 !== 7) problems.push(`right-hand block (genre to structure) is ${last - first + 1} columns, expected 7`);
}

function checkMirroredSubTiles(placed, layoutName, problems) {
  if (layoutName !== "revised") return;
  for (const { element, rect } of placed.filter((item) => item.element.parent !== undefined)) {
    const original = tileRect(element, "original");
    const parentColumn = parentColumnOf(element);
    const originalOffset = original.x + CELL_WIDTH / 2 - (GRID_ORIGIN_X + parentColumn * CELL_WIDTH + CELL_WIDTH / 2);
    const revisedOffset = rect.x + CELL_WIDTH / 2 - (GRID_ORIGIN_X + POSTER_TO_REVISED[parentColumn] * CELL_WIDTH + CELL_WIDTH / 2);
    if (Math.abs(originalOffset + revisedOffset) > 0.01) problems.push(`sub-tile ${element.id} is not mirrored about ${element.parent}`);
  }
}

/**
 * The layout check of FR-D7 / AC-D5: places every element and reports what is wrong.
 * In `original` the added elements are skipped, since that layout does not draw them.
 * @param {Array<object>} elements the full element list (poster and added)
 * @param {"original"|"revised"} layoutName
 * @returns {string[]} problems, empty when the layout is sound
 */
function checkLayout(elements, layoutName) {
  assertLayoutName(layoutName);
  const problems = [];
  checkCounts(elements, layoutName, problems);
  const placed = placeAll(elements, layoutName, problems);
  checkIds(placed, problems);
  checkOverlaps(placed, problems);
  checkInsideViewBox(placed, layoutName, problems);
  checkBlocks(placed, layoutName, problems);
  checkColumnTotals(placed, layoutName, problems);
  checkRightHandBlock(layoutName, problems);
  checkMirroredSubTiles(placed, layoutName, problems);
  return problems;
}

/** Everything the generator needs, gathered (FR-D11). */
const LAYOUT = Object.freeze({
  POSTER_TO_REVISED,
  ADDED_PLACEMENT,
  REVISED_BLOCK_ORDER,
  ORIGINAL_BLOCK_ORDER,
  geometry: Object.freeze({
    originX: GRID_ORIGIN_X,
    originY: GRID_ORIGIN_Y,
    cellWidth: CELL_WIDTH,
    cellHeight: CELL_HEIGHT,
    originalColumns: ORIGINAL_COLUMNS,
    revisedColumns: REVISED_COLUMNS,
  }),
  tileRect,
  viewBoxFor,
  blockOf,
  blockSpan,
  checkLayout,
});

// ---- data/furniture.js ----
/**
 * Poster "furniture": everything printed on the poster that is not a tile (diagram.spec FR-D2),
 * plus the fixed wording the app adds around the poster (Rogue card, About panel).
 *
 * DATA ONLY. Every export is deep-frozen. All positions are poster pixels in the viewBox
 * `0 0 1303 1632` (the source PNG's pixel space). Measurements were taken from
 * `reference/periodic-table-of-storytelling.png` and are good to about +-1 px; font sizes are
 * approximate (the poster's fonts are not reproduced), so `textLength` is given for the long
 * runs so a generator can fit them exactly. Grid constants: origin (29, 49), cell 62.1 x 75,
 * tile (col,row) = x 29+62.1*col, y 49+75*row.
 *
 * Text is transcribed exactly as printed (case, punctuation, spelling). Franchise logos and the
 * tvtropes wordmark are NOT reproduced (OQ-D1): plain-text titles / a plain credit line instead.
 *
 * ── Conventions ──────────────────────────────────────────────────────────────────────────────
 * - `block` is a block key of `layout.js` (structureA, setting, storymod, plotdev, heroes,
 *   charmod, archetypes, villains, metatropes, production, fandom). `posterCols` is that block's
 *   inclusive column range on the poster. A generator re-anchors a heading, label or connector
 *   in the revised layout from `block` (FR-D11 d); this file holds no revised-layout numbers,
 *   so FURNITURE_ANCHORS is NOT defined here — anchors belong to layout.js.
 * - `popKey: true` marks an item that must carry `class="pop-key"` so it hides with the
 *   popularity numbers (FR-D13).
 * - `tone` is "ink" (normal text) or "muted" (the grey words in the title).
 * - Text anchors are "start" | "middle" | "end" (SVG text-anchor); `baseline` is the SVG `y`.
 *
 * ── Exports ──────────────────────────────────────────────────────────────────────────────────
 * POSTER_VIEWBOX          { width, height }
 * POSTER_TITLE            { text, box, runs: [{ text, x, baseline, fontSize, textLength, tone }] }
 * COLUMN_HEADINGS         [{ id, block, posterCols, centreX, baseline, lineHeight, fontSize, lines }]
 *                         one per heading printed above/inside a column block (10 headings)
 * CHARACTER_MODIFIERS_LABEL  { id, block, posterCols, box, centreX, baseline, lineHeight, fontSize, lines }
 *                         the boxed "Character Modifiers" label above the P and A tiles
 * KEY_CALLOUT             { box, badge, identifier, tropeName, popularity }
 *                         the "Ae" key: sample tile + three rows; `badge` and `popularity` are popKey
 * SUBTROPE_BOXES          [ callToAdventure, fourthWall ] — { id, title, box, columns/items, connector tile }
 * CONNECTORS              [{ id, kind, from, to, points, dash, width }] — six dashed lines
 * ROGUE_CAPTION           "Rogue — when nothing fits"          (FR-D14)
 * ROGUE_DETAIL_TEXT       fixed explanatory text for the Rogue card's detail panel (viewport FR-V11)
 * ABOUT                   { appName, versionLabel, statements, licenceNotes } (distribution FR-X7, OQ-X1, OQ-X3)
 */

/** Freezes an object graph so no reader can edit the shared poster text. */
function freezeFurnitureData(value) {
  if (value && typeof value === "object" && !Object.isFrozen(value)) {

// ---- diagram/diagram-svg.js ----
/**
 * Draws the whole table as one <svg> (diagram spec FR-D4, FR-D9-D14).
 *
 * Painter's order: furniture -> tiles -> connectors -> interaction layer (SVG-3). Everything is
 * built with createElementNS and textContent (never innerHTML). Colour comes only from CSS
 * classes; the one thing set inline is geometry and font-size, so the fit guarantee (AC-D3) does
 * not depend on the stylesheet. The stylesheet must therefore NOT set font-size on `.sym`, `.nm`
 * or `.pop`.
 *
 * The same tiles are drawn twice: `original` (the poster's own pixels, checked against the PNG)
 * and `revised` (the shipped table). Furniture that has no fixed home in the revised table is
 * moved by a translate on its own group; the offsets are derived in revisedFurniturePlacement().
 */

const SVG_NS = "http://www.w3.org/2000/svg";

const DEFAULT_DIAGRAM_DATA = Object.freeze({
  ELEMENTS,
  GROUPS,
  ROGUE,
  layout: LAYOUT,
  furniture: Object.freeze({
      CHARACTER_MODIFIERS_LABEL,
    COLUMN_HEADINGS,
    CONNECTORS,
    KEY_CALLOUT,

    ROGUE_CAPTION,
    SUBTROPE_BOXES,

});

// ---- tile text metrics (poster pixels) -------------------------------------------------------
const TILE_PAD_X = 3;
const SYMBOL_MAX_SIZE = 26;
const SYMBOL_MIN_SIZE = 14;
const SYMBOL_BASELINE = 38;
const SYMBOL_BOLD_FACTOR = 1.1;
const POP_SIZE = Math.round(SYMBOL_MAX_SIZE * 0.28 * 10) / 10;
const POP_INSET = 4;
const POP_BASELINE = 10;
const BADGE_SIZE = 9;
const NAME_SIZES = Object.freeze([8, 7.5, 7, 6.5]);
const NAME_LINE_HEIGHT = 1.15;
const NAME_MAX_LINES = 3;
/** First baseline of the name block, by how many lines it has (kept clear of the symbol's descenders). */
const NAME_FIRST_BASELINE = Object.freeze({ 1: 57, 2: 55, 3: 52 });

// ---- where the revised layout moves furniture (see the file header) --------------------------
const REVISED_TITLE_LEFT = 29;
const REVISED_KEY_LEFT = 300;
const REVISED_CALL_BOX_GAP = 5;
const REVISED_FOURTH_WALL_BOX = Object.freeze({ x: 29, y: 1210 });
const GENRE_HEADING = Object.freeze({ id: "genre", block: "genre", baseline: 188, lineHeight: 14.4, fontSize: 12, lines: ["Genre"] });
const MIRRORED_CORNER = Object.freeze({ tl: "tr", tr: "tl", bl: "br", br: "bl" });

// ---- small helpers ---------------------------------------------------------------------------

function fmt(value) {
  return String(Math.round(value * 1000) / 1000);
}

function makeSvgNode(doc, tag, className, attributes = {}) {
  const node = doc.createElementNS(SVG_NS, tag);
  if (className) node.setAttribute("class", className);
  for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, typeof value === "number" ? fmt(value) : String(value));
  return node;
}

function makeSvgText(doc, className, attributes, content) {
  const node = makeSvgNode(doc, "text", className, attributes);
  node.textContent = content;
  return node;
}

function withPlacement(group, dx, dy) {
  if (dx !== 0 || dy !== 0) group.setAttribute("transform", `translate(${fmt(dx)} ${fmt(dy)})`);
  return group;
}

const NARROW_CHARS = new Map([
  ["i", 0.22], ["l", 0.22], ["j", 0.22], ["t", 0.28], ["f", 0.28], ["r", 0.33], ["I", 0.28],
  ["'", 0.19], ["’", 0.19], [".", 0.28], [",", 0.28], [":", 0.28], [";", 0.28], ["!", 0.28],
  [" ", 0.28], ["-", 0.33], ["(", 0.33], [")", 0.33], ["?", 0.56], ["&", 0.67],
  ["m", 0.83], ["w", 0.72], ["M", 0.83], ["W", 0.94],
]);

/**
 * Estimated width of `text` in em-fractions of `fontSize`, for a Helvetica/Arial-like face.
 * Deliberately a little generous: it decides font sizes, and a system font that is narrower than
 * the estimate only leaves a little slack.
 * @param {string} text
 * @param {number} fontSize
 * @returns {number} width in the same units as fontSize
 */
function estimateSvgTextWidth(text, fontSize) {
  let ems = 0;
  for (const char of String(text)) {
    if (NARROW_CHARS.has(char)) ems += NARROW_CHARS.get(char);
    else if (char >= "A" && char <= "Z") ems += 0.68;
    else ems += 0.56;
  }
  return ems * fontSize;
}

function wrapWords(text, maxWidth, fontSize) {
  const lines = [];
  let current = "";
  for (const word of text.split(/\s+/).filter(Boolean)) {
    const trial = current ? `${current} ${word}` : word;
    if (current && estimateSvgTextWidth(trial, fontSize) > maxWidth) {
      lines.push(current);
      current = word;
    } else current = trial;
  }
  if (current) lines.push(current);
  return lines;
}

/**
 * Chooses the font size and line breaks for a tile's name so it fits (AC-D3): tries the sizes from
 * large to the legible floor; at the floor it merges surplus lines and, only if a line is still too
 * wide, compresses that line with `textLength`.
 * @param {string} name
 * @param {number} maxWidth usable width inside the tile
 * @returns {{fontSize:number, lines:Array<{text:string, width:number, compressed:boolean}>}}
 */
function fitTileName(name, maxWidth) {
  const describe = (fontSize, lines) => lines.map((text) => {
    const natural = estimateSvgTextWidth(text, fontSize);
    return { text, width: Math.min(natural, maxWidth), compressed: natural > maxWidth };
  });
  for (const fontSize of NAME_SIZES) {
    const lines = wrapWords(name, maxWidth, fontSize);
    if (lines.length <= NAME_MAX_LINES && lines.every((line) => estimateSvgTextWidth(line, fontSize) <= maxWidth)) {
      return { fontSize, lines: describe(fontSize, lines) };
    }
  }
  const floor = NAME_SIZES[NAME_SIZES.length - 1];
  let lines = wrapWords(name, maxWidth, floor);
  if (lines.length > NAME_MAX_LINES) lines = [...lines.slice(0, NAME_MAX_LINES - 1), lines.slice(NAME_MAX_LINES - 1).join(" ")];
  return { fontSize: floor, lines: describe(floor, lines) };
}

/** Symbol font size: the poster's big size, shrunk to fit the tile's width down to a floor. */
function fitSymbolSize(symbol, maxWidth) {
  const perUnit = estimateSvgTextWidth(symbol, 1) * SYMBOL_BOLD_FACTOR;
  return Math.max(SYMBOL_MIN_SIZE, Math.min(SYMBOL_MAX_SIZE, Math.floor((maxWidth / perUnit) * 10) / 10));
}

function symbolOf(element) {
  return element.symbol ?? element.id;
}

// ---- tiles -----------------------------------------------------------------------------------

function appendTileName(doc, tile, name, rect) {
  const fit = fitTileName(name, rect.w - 2 * TILE_PAD_X);
  const centre = rect.x + rect.w / 2;
  const first = rect.y + NAME_FIRST_BASELINE[fit.lines.length];
  const label = makeSvgNode(doc, "text", "nm", { "text-anchor": "middle", "font-size": fit.fontSize });
  fit.lines.forEach((line, index) => {
    const isLast = index === fit.lines.length - 1;
    const span = makeSvgNode(doc, "tspan", "", { x: centre, y: first + index * fit.fontSize * NAME_LINE_HEIGHT });
    if (line.compressed) {
      span.setAttribute("textLength", fmt(line.width));
      span.setAttribute("lengthAdjust", "spacingAndGlyphs");
    }
    span.textContent = isLast ? line.text : `${line.text} `;
    label.append(span);
  });
  tile.append(label);
}

/**
 * Neighbouring tiles share an edge, but `x + w` of one and `x` of the next differ by float noise (about 1e-13), and a
 * browser that snaps edges to pixels can round the two differently, drawing a 2px line. Snapping every edge to an
 * eighth of a unit (exact in binary) makes each shared edge bit-identical, so both tiles round it the same way.
 */
const EDGE_STEP = 8;
const snapEdge = (value) => Math.round(value * EDGE_STEP) / EDGE_STEP;

function snappedRect(rect) {
  const left = snapEdge(rect.x);
  const top = snapEdge(rect.y);
  return { x: left, y: top, width: snapEdge(rect.x + rect.w) - left, height: snapEdge(rect.y + rect.h) - top };
}

function appendTileFace(doc, tile, { symbol, name, rect, popText, snap = false }) {
  tile.append(makeSvgNode(doc, "rect", "tile-rect", snap ? snappedRect(rect) : { x: rect.x, y: rect.y, width: rect.w, height: rect.h }));
  const centre = rect.x + rect.w / 2;
  tile.append(makeSvgText(doc, "sym", {
    x: centre,
    y: rect.y + SYMBOL_BASELINE,
    "text-anchor": "middle",
    "font-size": fitSymbolSize(symbol, rect.w - 2 * TILE_PAD_X),
  }, symbol));
  appendTileName(doc, tile, name, rect);
  if (popText !== undefined) {
    tile.append(makeSvgText(doc, "pop", {
      x: rect.x + rect.w - POP_INSET,
      y: rect.y + POP_BASELINE,
      "text-anchor": "end",
      "font-size": POP_SIZE,
    }, popText));
  }
  tile.append(makeSvgText(doc, "step-badge", { x: rect.x + POP_INSET, y: rect.y + POP_BASELINE + 1, "font-size": BADGE_SIZE }, ""));
}

function buildTile(doc, element, rect) {
  const classes = ["tile", `tile-${element.group}`];
  if (element.added === true) classes.push("is-added");
  const tile = makeSvgNode(doc, "g", classes.join(" "), {
    "data-element-id": element.id,
    tabindex: "0",
    role: "button",
    "aria-label": element.name,
  });
  appendTileFace(doc, tile, {
    symbol: symbolOf(element),
    name: element.name,
    rect,
    popText: element.popText,
    snap: true,
  });
  return tile;
}

function buildRogueCard(doc, rogue, rect, caption) {
  const card = makeSvgNode(doc, "g", "tile tile-rogue rogue", {
    "data-element-id": rogue.id,
    tabindex: "0",
    role: "button",
    "aria-label": rogue.name,
  });
  appendTileFace(doc, card, { symbol: rogue.id, name: rogue.name, rect });
  const captionText = makeSvgNode(doc, "text", "rogue-caption", { "font-size": 10.5 });
  const words = caption.split(" — ");
  const lines = words.length === 2 ? [`${words[0]} —`, words[1]] : [caption];
  lines.forEach((line, index) => {
    const span = makeSvgNode(doc, "tspan", "", { x: rect.x + rect.w + 8, y: rect.y + 30 + index * 13 });
    span.textContent = index < lines.length - 1 ? `${line} ` : line;
    captionText.append(span);
  });
  return { card, captionText };
}

// ---- furniture -------------------------------------------------------------------------------

function textLengthAttributes(item) {
  return item.textLength ? { textLength: item.textLength, lengthAdjust: "spacingAndGlyphs" } : {};
}

function buildTitle(doc, title, dx) {
  const group = withPlacement(makeSvgNode(doc, "g", "furniture-title"), dx, 0);
  for (const run of title.runs) {
    group.append(makeSvgText(doc, `title-run tone-${run.tone}`, {
      x: run.x, y: run.baseline, "font-size": run.fontSize, ...textLengthAttributes(run),
    }, run.text));
  }
  return group;
}

function headingCentre(heading, layoutName, layout) {
  if (layoutName === "original") return heading.centreX;
  const span = layout.blockSpan(heading.block, "revised");
  return span ? span.x + span.w / 2 : null;
}

function buildHeadings(doc, layoutName, headings, layout) {
  const group = makeSvgNode(doc, "g", "furniture-headings");
  const all = layoutName === "revised" ? [...headings, GENRE_HEADING] : headings;
  for (const heading of all) {
    const centre = headingCentre(heading, layoutName, layout);
    if (centre === null) {
      console.warn(`diagram-svg: no column span for heading "${heading.id}" in ${layoutName}; not drawn`);
      continue;
    }
    heading.lines.forEach((line, index) => {
      group.append(makeSvgText(doc, "col-heading", {
        x: centre,
        y: heading.baseline + index * heading.lineHeight,
        "text-anchor": "middle",
        "font-size": heading.fontSize,
        "data-heading": heading.id,
      }, line));
    });
  }
  return group;
}

function buildCharModLabel(doc, label, layoutName, layout) {
  const span = layoutName === "revised" ? layout.blockSpan(label.block, "revised") : null;
  const centre = span ? span.x + span.w / 2 : label.centreX;
  const group = makeSvgNode(doc, "g", "char-mod-label");
  group.append(makeSvgNode(doc, "rect", "char-mod-box", {
    x: centre - label.box.width / 2, y: label.box.y, width: label.box.width, height: label.box.height,
  }));
  label.lines.forEach((line, index) => {
    group.append(makeSvgText(doc, "char-mod-text", {
      x: centre, y: label.baseline + index * label.lineHeight, "text-anchor": "middle", "font-size": label.fontSize,
    }, line));
  });
  return group;
}

function keyClass(base, item) {
  return item.popKey ? `${base} pop-key` : base;
}

function appendKeyRow(doc, group, row, labelClass) {
  group.append(makeSvgText(doc, keyClass(labelClass, row), {
    x: row.x, y: row.baseline, "font-size": row.fontSize, ...textLengthAttributes(row),
  }, row.text));
  group.append(makeSvgNode(doc, "path", keyClass("key-leader", row), { d: row.leader, fill: "none" }));
  for (const note of row.note ?? []) {
    group.append(makeSvgText(doc, keyClass("key-note", row), {
      x: note.x, y: note.baseline, "font-size": note.fontSize, ...textLengthAttributes(note),
    }, note.text));
  }
}

function buildKey(doc, key, dx) {
  const group = withPlacement(makeSvgNode(doc, "g", "key-callout"), dx, 0);
  group.append(makeSvgNode(doc, "rect", "key-box", { x: key.box.x, y: key.box.y, width: key.box.width, height: key.box.height }));
  group.append(makeSvgText(doc, "key-sample-sym", {
    x: key.sampleSymbol.x, y: key.sampleSymbol.baseline, "text-anchor": "middle", "font-size": key.sampleSymbol.fontSize,
  }, key.sampleSymbol.text));
  group.append(makeSvgText(doc, "key-sample-nm", {
    x: key.sampleName.x, y: key.sampleName.baseline, "text-anchor": "middle", "font-size": key.sampleName.fontSize,
  }, key.sampleName.text));
  group.append(makeSvgNode(doc, "circle", keyClass("key-badge", key.badge), { cx: key.badge.cx, cy: key.badge.cy, r: key.badge.r }));
  group.append(makeSvgText(doc, keyClass("key-badge-text", key.badge), {
    x: key.badge.cx, y: key.badge.cy + key.badge.fontSize * 0.36, "text-anchor": "middle", "font-size": key.badge.fontSize,
  }, key.badge.text));
  appendKeyRow(doc, group, key.identifier, "key-label");
  appendKeyRow(doc, group, key.tropeName, "key-label");
  appendKeyRow(doc, group, key.popularity, "key-label");
  return group;
}

const SUBTROPE_COLUMN_GAP = 14;
const SUBTROPE_BOLD_FACTOR = 1.1;
/** The width estimate runs up to ~5% under a real system face (measured in the browser), so the fit adds this. */
const SUBTROPE_WIDTH_SLACK = 1.06;

const subtropeTextWidth = (text, fontSize) => estimateSvgTextWidth(text, fontSize) * SUBTROPE_WIDTH_SLACK;

/**
 * A subtrope box sized to its text: the poster's rectangle is the floor, and the box grows on the
 * right and bottom until the widest line (the bold title included) and the last row sit inside it
 * with the same padding the left edge has. Multi-column boxes re-space their columns so a long
 * item cannot run into the next column. The drawing and the connectors both read this.
 * @returns {{ x: number, y: number, width: number, height: number, columns: {x: number, items: string[]}[] }}
 */
function fitSubtropeBox(box) {
  const pad = box.textX - box.box.x;
  const columns = [];
  let cursor = box.textX;
  for (const source of box.columns ?? [{ x: box.textX, items: box.items }]) {
    const x = box.columns ? Math.max(source.x, cursor) : source.x;
    const width = Math.max(...source.items.map((item) => subtropeTextWidth(item, box.fontSize)));
    columns.push({ x, items: source.items });
    cursor = x + width + SUBTROPE_COLUMN_GAP;
  }
  const lastColumn = columns[columns.length - 1];
  const widestLast = Math.max(...lastColumn.items.map((item) => subtropeTextWidth(item, box.fontSize)));
  const titleRight = box.textX + subtropeTextWidth(box.title, box.fontSize) * SUBTROPE_BOLD_FACTOR;
  const right = Math.max(box.box.x + box.box.width, lastColumn.x + widestLast + pad, titleRight + pad);
  const rows = Math.max(...columns.map((column) => column.items.length));
  const bottom = Math.max(box.box.y + box.box.height, box.firstBaseline + (rows - 1) * box.lineHeight + pad);
  return { x: box.box.x, y: box.box.y, width: right - box.box.x, height: bottom - box.box.y, columns };
}

function buildSubtropeBox(doc, box, placement) {
  const group = withPlacement(makeSvgNode(doc, "g", "subtrope-box", { "data-box-id": box.id }), placement.dx, placement.dy);
  const fitted = fitSubtropeBox(box);
  group.append(makeSvgNode(doc, "rect", "subtrope-rect", { x: fitted.x, y: fitted.y, width: fitted.width, height: fitted.height }));
  group.append(makeSvgText(doc, "subtrope-title", { x: box.textX, y: box.titleBaseline, "font-size": box.fontSize }, box.title));
  for (const column of fitted.columns) {
    column.items.forEach((item, index) => {
      group.append(makeSvgText(doc, "subtrope-item", {
        x: column.x, y: box.firstBaseline + index * box.lineHeight, "font-size": box.fontSize,
      }, item));
    });
  }
  return group;
}

// ---- revised-layout furniture placement ------------------------------------------------------

/**
 * Where each moved furniture group goes in the revised layout, as translate offsets. Every choice
 * puts the item in space the revised table leaves empty (checked against the tile rectangles).
 */
function revisedFurniturePlacement(furniture, layout) {
  const genre = layout.blockSpan("genre", "revised");
  const callBox = furniture.SUBTROPE_BOXES.find((box) => box.id === "call-to-adventure-box");
  const wallBox = furniture.SUBTROPE_BOXES.find((box) => box.id === "fourth-wall-box");
  return {
    titleDx: REVISED_TITLE_LEFT - furniture.POSTER_TITLE.box.x,
    keyDx: REVISED_KEY_LEFT - furniture.KEY_CALLOUT.box.x,
    subtrope: {
      [callBox.id]: { dx: genre.x - REVISED_CALL_BOX_GAP - fitSubtropeBox(callBox).width - callBox.box.x, dy: 0 },
      [wallBox.id]: { dx: REVISED_FOURTH_WALL_BOX.x - wallBox.box.x, dy: REVISED_FOURTH_WALL_BOX.y - wallBox.box.y },
    },
  };
}

const ORIGINAL_FURNITURE_PLACEMENT = Object.freeze({
  titleDx: 0, keyDx: 0, subtrope: Object.freeze({}),
});

function subtropePlacement(placement, boxId) {
  return placement.subtrope[boxId] ?? { dx: 0, dy: 0 };
}

// ---- connectors ------------------------------------------------------------------------------

function cornerOf(rect, corner) {
  const x = corner.endsWith("r") ? rect.x + rect.w : rect.x;
  const y = corner.startsWith("b") ? rect.y + rect.h : rect.y;
  return [x, y];
}

function endRect(end, context) {
  if (end.tileId !== undefined) return context.tileRects.get(end.tileId) ?? null;
  const box = context.furniture.SUBTROPE_BOXES.find((candidate) => candidate.id === end.furnitureId);
  if (!box) return null;
  const { dx, dy } = subtropePlacement(context.placement, box.id);
  const fitted = fitSubtropeBox(box);
  return { x: fitted.x + dx, y: fitted.y + dy, w: fitted.width, h: fitted.height };
}

/** Revised connectors keep the poster's tangent shape, so every end's left/right corner flips with the mirrored table. */
function connectorPoints(connector, layoutName, context) {
  if (layoutName === "original") return connector.points;
  const ends = [connector.from, connector.to].map((end) => {
    const rect = endRect(end, context);
    return rect ? cornerOf(rect, MIRRORED_CORNER[end.corner]) : null;
  });
  if (ends.includes(null)) {
    console.warn(`diagram-svg: connector "${connector.id}" has an end that is not on the table; not drawn`);
    return null;
  }
  return ends;
}

function buildConnectors(doc, layer, layoutName, context) {
  for (const connector of context.furniture.CONNECTORS) {
    const points = connectorPoints(connector, layoutName, context);
    if (!points) continue;
    const [[x1, y1], [x2, y2]] = points;
    layer.append(makeSvgNode(doc, "line", "connector", {
      x1, y1, x2, y2, "stroke-dasharray": connector.dash, "stroke-width": connector.width, "data-connector-id": connector.id,
    }));
  }
}

// ---- assembly --------------------------------------------------------------------------------

function buildFurnitureLayer(doc, layoutName, data, placement) {
  const { furniture, layout } = data;
  const layer = makeSvgNode(doc, "g", "layer layer-furniture");
  layer.append(buildTitle(doc, furniture.POSTER_TITLE, placement.titleDx));
  layer.append(buildHeadings(doc, layoutName, furniture.COLUMN_HEADINGS, layout));
  for (const box of furniture.SUBTROPE_BOXES) layer.append(buildSubtropeBox(doc, box, subtropePlacement(placement, box.id)));
  layer.append(buildCharModLabel(doc, furniture.CHARACTER_MODIFIERS_LABEL, layoutName, layout));
  layer.append(buildKey(doc, furniture.KEY_CALLOUT, placement.keyDx));
  return layer;
}

function buildTilesLayer(doc, layoutName, data) {
  const { layout, furniture, ELEMENTS: elements, GROUPS: groups, ROGUE: rogue } = data;
  const layer = makeSvgNode(doc, "g", "layer layer-tiles");
  const tileRects = new Map();
  for (const element of elements) {
    const rect = layout.tileRect(element, layoutName);
    if (rect === null) continue;
    if (groups[element.group] === undefined) console.warn(`diagram-svg: tile ${element.id} has unknown group "${element.group}"`);
    tileRects.set(element.id, rect);
    layer.append(buildTile(doc, element, rect));
  }
  if (layoutName === "revised") {
    const geometry = layout.geometry ?? FALLBACK_GEOMETRY;
    const rect = { x: geometry.originX, y: ROGUE_Y, w: geometry.cellWidth, h: geometry.cellHeight };
    const { card, captionText } = buildRogueCard(doc, rogue, rect, furniture.ROGUE_CAPTION);
    layer.append(card, captionText);
  }
  return { layer, tileRects };
}

/**
 * Builds the poster as an <svg> element (never innerHTML).
 * @param {Document} doc a document (or fake) with createElementNS
 * @param {"original"|"revised"} layoutName
 * @param {{ELEMENTS?:object[], GROUPS?:object, ROGUE?:object, furniture?:object, layout?:object}} [data] overrides, for tests
 * @returns {SVGSVGElement}
 */
function buildDiagramSvg(doc, layoutName, data = {}) {
  if (!doc || typeof doc.createElementNS !== "function") throw new Error("buildDiagramSvg: doc must provide createElementNS");
  const merged = { ...DEFAULT_DIAGRAM_DATA, ...data, furniture: { ...DEFAULT_DIAGRAM_DATA.furniture, ...(data.furniture ?? {}) } };
  const viewBox = merged.layout.viewBoxFor(layoutName);
  const placement = layoutName === "revised" ? revisedFurniturePlacement(merged.furniture, merged.layout) : ORIGINAL_FURNITURE_PLACEMENT;

  const svg = makeSvgNode(doc, "svg", "st-diagram", {
    viewBox: viewBox.attr,
    preserveAspectRatio: "xMidYMid meet",
    role: "group",
    "aria-label": merged.furniture.POSTER_TITLE.text,
    "data-pop": "on",
    "data-layout": layoutName,
  });
  const furnitureLayer = buildFurnitureLayer(doc, layoutName, merged, placement);
  const { layer: tilesLayer, tileRects } = buildTilesLayer(doc, layoutName, merged);
  const connectorLayer = makeSvgNode(doc, "g", "layer layer-connectors");
  buildConnectors(doc, connectorLayer, layoutName, { tileRects, furniture: merged.furniture, placement });
  svg.append(furnitureLayer, tilesLayer, connectorLayer, makeSvgNode(doc, "g", "interaction-layer"));
  return svg;
}

/**
 * Clears `host` and draws the table into it.
 * @param {Element} host the diagram host element
 * @param {"original"|"revised"} [layoutName]
 * @returns {SVGSVGElement} the new svg
 */
function drawDiagram(host, layoutName = "revised") {
  const svg = buildDiagramSvg(host.ownerDocument, layoutName);
  host.replaceChildren(svg);
  return svg;
}

// ---- shared/events.js ----
/** Every event name the modules send on `document` (documentation.spec D-7). One place, so a rename is one edit. */
const EVT_SELECT = "storytelling:select";
const EVT_OPEN = "storytelling:open";
const EVT_STORY_CHANGED = "storytelling:story-changed";
const EVT_OPEN_ABOUT = "storytelling:open-about";
const EVT_OPEN_LISTS = "storytelling:open-lists";
const EVT_OPEN_LIBRARY = "storytelling:open-library";
const EVT_NOTICE = "storytelling:notice";
/** Sent when an agent session opens, closes or renames the story. Detail `{ active, name }`. */
const EVT_AGENT_SESSION = "storytelling:agent-session";
/** Status-line wording while an agent holds the story map; lives here so the canvas need not import agent-api.js. */
const AGENT_STATUS_TEXT = "An agent is editing this story";
/** Sent by shared/output.js just before the print dialog opens. Detail `{ target, tone }`; listeners prepare their own print view (whole poster, --print-scale). */
const EVT_BEFORE_PRINT = "storytelling:before-print";
/** Sent when the print dialog closes or printing failed. Detail `{ target, tone }`; listeners undo what EVT_BEFORE_PRINT did. */
const EVT_AFTER_PRINT = "storytelling:after-print";

// ---- shared/output.js ----
/**
 * Print and clipboard output for Storytelling (documentation.spec; story-map FR-C13; lists FR-K5, FR-K6).
 * The print CSS (style.spec FR-S9, FR-S11) keys off two attributes on <body>: `data-print` holds the
 * target and `data-tone` holds the tone. They exist only while a print is in progress.
 */


const PRINT_TARGETS = ["element", "story", "story-with-table", "table", "list"];
const PRINT_TONES = ["colour", "gray"];
const PRINT_TARGET_ATTRIBUTE = "data-print";
const PRINT_TONE_ATTRIBUTE = "data-tone";

/**
 * Set the print attributes on the body and open the print dialog.
 * Announces EVT_BEFORE_PRINT on the document first (so the diagram and story map can prepare their print view) and
 * EVT_AFTER_PRINT when the attributes are cleared, on `afterprint` or at once if print throws. Never throws.
 *
 * @param {string} target - One of PRINT_TARGETS
 * @param {string} tone - One of PRINT_TONES
 * @param {{ doc?: Document, win?: Window }} [options] test overrides (default to the globals)
 * @returns {{ok: true} | {ok: false, error: string}}
 */
function setPrintTarget(target, tone, { doc, win } = {}) {
  const document = doc || globalThis.document;
  const window = win || globalThis.window;

  if (!PRINT_TARGETS.includes(target)) {
    return { ok: false, error: `Invalid print target: "${target}"` };
  }
  if (!PRINT_TONES.includes(tone)) {
    return { ok: false, error: `Invalid print tone: "${tone}"` };
  }
  if (!document || !document.body || !window) {
    console.warn("output: setPrintTarget needs a page with a body and a window");
    return { ok: false, error: "No page to print" };
  }

  document.body.setAttribute(PRINT_TARGET_ATTRIBUTE, target);
  document.body.setAttribute(PRINT_TONE_ATTRIBUTE, tone);

  const detail = { target, tone };
  let finished = false;
  const clearAttributes = () => {
    if (finished) return;
    finished = true;
    document.body.removeAttribute(PRINT_TARGET_ATTRIBUTE);
    document.body.removeAttribute(PRINT_TONE_ATTRIBUTE);
    window.removeEventListener("afterprint", clearAttributes);
    announcePrintEvent(document, EVT_AFTER_PRINT, detail);
  };
  window.addEventListener("afterprint", clearAttributes);

  try {
    announcePrintEvent(document, EVT_BEFORE_PRINT, detail);
    window.print();
  } catch (err) {
    clearAttributes();
    console.warn("Print failed:", err);
    return { ok: false, error: err.message };
  }

  return { ok: true };
}

/** A listener that throws must not stop the print, so each announcement is guarded. A page without dispatchEvent simply has no listeners. */
function announcePrintEvent(document, eventName, detail) {
  if (typeof document.dispatchEvent !== "function") return;
  try {
    document.dispatchEvent(new CustomEvent(eventName, { detail }));
  } catch (err) {
    console.warn(`output: a ${eventName} listener failed:`, err);
  }
}

/**
 * Copy text to the clipboard: `navigator.clipboard.writeText` when present, else a hidden
 * textarea and `execCommand("copy")` (older browsers, `file://` pages). Never throws.
 *
 * @param {string} text - Text to copy
 * @param {{ nav?: Navigator, doc?: Document }} [options] test overrides (default to the globals)
 * @returns {Promise<{ok: true} | {ok: false, error: string}>}
 */
async function copyText(text, { nav, doc } = {}) {
  const navigator = nav || globalThis.navigator;
  const document = doc || globalThis.document;

  if (typeof text !== "string") {
    console.warn("output: copyText was given something other than a string");
    return { ok: false, error: "Nothing to copy" };
  }

  if (navigator && navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      return { ok: true };
    } catch (err) {
      console.warn("Clipboard API refused, trying the fallback:", err);
    }
  }

  return copyWithTextarea(text, document);
}

function copyWithTextarea(text, document) {
  let textarea = null;
  try {
    textarea = document.createElement("textarea");
    textarea.textContent = text;
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";
    document.body.appendChild(textarea);
    textarea.select();
    return document.execCommand("copy") ? { ok: true } : { ok: false, error: "execCommand('copy') returned false" };
  } catch (err) {
    return { ok: false, error: err.message };
  } finally {
    if (textarea) {
      try {
        document.body.removeChild(textarea);
      } catch (err) {
        console.warn("output: could not remove the copy helper:", err);
      }
    }
  }
}

// ---- diagram/viewport.js ----
/** Zoom is measured against the whole-poster view (the reset state): 1 = poster fits, 6 = six times closer. */
const MIN_ZOOM = 1;
const MAX_ZOOM = 6;
/** Each toolbar `+` / `−` press multiplies (divides) the zoom by this. */
const ZOOM_STEP = 1.25;
/** At least this fraction of the poster, on each axis, must stay inside the view. */
const MIN_VISIBLE_FRACTION = 0.25;
/** An arrow key pans the view by this fraction of its own size. */
const KEY_PAN_FRACTION = 0.1;
/** The one UI preference, owned by this module alone. */
const PREFS_KEY = "storytelling.prefs.v1";

const ZOOM_FALLBACK_DURATION_MS = 180;
const ZOOM_SNAP_EPSILON = 1e-6;
const WHEEL_LINE_PX = 16;
const WHEEL_SENSITIVITY = 0.0015;
const WHEEL_PINCH_SENSITIVITY = 0.01;
const VIEWPORT_TILE_SELECTOR = ".tile";
/** Print targets that show the whole poster whatever the on-screen zoom (viewport-detail FR-V8, story-map FR-C13). */
const FULL_POSTER_PRINT_TARGETS = ["table", "story-with-table"];

/* ------------------------------------------------------------------ pure viewBox maths */

/**
 * Parses an SVG viewBox attribute.
 * @param {string|null} text
 * @returns {{x:number,y:number,w:number,h:number}|null} null when it is not four numbers with a positive size
 */
function parseViewBox(text) {
  if (typeof text !== "string") return null;
  const parts = text.trim().split(/[\s,]+/).map(Number);
  if (parts.length !== 4 || !parts.every(Number.isFinite)) return null;
  const [x, y, w, h] = parts;
  return w > 0 && h > 0 ? { x, y, w, h } : null;
}

/** Formats a viewBox for the attribute, rounded so animation never writes 17-digit numbers. */
function formatViewBox(vb) {
  return [vb.x, vb.y, vb.w, vb.h].map((n) => Number(n.toFixed(3))).join(" ");
}

/** How far in the view is: 1 at the whole-poster view, 6 at maximum. */
function zoomLevel(vb, home) {
  return home.w / vb.w;
}

/** The whole-poster view: a copy of the home box. */
function resetViewBox(home) {
  return { ...home };
}

function clampViewBoxAxis(start, size, homeStart, homeSize) {
  const minVisible = Math.min(size, homeSize * MIN_VISIBLE_FRACTION);
  const lowest = homeStart + minVisible - size;
  const highest = homeStart + homeSize - minVisible;
  return Math.min(Math.max(start, lowest), highest);
}

/** Slides the view back until at least a quarter of the poster (or the whole view, when zoomed past 4x) is inside it. */
function clampViewBox(vb, home) {
  return {
    x: clampViewBoxAxis(vb.x, vb.w, home.x, home.w),
    y: clampViewBoxAxis(vb.y, vb.h, home.y, home.h),
    w: vb.w,
    h: vb.h,
  };
}

/**
 * Zooms by `factor` keeping the source-coordinate `point` under the same screen position.
 * The resulting zoom is held to 1x–6x; reaching 1x snaps to the whole-poster view.
 */
function zoomViewBoxAt(vb, home, factor, point) {
  const current = zoomLevel(vb, home);
  const target = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, current * factor));
  if (target <= MIN_ZOOM + ZOOM_SNAP_EPSILON) return resetViewBox(home);
  const ratio = current / target;
  const next = {
    x: point.x - (point.x - vb.x) * ratio,
    y: point.y - (point.y - vb.y) * ratio,
    w: home.w / target,
    h: home.h / target,
  };
  return clampViewBox(next, home);
}

/** Moves the view by (dx, dy) in source units, then clamps. */
function panViewBox(vb, home, dx, dy) {
  return clampViewBox({ ...vb, x: vb.x + dx, y: vb.y + dy }, home);
}

/** Pixels per source unit. `preserveAspectRatio="xMidYMid meet"` scales by the tighter axis. */
function viewBoxScale(rect, vb) {
  return Math.min(rect.width / vb.w, rect.height / vb.h);
}

/** Converts a screen position to source coordinates, allowing for the letterbox that `meet` leaves. */
function clientToViewBox(rect, vb, clientX, clientY) {
  const scale = viewBoxScale(rect, vb);
  const offsetX = (rect.width - vb.w * scale) / 2;
  const offsetY = (rect.height - vb.h * scale) / 2;
  return {
    x: vb.x + (clientX - rect.left - offsetX) / scale,
    y: vb.y + (clientY - rect.top - offsetY) / scale,
  };
}

/** Zoom factor for one wheel event. A trackpad pinch arrives as a ctrl-wheel with small deltas, so it gets a higher gain. */
function wheelZoomFactor(event) {
  const lines = event.deltaMode === 1 ? WHEEL_LINE_PX : 1;
  const gain = event.ctrlKey ? WHEEL_PINCH_SENSITIVITY : WHEEL_SENSITIVITY;
  return Math.exp(-(event.deltaY ?? 0) * lines * gain);
}

/** Cubic in-out easing, the "mid" curve of the style spec. */
function easeViewBoxInOut(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;
}

/** Linear blend between two viewBoxes at progress `t` (0..1). */
function blendViewBox(from, to, t) {
  const mix = (a, b) => a + (b - a) * t;
  return { x: mix(from.x, to.x), y: mix(from.y, to.y), w: mix(from.w, to.w), h: mix(from.h, to.h) };
}

/* ------------------------------------------------------------------ per-SVG state and animation */

const viewportStates = new WeakMap();

/**
 * The viewport state of an SVG: its home viewBox (read once from the SVG's own attribute, never from layout.js),
 * the current viewBox, and any running animation.
 * @returns {{home:object, vb:object, target:object|null, frame:*}|null} null when the SVG has no usable viewBox
 */
function getViewportState(svg) {
  if (!svg) return null;
  let state = viewportStates.get(svg);
  if (!state) {
    const home = parseViewBox(svg.getAttribute("viewBox"));
    if (!home) {
      console.warn("viewport: svg has no usable viewBox attribute, zoom and pan are disabled", svg.getAttribute("viewBox"));
      return null;
    }
    state = { home, vb: { ...home }, target: null, frame: null, cancel: null };
    viewportStates.set(svg, state);
  }
  return state;
}

/** Forgets the SVG's state so the next call re-reads its viewBox attribute as the new home. */
function resetViewportState(svg) {
  const state = viewportStates.get(svg);
  if (state) cancelViewBoxAnimation(state);
  viewportStates.delete(svg);
}

function cancelViewBoxAnimation(state) {
  if (state.frame !== null && state.cancel) state.cancel(state.frame);
  state.frame = null;
  state.target = null;
}

function commitViewBox(svg, state, vb) {
  state.vb = vb;
  svg.setAttribute("viewBox", formatViewBox(vb));
}

function readZoomDurationMs() {
  try {
    const raw = globalThis.getComputedStyle?.(document.documentElement).getPropertyValue("--m-base").trim();
    const match = /^([\d.]+)(ms|s)$/.exec(raw ?? "");
    if (match) return Number(match[1]) * (match[2] === "s" ? 1000 : 1);
  } catch {
    // A missing or odd stylesheet is not an error: the fallback is the house value.
  }
  return ZOOM_FALLBACK_DURATION_MS;
}

function defaultZoomEnv() {
  const reduced = globalThis.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches === true;
  return {
    durationMs: readZoomDurationMs(),
    reducedMotion: reduced,
    raf: globalThis.requestAnimationFrame?.bind(globalThis) ?? null,
    caf: globalThis.cancelAnimationFrame?.bind(globalThis) ?? null,
  };
}

/**
 * Moves the view to `target`. Animated moves ease over `--m-base`; reduced motion, a missing `requestAnimationFrame`,
 * or `animate: false` make it instant. Wheel, pinch and drag never animate, because lag on continuous input feels broken.
 * @param {{animate?:boolean, env?:object}} [options] `env` = `{durationMs, reducedMotion, raf, caf}`, injectable for tests
 */
function moveViewTo(svg, target, { animate = false, env } = {}) {
  const state = getViewportState(svg);
  if (!state) return;
  cancelViewBoxAnimation(state);
  const settings = animate ? (env ?? defaultZoomEnv()) : null;
  if (!settings || settings.reducedMotion || !settings.raf || settings.durationMs <= 0) {
    commitViewBox(svg, state, target);
    return;
  }
  const from = state.vb;
  let startedAt = null;
  state.target = target;
  state.cancel = settings.caf;
  const step = (timestamp) => {
    startedAt ??= timestamp;
    const progress = Math.min(1, (timestamp - startedAt) / settings.durationMs);
    commitViewBox(svg, state, blendViewBox(from, target, easeViewBoxInOut(progress)));
    if (progress < 1) {
      state.frame = settings.raf(step);
    } else {
      state.frame = null;
      state.target = null;
    }
  };
  state.frame = settings.raf(step);
}

/** Zooms about the centre of the (destination) view by `factor`. Used by the toolbar; eases unless told otherwise. */
function zoomBy(svg, factor, options = { animate: true }) {
  const state = getViewportState(svg);
  if (!state) return;
  const base = state.target ?? state.vb;
  const centre = { x: base.x + base.w / 2, y: base.y + base.h / 2 };
  moveViewTo(svg, zoomViewBoxAt(base, state.home, factor, centre), options);
}

/** Toolbar `+` (direction 1) and `−` (direction -1): one ×1.25 step. */
function zoomStep(svg, direction, options = { animate: true }) {
  zoomBy(svg, direction > 0 ? ZOOM_STEP : 1 / ZOOM_STEP, options);
}

/** Toolbar reset: back to the whole poster. */
function resetView(svg, options = { animate: true }) {
  const state = getViewportState(svg);
  if (state) moveViewTo(svg, resetViewBox(state.home), options);
}

/* ------------------------------------------------------------------ popularity preference */

const popularityListeners = new Set();

function defaultPrefsStorage() {
  try {
    return globalThis.localStorage ?? null;
  } catch {
    return null;
  }
}

/** The saved popularity choice; `true` when nothing valid is saved or storage is unavailable. Never throws. */
function readPopularityPref(storage = defaultPrefsStorage()) {
  try {
    const saved = JSON.parse(storage?.getItem(PREFS_KEY) ?? "null");
    return typeof saved?.popularity === "boolean" ? saved.popularity : true;
  } catch {
    return true;
  }
}

/** Saves the popularity choice as `{ popularity }`. Returns false, silently, when storage refuses. */
function writePopularityPref(on, storage = defaultPrefsStorage()) {
  try {
    storage.setItem(PREFS_KEY, JSON.stringify({ popularity: on }));
    return true;
  } catch {
    return false;
  }
}

/** Whether popularity is showing: read from the SVG root when there is one, else from the saved preference. */
function isPopularityOn(svg, storage) {
  if (svg) return svg.getAttribute("data-pop") !== "off";
  return readPopularityPref(storage);
}

/** Sets `data-pop` on the SVG root without saving or announcing. */
function applyPopularity(svg, on) {
  svg?.setAttribute("data-pop", on ? "on" : "off");
}

/** Sets, saves and announces the popularity choice. Zoom, pan and selection are untouched. */
function setPopularity(svg, on, storage) {
  applyPopularity(svg, on);
  writePopularityPref(on, storage);
  for (const listener of [...popularityListeners]) listener(on);
  return on;
}

/** Flips popularity; returns the new value. */
function togglePopularity(svg, storage) {
  return setPopularity(svg, !isPopularityOn(svg, storage), storage);
}

/** Calls `listener(on)` after every change, from the button or the `P` key. Returns an unsubscribe function. */
function subscribePopularity(listener) {
  popularityListeners.add(listener);
  return () => popularityListeners.delete(listener);
}

/* ------------------------------------------------------------------ pointer, wheel and key wiring */

const ARROW_DIRECTIONS = {
  ArrowLeft: [-1, 0],
  ArrowRight: [1, 0],
  ArrowUp: [0, -1],
  ArrowDown: [0, 1],
};

function pointerDistance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function pointerMidpoint(a, b) {
  return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
}

/**
 * Attaches zoom, pan and the popularity toggle to the SVG inside `host`. Listeners sit on the host, so a redrawn SVG
 * needs no rewiring; where `MutationObserver` exists a redraw is noticed on its own, otherwise call `refresh()`.
 * Touches only the viewBox and `data-pop`; a container resize never reaches it.
 * @param {Element} host the `#diagram-host` element
 * @param {{storage?: Storage}} [options]
 * @returns {{refresh: Function, getViewBox: Function, destroy: Function}}
 */
function mountViewport(host, { storage } = {}) {
  const touches = new Map();
  let panning = null;
  let pinch = null;
  let prepared = null;
  let printStash = null;
  host.style.touchAction = "none";

  function currentSvg() {
    return host.querySelector("svg");
  }

  function prepare(svg) {
    if (!svg || svg === prepared) return;
    prepared = svg;
    applyPopularity(svg, readPopularityPref(storage));
    getViewportState(svg);
  }

  function refresh() {
    const svg = currentSvg();
    if (svg) resetViewportState(svg);
    prepared = null;
    prepare(svg);
  }

  function liveState() {
    const svg = currentSvg();
    prepare(svg);
    const state = getViewportState(svg);
    if (!state) return null;
    cancelViewBoxAnimation(state);
    return { svg, state };
  }

  function onWheel(event) {
    const live = liveState();
    if (!live) return;
    event.preventDefault();
    const rect = live.svg.getBoundingClientRect();
    const point = clientToViewBox(rect, live.state.vb, event.clientX, event.clientY);
    commitViewBox(live.svg, live.state, zoomViewBoxAt(live.state.vb, live.state.home, wheelZoomFactor(event), point));
  }

  function beginPan(event, svg) {
    panning = { pointerId: event.pointerId, x: event.clientX, y: event.clientY };
    try {
      svg.setPointerCapture?.(event.pointerId);
    } catch {
      // Capture is a nicety: a pointer that is already gone just stops panning.
    }
  }

  function onPointerDown(event) {
    const live = liveState();
    if (!live) return;
    if (event.pointerType === "touch") touches.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (touches.size === 2) {
      const [a, b] = [...touches.values()];
      panning = null;
      host.classList.remove("is-panning");
      pinch = { dist: pointerDistance(a, b), mid: pointerMidpoint(a, b) };
      return;
    }
    const onTile = event.target?.closest?.(VIEWPORT_TILE_SELECTOR);
    const primary = event.button === undefined || event.button === 0;
    if (!onTile && primary && !panning && !pinch) beginPan(event, live.svg);
  }

  function pinchTo(svg, state) {
    const [a, b] = [...touches.values()];
    const next = { dist: pointerDistance(a, b), mid: pointerMidpoint(a, b) };
    if (pinch.dist > 0 && next.dist > 0) {
      const rect = svg.getBoundingClientRect();
      const anchor = clientToViewBox(rect, state.vb, pinch.mid.x, pinch.mid.y);
      const zoomed = zoomViewBoxAt(state.vb, state.home, next.dist / pinch.dist, anchor);
      const scale = viewBoxScale(rect, zoomed);
      commitViewBox(svg, state, panViewBox(zoomed, state.home, -(next.mid.x - pinch.mid.x) / scale, -(next.mid.y - pinch.mid.y) / scale));
    }
    pinch = next;
  }

  function onPointerMove(event) {
    if (touches.has(event.pointerId)) touches.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (!pinch && !(panning && panning.pointerId === event.pointerId)) return;
    const live = liveState();
    if (!live) return;
    if (pinch) {
      if (touches.size === 2) pinchTo(live.svg, live.state);
      return;
    }
    const scale = viewBoxScale(live.svg.getBoundingClientRect(), live.state.vb);
    const dx = event.clientX - panning.x;
    const dy = event.clientY - panning.y;
    panning.x = event.clientX;
    panning.y = event.clientY;
    if (dx !== 0 || dy !== 0) host.classList.add("is-panning");
    commitViewBox(live.svg, live.state, panViewBox(live.state.vb, live.state.home, -dx / scale, -dy / scale));
  }

  function onPointerEnd(event) {
    touches.delete(event.pointerId);
    if (touches.size < 2) pinch = null;
    if (panning && panning.pointerId === event.pointerId) {
      panning = null;
      host.classList.remove("is-panning");
      try {
        currentSvg()?.releasePointerCapture?.(event.pointerId);
      } catch {
        // Already released by the browser.
      }
    }
  }

  function onKeyDown(event) {
    if (event.ctrlKey || event.metaKey || event.altKey) return;
    const arrow = ARROW_DIRECTIONS[event.key];
    if (arrow) {
      const live = liveState();
      if (!live) return;
      event.preventDefault();
      const { vb, home } = live.state;
      commitViewBox(live.svg, live.state, panViewBox(vb, home, arrow[0] * vb.w * KEY_PAN_FRACTION, arrow[1] * vb.h * KEY_PAN_FRACTION));
    } else if (event.key === "p" || event.key === "P") {
      event.preventDefault();
      togglePopularity(currentSvg(), storage);
    }
  }

  // The home box is the whole poster (read from the SVG's own attribute at draw time), so a table print needs no layout import.
  function onBeforePrint(event) {
    if (printStash || !FULL_POSTER_PRINT_TARGETS.includes(event.detail?.target)) return;
    const svg = currentSvg();
    const state = getViewportState(svg);
    if (!state) return;
    cancelViewBoxAnimation(state);
    printStash = { svg, vb: state.vb };
    commitViewBox(svg, state, resetViewBox(state.home));
  }

  function onAfterPrint() {
    if (!printStash) return;
    const { svg, vb } = printStash;
    printStash = null;
    const state = svg === currentSvg() ? getViewportState(svg) : null;
    if (state) commitViewBox(svg, state, vb);
  }

  host.addEventListener("wheel", onWheel, { passive: false });
  host.addEventListener("pointerdown", onPointerDown);
  host.addEventListener("pointermove", onPointerMove);
  host.addEventListener("pointerup", onPointerEnd);
  host.addEventListener("pointercancel", onPointerEnd);
  host.addEventListener("keydown", onKeyDown);
  document.addEventListener(EVT_BEFORE_PRINT, onBeforePrint);
  document.addEventListener(EVT_AFTER_PRINT, onAfterPrint);

  const observer = typeof MutationObserver === "function" ? new MutationObserver(() => prepare(currentSvg())) : null;
  observer?.observe(host, { childList: true });
  prepare(currentSvg());

  return {
    refresh,
    /** The current viewBox as `{x,y,w,h}`, or null before an SVG is drawn. */
    getViewBox() {
      const state = getViewportState(currentSvg());
      return state ? { ...state.vb } : null;
    },
    destroy() {
      observer?.disconnect();
      host.removeEventListener("wheel", onWheel);
      host.removeEventListener("pointerdown", onPointerDown);
      host.removeEventListener("pointermove", onPointerMove);
      host.removeEventListener("pointerup", onPointerEnd);
      host.removeEventListener("pointercancel", onPointerEnd);
      host.removeEventListener("keydown", onKeyDown);
      document.removeEventListener(EVT_BEFORE_PRINT, onBeforePrint);
      document.removeEventListener(EVT_AFTER_PRINT, onAfterPrint);
    },
  };
}

/* ------------------------------------------------------------------ toolbar */

const TOOLBAR_PRINT_TONES = [
  { tone: "colour", label: "Colour" },
  { tone: "gray", label: "Grayscale" },
];

function makeToolbarButton(action, label, ariaLabel) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "st-toolbar__button";
  button.setAttribute("data-action", action);
  button.textContent = label;
  if (ariaLabel) button.setAttribute("aria-label", ariaLabel);
  return button;
}

function announceToolbarEvent(eventName) {
  document.dispatchEvent(new CustomEvent(eventName, { detail: {} }));
}

/**
 * Builds the toolbar inside `host`: `+`, `−`, reset, Popularity, Print table (Colour / Grayscale), Lists, About.
 * @param {Element} host the `#toolbar` element
 * @param {{getSvg: () => Element|null, printTable?: Function, storage?: Storage}} options
 *   `printTable(target, tone)` defaults to `setPrintTarget` from shared/output.js; injectable for tests.
 * @returns {{syncPopularity: Function, closeMenu: Function, destroy: Function}}
 */
function mountToolbar(host, { getSvg, printTable = setPrintTarget, storage } = {}) {
  if (typeof getSvg !== "function") {
    console.warn("viewport: mountToolbar needs a getSvg function; the zoom and popularity controls will do nothing");
    getSvg = () => null;
  }
  host.textContent = "";
  host.classList.add("st-toolbar");
  host.setAttribute("role", "toolbar");
  host.setAttribute("aria-label", "Diagram controls");

  const zoomIn = makeToolbarButton("zoom-in", "+", "Zoom in");
  const zoomOut = makeToolbarButton("zoom-out", "−", "Zoom out");
  const reset = makeToolbarButton("reset", "Reset", "Reset view to the whole poster");
  const popularity = makeToolbarButton("popularity", "Popularity");
  const lists = makeToolbarButton("lists", "Lists");
  const about = makeToolbarButton("about", "About");

  const printWrap = document.createElement("div");
  printWrap.className = "st-toolbar__menu-wrap";
  const printButton = makeToolbarButton("print-table", "Print table");
  printButton.setAttribute("aria-haspopup", "true");
  printButton.setAttribute("aria-expanded", "false");
  const menu = document.createElement("div");
  menu.className = "st-toolbar__menu";
  menu.setAttribute("role", "menu");
  menu.hidden = true;
  for (const { tone, label } of TOOLBAR_PRINT_TONES) {
    const item = document.createElement("button");
    item.type = "button";
    item.className = "st-toolbar__menu-item";
    item.setAttribute("role", "menuitem");
    item.setAttribute("data-tone", tone);
    item.textContent = label;
    item.addEventListener("click", () => {
      closeMenu();
      printTable("table", tone);
    });
    menu.append(item);
  }
  printWrap.append(printButton, menu);

  function syncPopularity(on = isPopularityOn(getSvg(), storage)) {
    popularity.setAttribute("aria-pressed", on ? "true" : "false");
  }

  function closeMenu() {
    menu.hidden = true;
    printButton.setAttribute("aria-expanded", "false");
  }

  function toggleMenu() {
    const opening = menu.hidden;
    menu.hidden = !opening;
    printButton.setAttribute("aria-expanded", opening ? "true" : "false");
  }

  zoomIn.addEventListener("click", () => zoomStep(getSvg(), 1));
  zoomOut.addEventListener("click", () => zoomStep(getSvg(), -1));
  reset.addEventListener("click", () => resetView(getSvg()));
  popularity.addEventListener("click", () => togglePopularity(getSvg(), storage));
  printButton.addEventListener("click", toggleMenu);
  lists.addEventListener("click", () => announceToolbarEvent(EVT_OPEN_LISTS));
  about.addEventListener("click", () => announceToolbarEvent(EVT_OPEN_ABOUT));
  printWrap.addEventListener("keydown", (event) => {
    if (event.key !== "Escape" || menu.hidden) return;
    closeMenu();
    printButton.focus();
  });
  const onOutsideClick = (event) => {
    if (!menu.hidden && !printWrap.contains(event.target)) closeMenu();
  };
  document.addEventListener("click", onOutsideClick);
  const unsubscribe = subscribePopularity(syncPopularity);

  host.append(zoomIn, zoomOut, reset, popularity, printWrap, lists, about);
  syncPopularity();

  return {
    syncPopularity,
    closeMenu,
    destroy() {
      unsubscribe();
      document.removeEventListener("click", onOutsideClick);
    },
  };
}

// ---- diagram/selection.js ----
/** A press that travels further than this many pixels is a drag: it never opens, never clears. One shared constant (viewport spec risk table). */
const DRAG_THRESHOLD_PX = 5;

const SELECTION_TILE_SELECTOR = ".tile";
const SELECTION_CLASS = "is-selected";
const SELECTION_ID_ATTR = "data-element-id";

let selectedElementId = null;

/** The id of the selected element, or null. Selection alone opens nothing and enables no print/copy. */
function getSelectedElementId() {
  return selectedElementId;
}

function emitSelectionEvent(name, detail) {
  document.dispatchEvent(new CustomEvent(name, { detail }));
}

function tileFromTarget(target) {
  return target?.closest?.(SELECTION_TILE_SELECTOR) ?? null;
}

function elementIdOfTile(tile) {
  return tile.getAttribute(SELECTION_ID_ATTR);
}

function findTileById(host, elementId) {
  return host.querySelectorAll(SELECTION_TILE_SELECTOR).find((tile) => elementIdOfTile(tile) === elementId) ?? null;
}

function keyIs(event, ...names) {
  return names.includes(event.key);
}

/**
 * Wires selection onto the diagram host. Tiles are found by class `tile` and attribute `data-element-id`, so the
 * host survives the SVG being redrawn (call `refresh()` after a redraw). Drag START belongs to drag-drop.js: this
 * module never calls preventDefault on a tile press, it only watches how far the pointer travelled.
 * @param {Element} host the `#diagram-host` element
 * @returns {{select: Function, clear: Function, getSelectedId: Function, refresh: Function, destroy: Function}}
 */
function mountSelection(host) {
  selectedElementId = null;
  let press = null;
  // Set when the latest press was a drag, so the dblclick the browser may still fire afterwards is ignored.
  let lastPressWasDrag = false;

  function paint() {
    for (const tile of host.querySelectorAll(SELECTION_TILE_SELECTOR)) {
      tile.classList.toggle(SELECTION_CLASS, selectedElementId !== null && elementIdOfTile(tile) === selectedElementId);
    }
  }

  function select(elementId) {
    if (elementId === selectedElementId) return;
    selectedElementId = elementId;
    paint();
    emitSelectionEvent(EVT_SELECT, { elementId });
  }

  function clear() {
    if (selectedElementId === null) return;
    selectedElementId = null;
    paint();
    emitSelectionEvent(EVT_SELECT, { elementId: null });
  }

  function open(elementId) {
    select(elementId);
    emitSelectionEvent(EVT_OPEN, { elementId });
  }

  function onPointerMove(event) {
    if (!press || event.pointerId !== press.pointerId) return;
    const travelled = Math.hypot(event.clientX - press.x, event.clientY - press.y);
    if (travelled > DRAG_THRESHOLD_PX) press.moved = true;
  }

  function endPress(event, cancelled) {
    if (!press || event.pointerId !== press.pointerId) return;
    const finished = press;
    stopTracking();
    lastPressWasDrag = finished.moved || cancelled;
    if (!finished.onTile && !lastPressWasDrag) clear();
  }

  function onPointerUp(event) { endPress(event, false); }
  function onPointerCancel(event) { endPress(event, true); }

  function stopTracking() {
    press = null;
    document.removeEventListener("pointermove", onPointerMove, true);
    document.removeEventListener("pointerup", onPointerUp, true);
    document.removeEventListener("pointercancel", onPointerCancel, true);
  }

  function onPointerDown(event) {
    if (event.button !== undefined && event.button !== 0) return;
    if (press) {
      // A second finger means pinch, not a click: the first press can no longer clear or open.
      press.moved = true;
      return;
    }
    const tile = tileFromTarget(event.target);
    lastPressWasDrag = false;
    press = { pointerId: event.pointerId, x: event.clientX, y: event.clientY, moved: false, onTile: tile !== null };
    // Capture phase on the document: drag-drop may take pointer capture or stop propagation, and we must still see the release.
    document.addEventListener("pointermove", onPointerMove, true);
    document.addEventListener("pointerup", onPointerUp, true);
    document.addEventListener("pointercancel", onPointerCancel, true);
    if (tile) select(elementIdOfTile(tile));
  }

  function onDoubleClick(event) {
    const tile = tileFromTarget(event.target);
    if (!tile || lastPressWasDrag) return;
    open(elementIdOfTile(tile));
  }

  function onKeyDown(event) {
    const tile = tileFromTarget(event.target);
    if (!tile || event.ctrlKey || event.metaKey || event.altKey) return;
    if (keyIs(event, "Enter")) {
      event.preventDefault();
      open(elementIdOfTile(tile));
    } else if (keyIs(event, " ", "Spacebar")) {
      event.preventDefault();
      select(elementIdOfTile(tile));
    }
  }

  host.addEventListener("pointerdown", onPointerDown);
  host.addEventListener("dblclick", onDoubleClick);
  host.addEventListener("keydown", onKeyDown);

  return {
    select,
    clear,
    getSelectedId: getSelectedElementId,
    /** Re-applies the cue after the SVG was redrawn; clears the selection if that element no longer exists. */
    refresh() {
      if (selectedElementId !== null && !findTileById(host, selectedElementId)) clear();
      else paint();
    },
    destroy() {
      stopTracking();
      host.removeEventListener("pointerdown", onPointerDown);
      host.removeEventListener("dblclick", onDoubleClick);
      host.removeEventListener("keydown", onKeyDown);
    },
  };
}

// ---- story/story-layout.js ----
/**
 * story-layout.js — the one automatic arrangement of a story map (FR-C7).
 *
 * Pure and deterministic: no DOM, no storage, no randomness. The canvas draws what this returns and
 * story-text numbers beads from it, so screen, print and Copy cannot disagree (D-13).
 *
 * All coordinates are in map pixels with the origin at the top-left of the tray content.
 */

/** Width of one tile; a tandem (width class 2) is exactly two tiles, at zero gap (style FR-S3a/S16). */
const BEAD_W = 64;
const BEAD_H = 72;
/** Empty space between one layer's widest bead and the next layer. */
const LAYER_GAP = 38;
/** Empty space between two lanes. */
const LANE_GAP = 18;
const PAD_X = 18;
const PAD_Y = 14;
/** How far a loop ribbon rises above the higher of its two beads. */
