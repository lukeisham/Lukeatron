    (node ?? tray).focus();
  }

  function cutSelectedRibbon() {
    if (!selectedRibbon) return;
    const { from, to } = selectedRibbon;
    selectedRibbon = null;
    reportFailure(cutRibbon(from, to));
    render();
  }

  /* ----- rogue label editing (FR-C15) ----- */

  function startLabelEdit(uid, half) {
    editing = { uid, half };
    focusEditorNext = true;
    render();
  }

  function commitLabel(input) {
    if (!editing) return;
    const { uid, half } = editing;
    editing = null;
    const result = setLabel(uid, input.value, half === "with" ? { half: "with" } : undefined);
    if (!result.ok) {
      say(result.error.message, "error");
      render();
    }
    beadNodes.get(uid)?.focus();
  }

  function cancelLabel(uid) {
    editing = null;
    render();
    beadNodes.get(uid)?.focus();
  }

  const labelHandlers = {
    onLabelKey(event) {
      if (event.key !== "Enter" && event.key !== "Escape") return;
      if (event.stopPropagation) event.stopPropagation();
      if (event.preventDefault) event.preventDefault();
      if (event.key === "Enter") commitLabel(event.target);
      else if (editing) cancelLabel(editing.uid);
    },
    onLabelBlur(event) {
      commitLabel(event.target);
    },
  };

  /** A rogue bead just added (or a rogue just paired) opens its label field, focused. */
  function findNewRogue(state) {
    if (quietRogueEdit > 0 || !hasRendered) return null;
    const last = state.beads[state.beads.length - 1];
    const added = state.beads.length === lastBeads.size + 1 && last && !lastBeads.has(last.uid);
    if (added && last.elementId === ROGUE.id && last.label === DEFAULT_ROGUE_LABEL) return { uid: last.uid, half: "main" };
    if (state.beads.length !== lastBeads.size) return null;
    const paired = state.beads.filter((bead) => {
      const before = lastBeads.get(bead.uid);
      return before && !before.with && bead.with === ROGUE.id && bead.withLabel === DEFAULT_ROGUE_LABEL;
    });
    return paired.length === 1 ? { uid: paired[0].uid, half: "with" } : null;
  }

  /* ----- opening detail ----- */

  /** Detail for the clicked half; the detail panel needs the rogue label and the other half (FR-V11). */
  function openDetail(bead, which) {
    const halves = beadHalves(bead);
    const clicked = halves.find((half) => half.which === which) ?? halves[0];
    const other = halves.find((half) => half !== clicked);
    const detail = { elementId: clicked.elementId, uid: bead.uid };
    if (bead.note) detail.note = bead.note;
    if (clicked.rogue) detail.label = clicked.label;
    if (other) {
      detail.tandemWith = other.elementId;
      if (other.rogue) detail.tandemWithLabel = other.label;
    }
    emitOnDocument(EVT_OPEN, detail);
  }

  /* ----- rendering ----- */

  function beadStateClasses(node, bead, state) {
    node.classList.toggle("is-active", state.activeUid === bead.uid);
    node.classList.toggle("is-tandem", Boolean(bead.with));
    node.classList.toggle("is-rogue", bead.elementId === ROGUE.id);
    node.classList.toggle("is-link-source", linkFrom === bead.uid);
    node.classList.toggle("is-editing", editing?.uid === bead.uid);
    if (state.activeUid === bead.uid) node.setAttribute("aria-current", "true");
    else node.removeAttribute("aria-current");
  }

  function ensureBeadNode(uid) {
    let node = beadNodes.get(uid);
    if (node) return node;
    node = canvasNode("div", "st-bead");
    node.setAttribute("data-bead-uid", uid);
    node.setAttribute("tabindex", "0");
    node.setAttribute("role", "group");
    node.style.position = "absolute";
    node.style.left = "0px";
    node.style.top = "0px";
    beadNodes.set(uid, node);
    return node;
  }

  function reconcileBeads(state, result) {
    const seen = new Set();
    for (const uid of result.order) {
      const bead = state.beads.find((candidate) => candidate.uid === uid);
      const box = result.positions[uid];
      const node = ensureBeadNode(uid);
      seen.add(uid);
      const editingHalf = editing?.uid === uid ? editing.half : null;
      const signature = beadFaceSignature(bead, result.stepNumbers[uid], editingHalf);
      if (faceSignatures.get(uid) !== signature) {
        faceSignatures.set(uid, signature);
        const dock = fillBeadNode(node, bead, result.stepNumbers[uid], editingHalf, labelHandlers);
        if (dock) dockNodes.set(uid, dock);
        else dockNodes.delete(uid);
      }
      beadStateClasses(node, bead, state);
      node.setAttribute("data-width-class", String(box.widthClass));
      node.setAttribute("data-step", String(result.stepNumbers[uid]));
      node.style.width = `${box.w}px`;
      node.style.height = `${box.h}px`;
      node.style.transform = `translate(${box.x}px, ${box.y}px)`;
    }
    for (const [uid, node] of [...beadNodes]) {
      if (seen.has(uid)) continue;
      node.remove();
      beadNodes.delete(uid);
      dockNodes.delete(uid);
      faceSignatures.delete(uid);
    }
    let cursor = beadsLayer.firstChild;
    for (const uid of result.order) {
      const node = beadNodes.get(uid);
      if (node === cursor) cursor = cursor.nextSibling;
      else beadsLayer.insertBefore(node, cursor);
    }
  }

  function renderThreads(state, result) {
    threadNodes = new Map();
    const groups = [];
    for (const path of result.ribbonPaths) {
      if (!path.curve) continue;
      const selected = selectedRibbon?.from === path.from && selectedRibbon?.to === path.to;
      const group = buildThreadNode(path, result.stepNumbers, selected);
      threadNodes.set(threadKey(path.from, path.to), group);
      groups.push(group);
    }
    svg.replaceChildren(dom.defs, ...groups);
    svg.setAttribute("width", String(result.width));
    svg.setAttribute("height", String(result.height));
    const cutPath = selectedRibbon
      ? result.ribbonPaths.find((path) => path.from === selectedRibbon.from && path.to === selectedRibbon.to)
      : null;
    dom.cut.hidden = !cutPath?.curve;
    if (cutPath?.curve) {
      const middle = pointOnCurve(cutPath.curve, 0.5);
      dom.cut.style.transform = `translate(${middle.x}px, ${middle.y}px)`;
      dom.cut.style.position = "absolute";
      dom.cut.style.left = "0px";
      dom.cut.style.top = "0px";
    }
  }

  function renderStatus(state) {
    const beadCount = state.beads.length;
    let count = `${plural(beadCount, "bead")} · ${plural(state.ribbons.length, "ribbon")}`;
    if (beadCount >= MAX_BEADS) count += ` — the story holds at most ${MAX_BEADS} beads`;
    else if (state.ribbons.length >= MAX_RIBBONS) count += ` — the story holds at most ${MAX_RIBBONS} ribbons`;
    dom.count.textContent = count;
    const active = state.beads.find((bead) => bead.uid === state.activeUid);
    if (active) {
      const title = beadTitle(active);
      dom.next.textContent = `Next tile joins: ${title.symbol} — ${title.name}`;
    } else {
      dom.next.textContent = "Next tile starts a new ribbon";
    }
  }

  function syncButtons(state) {
    const empty = state.beads.length === 0;
    dom.copyButton.disabled = empty;
    dom.printToggle.disabled = empty;
    dom.clearButton.disabled = empty;
    dom.addButton.disabled = !selectedElementId;
    if (empty) {
      dom.printMenu.hidden = true;
      dom.printToggle.setAttribute("aria-expanded", "false");
    }
  }

  function render() {
    const state = getStoryState();
    const result = layout(state.beads, state.ribbons);
    const newRogue = findNewRogue(state);
    if (newRogue) {
      editing = newRogue;
      focusEditorNext = true;
    }
    if (editing && !state.beads.some((bead) => bead.uid === editing.uid)) editing = null;
    if (linkFrom && !state.beads.some((bead) => bead.uid === linkFrom)) linkFrom = null;
    if (selectedRibbon && !state.ribbons.some(([from, to]) => from === selectedRibbon.from && to === selectedRibbon.to)) {
      selectedRibbon = null;
    }
    lastLayout = result;
    tray.setAttribute("data-empty", state.beads.length === 0 ? "true" : "false");
    dom.empty.hidden = state.beads.length > 0;
    content.style.width = `${result.width}px`;
    content.style.height = `${result.height}px`;
    reconcileBeads(state, result);
    renderThreads(state, result);
    renderStatus(state);
    syncButtons(state);
    syncUndo();
    lastBeads = new Map(state.beads.map((bead) => [bead.uid, bead]));
    hasRendered = true;
    applyDropTarget();
    if (focusEditorNext && editing) {
      const input = beadNodes.get(editing.uid)?.querySelector(".st-bead__label-input");
      if (input) {
        input.focus();
        if (input.select) input.select();
      }
    }
    focusEditorNext = false;
  }

  /* ----- drop-target marking (called by drag-drop.js) ----- */

  function mark(node, className) {
    if (!node) return;
    node.classList.add(className);
    markedNodes.push({ node, className });
  }

  function applyDropTarget() {
    for (const { node, className } of markedNodes) node.classList.remove(className);
    markedNodes = [];
    const target = dropTarget;
    if (!target) {
      tray.removeAttribute("data-hint");
      tray.removeAttribute("data-drop");
      return;
    }
    tray.setAttribute("data-drop", target.type);
    if (target.type === "bead") {
      mark(beadNodes.get(target.uid), "is-drop-branch");
      tray.setAttribute("data-hint", HINT_BRANCH);
    } else if (target.type === "ribbon") {
      mark(threadNodes.get(threadKey(target.from, target.to)), "is-drop-insert");
      tray.setAttribute("data-hint", HINT_INSERT);
    } else if (target.type === "dock") {
      mark(dockNodes.get(target.uid), "is-drop-dock");
      tray.setAttribute("data-hint", HINT_DOCK);
    } else {
      mark(tray, "is-drop-add");
      tray.setAttribute("data-hint", HINT_ADD);
    }
  }

  function setDropTarget(target) {
    dropTarget = target ?? null;
    applyDropTarget();
  }

  function setDragging(active, pairable = true) {
    tray.classList.toggle("is-dragging", Boolean(active));
    tray.classList.toggle("is-pairable", Boolean(active && pairable));
    if (!active) setDropTarget(null);
  }

  /* ----- event handling ----- */

  const beadUidOf = (node) => canvasClosest(node, ".st-bead")?.getAttribute("data-bead-uid") ?? null;

  function selectRibbon(group) {
    selectedRibbon = { from: group.getAttribute("data-from"), to: group.getAttribute("data-to") };
    render();
  }

  function onTrayClick(event) {
    const target = event.target;
    if (canvasClosest(target, ".st-bead__label-input")) return;
    if (canvasClosest(target, ".st-thread-cut")) return cutSelectedRibbon();
    const uid = beadUidOf(target);
    if (canvasClosest(target, ".st-bead__remove")) return removeAndRefocus(uid);
    if (canvasClosest(target, ".st-bead__swap")) return void reportFailure(swapTandem(uid));
    if (canvasClosest(target, ".st-bead__split")) return void reportFailure(splitBead(uid));
    if (canvasClosest(target, ".st-bead__link-dot")) return startLink(uid);
    if (uid) {
      if (linkFrom && linkFrom !== uid) return finishLink(uid);
      selectedRibbon = null;
      return void setActive(uid);
    }
    const thread = canvasClosest(target, ".st-thread");
    if (thread) return selectRibbon(thread);
    if (selectedRibbon) {
      selectedRibbon = null;
      render();
    }
  }

  function onTrayDoubleClick(event) {
    const half = canvasClosest(event.target, ".st-bead__half");
    if (!half || canvasClosest(event.target, ".st-bead__label-input")) return;
    const uid = beadUidOf(half);
    const bead = lastBeads.get(uid);
    if (!bead) return;
    const which = half.getAttribute("data-half");
    const elementId = which === "with" ? bead.with : bead.elementId;
    const onLabel = Boolean(canvasClosest(event.target, ".st-bead__name"));
    if (elementId === ROGUE.id && onLabel) startLabelEdit(uid, which);
    else openDetail(bead, which);
  }

  function onBeadKey(event, beadNode) {
    const uid = beadNode.getAttribute("data-bead-uid");
    const key = event.key;
    if (key === "Enter") {
      event.preventDefault?.();
      if (linkFrom && linkFrom !== uid) return finishLink(uid);
      if (linkFrom === uid) {
        linkFrom = null;
        say("Link cancelled.");
        return render();
      }
      return void setActive(uid);
    }
    if (key === "Delete" || key === "Backspace") {
      event.preventDefault?.();
      return removeAndRefocus(uid);
    }
    if ((key === "l" || key === "L") && !event.ctrlKey && !event.metaKey && !event.altKey) {
      event.preventDefault?.();
      return startLink(uid);
    }
    return undefined;
  }

  function onThreadKey(event, group) {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault?.();
      return selectRibbon(group);
    }
    if (event.key === "Delete" || event.key === "Backspace") {
      event.preventDefault?.();
      selectedRibbon = { from: group.getAttribute("data-from"), to: group.getAttribute("data-to") };
      return cutSelectedRibbon();
    }
    return undefined;
  }

  function onTrayKeydown(event) {
    if (canvasIsEditable(event.target)) return undefined;
    if (event.key === "Escape") {
      const hadState = linkFrom || selectedRibbon;
      linkFrom = null;
      selectedRibbon = null;
      if (hadState) render();
      return undefined;
    }
    const thread = canvasClosest(event.target, ".st-thread");
    if (thread) return onThreadKey(event, thread);
    const beadNode = canvasClosest(event.target, ".st-bead");
    if (beadNode && event.target === beadNode) return onBeadKey(event, beadNode);
    return undefined;
  }

  function onDocumentKeydown(event) {
    if (event.ctrlKey || event.metaKey || event.altKey || canvasIsEditable(event.target)) return;
    const key = String(event.key ?? "").toLowerCase();
    if (key === "c") {
      if (selectedElementId) {
        event.preventDefault?.();
        addSelectedTile();
      }
    } else if (key === "t") {
      event.preventDefault?.();
      if (event.shiftKey) splitTargetBead();
      else pairSelectedTile();
    }
  }

  function onDocumentSelect(event) {
    selectedElementId = event.detail?.elementId ?? null;
    dom.addButton.disabled = !selectedElementId;
  }

  function onNotice(event) {
    const message = event.detail?.message;
    if (message) say(message, "error");
  }

  // An agent's save reaches storage without passing through the canvas, so the session event is the cue to re-read the saved list.
  function onAgentSession(event) {
    renderSaved();
    const { active, name } = event.detail ?? {};
    if (active) {
      say(AGENT_STATUS_TEXT);
      if (name) dom.nameInput.value = name;
    } else if (dom.message.textContent === AGENT_STATUS_TEXT) {
      say("");
    }
  }

  function onStoryChanged(event) {
    const detail = event.detail ?? getStoryState();
    try {
      writeDraft(detail.beads, detail.ribbons, storage);
    } catch (error) {
      console.warn(`story-canvas: could not write the draft: ${error?.message ?? error}`);
    }
    checkStorage();
    render();
  }

  async function onCopy() {
    const state = getStoryState();
    if (state.beads.length === 0) return;
    const result = layout(state.beads, state.ribbons);
    const text = storyText(dom.nameInput.value.trim(), state.beads, state.ribbons, result);
    let copied = { ok: false };
    try {
      copied = await doCopy(text);
    } catch (error) {
      console.warn(`story-canvas: copy failed: ${error?.message ?? error}`);
    }
    say(copied.ok ? "Copied the story to the clipboard." : "Could not copy — select the text and copy it by hand.", copied.ok ? "info" : "error");
  }

  function togglePrintMenu(open) {
    const next = open ?? dom.printMenu.hidden;
    dom.printMenu.hidden = !next;
    dom.printToggle.setAttribute("aria-expanded", next ? "true" : "false");
  }

  function onPrintChoice(option) {
    togglePrintMenu(false);
    doPrint(option.getAttribute("data-print-target"), option.getAttribute("data-print-tone"));
  }

  function onSavedClick(event) {
    const item = canvasClosest(event.target, ".st-story__saved-item");
    if (!item) return;
    const name = item.getAttribute("data-story-name");
    if (canvasClosest(event.target, ".st-story__delete")) askDelete(name);
    else if (canvasClosest(event.target, ".st-story__open")) openSaved(name);
  }

  function onToolbarKeydown(event) {
    if (event.key !== "Escape") return;
    if (!dom.printMenu.hidden) togglePrintMenu(false);
    if (!dom.prompt.hidden) clearPrompt();
  }

  /* ----- wiring ----- */

  const on = (node, type, handler) => node.addEventListener(type, handler);
  const doc = globalThis.document;
  on(dom.saveButton, "click", onSave);
  on(dom.nameInput, "keydown", (event) => {
    if (event.key === "Enter") onSave();
  });
  on(dom.newRibbonButton, "click", () => void newRibbon());
  on(dom.addButton, "click", addSelectedTile);
  on(dom.clearButton, "click", () => void clearStory());
  on(dom.undoButton, "click", () => {
    const result = undoClear();
    if (!result.ok) say(result.error.message, "error");
  });
  on(dom.copyButton, "click", onCopy);
  on(dom.printToggle, "click", () => togglePrintMenu());
  on(dom.printMenu, "click", (event) => {
    const option = canvasClosest(event.target, ".st-story__print-option");
    if (option) onPrintChoice(option);
  });
  on(dom.libraryButton, "click", () => emitOnDocument(EVT_OPEN_LIBRARY, {}));
  on(dom.savedList, "click", onSavedClick);
  on(dom.root.querySelector(".st-story__toolbar"), "keydown", onToolbarKeydown);
  on(tray, "click", onTrayClick);
  on(tray, "dblclick", onTrayDoubleClick);
  on(tray, "keydown", onTrayKeydown);
  doc.addEventListener(EVT_STORY_CHANGED, onStoryChanged);
  doc.addEventListener(EVT_SELECT, onDocumentSelect);
  doc.addEventListener(EVT_NOTICE, onNotice);
  doc.addEventListener(EVT_AGENT_SESSION, onAgentSession);
  doc.addEventListener("keydown", onDocumentKeydown);

  // Runs inside setPrintTarget just before window.print(); the layout width is the map's true width, unaffected by the on-screen tray.
  function onBeforePrint(event) {
    if (!MAP_PRINT_TARGETS.includes(event.detail?.target)) return;
    content.style.setProperty(PRINT_SCALE_PROPERTY, String(printScaleFor(lastLayout.width)));
  }
  function onAfterPrint() {
    content.style.removeProperty(PRINT_SCALE_PROPERTY);
  }
  doc.addEventListener(EVT_BEFORE_PRINT, onBeforePrint);
  doc.addEventListener(EVT_AFTER_PRINT, onAfterPrint);

  function restoreDraft() {
    try {
      const draft = readDraft(storage);
      if (!draft.ok || draft.beads.length === 0 || getStoryState().beads.length > 0) return;
      quietRogueEdit += 1;
      try {
        const loaded = openStory({ beads: draft.beads, ribbons: draft.ribbons });
        if (loaded.ok && loaded.note) say(loaded.note);
      } finally {
        quietRogueEdit -= 1;
      }
    } catch (error) {
      console.warn(`story-canvas: could not restore the draft: ${error?.message ?? error}`);
    }
  }

  function destroy() {
    doc.removeEventListener(EVT_STORY_CHANGED, onStoryChanged);
    doc.removeEventListener(EVT_SELECT, onDocumentSelect);
    doc.removeEventListener(EVT_NOTICE, onNotice);
    doc.removeEventListener(EVT_AGENT_SESSION, onAgentSession);
    doc.removeEventListener("keydown", onDocumentKeydown);
    doc.removeEventListener(EVT_BEFORE_PRINT, onBeforePrint);
    doc.removeEventListener(EVT_AFTER_PRINT, onAfterPrint);
    if (undoTimerId !== null) stopTimer(undoTimerId);
    undoTimerId = null;
    dom.root.remove();
  }

  restoreDraft();
  render();
  renderSaved();

  return {
    areaEl: dom.root,
    canvasEl: content,
    trayEl: tray,
    contentEl: content,
    threadsEl: svg,
    getLayoutResult: () => lastLayout,
    setDropTarget,
    setDragging,
    showMessage: say,
    openShape,
    loadShape,
    hasUnsavedChanges,
    render,
    destroy,
  };
}

// ---- story/drag-drop.js ----
/**
 * drag-drop.js — the pointer gestures that build and edit the story map (story-map FR-C2..C6).
 *
 * Three gestures, all with pointer events (documentation D-4), all starting only after a move of more
 * than DRAG_THRESHOLD_PX so a plain press stays a click (D-5):
 *   - "tile": a diagram tile (or the Rogue card) dragged into the tray  -> addBead / pairBead
 *   - "bead": a bead dragged around                                     -> moveBead / mergeBeads / removeBead
 *   - "link": a bead's link dot dragged onto another bead                -> linkBeads
 * A background press is never ours: dragging the diagram background pans (viewport.js, D-6).
 *
 * This file only calls the model; it never edits a story itself (documentation contract row).
 */

/** Width and height of a bead's dock notch (style FR-S16); half of it sits outside the bead's right edge. */
const DOCK_WIDTH = 14;
const DOCK_HEIGHT = 30;
/** How close (px) the pointer must be to a ribbon's curve to count as "on" it (FR-C3). */
const RIBBON_HIT_DISTANCE = 14;

const RIBBON_SAMPLES = 32;
const DRAG_SVG_NS = "http://www.w3.org/2000/svg";
const DRAG_DEFAULT_MS = 180;
const DRAG_FALLBACK_STORE = Object.freeze({ addBead, moveBead, removeBead, linkBeads, pairBead, mergeBeads, getStoryState });
const DRAG_IGNORED_PRESS = ".st-bead__remove, .st-bead__dock, input, textarea, button, select";
const DRAG_CAPS_PARTS = ["is-dragging", "is-dragging-pairable"];

/* ---------- pure geometry: no DOM ---------- */

function dragRectContains(rect, x, y) {
  return x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h;
}

function dockRectOf(position) {
  return {
    x: position.x + position.w - DOCK_WIDTH / 2,
    y: position.y + position.h / 2 - DOCK_HEIGHT / 2,
    w: DOCK_WIDTH,
    h: DOCK_HEIGHT,
  };
}

function pointToSegmentDistance(px, py, a, b) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const lengthSquared = dx * dx + dy * dy;
  const t = lengthSquared === 0 ? 0 : Math.max(0, Math.min(1, ((px - a.x) * dx + (py - a.y) * dy) / lengthSquared));
  return Math.hypot(px - (a.x + t * dx), py - (a.y + t * dy));
}

function distanceToCurve(point, curve) {
  let best = Infinity;
  let previous = pointOnCurve(curve, 0);
  for (let i = 1; i <= RIBBON_SAMPLES; i++) {
    const next = pointOnCurve(curve, i / RIBBON_SAMPLES);
    best = Math.min(best, pointToSegmentDistance(point.x, point.y, previous, next));
    previous = next;
  }
  return best;
}

function curveOfPath(path, layoutResult) {
  return path.curve ?? ribbonCurve([path.from, path.to], layoutResult, path.loop);
}

function nearestRibbon(point, layoutResult, excludeUid, maxDistance) {
  let best = null;
  let bestDistance = maxDistance;
  for (const path of layoutResult.ribbonPaths ?? []) {
    if (path.from === excludeUid || path.to === excludeUid) continue;
    const curve = curveOfPath(path, layoutResult);
    if (!curve) continue;
    const distance = distanceToCurve(point, curve);
    if (distance <= bestDistance) {
      bestDistance = distance;
      best = { type: "ribbon", from: path.from, to: path.to };
    }
  }
  return best;
}

/**
 * What would a release at `point` do? Priority: dock, then bead, then ribbon, then empty tray space.
 *
 * @param {{x:number,y:number}} point in canvas-content pixels (the layout's coordinate space)
 * @param {{ positions?: object, ribbonPaths?: Array }|null} layoutResult from `layout()`
 * @param {Array<{uid:string, with?:string}>} [beads] used to tell which beads are already tandems
 * @param {{ inTray?: boolean, excludeUid?: string|null, canPair?: boolean, ribbonDistance?: number }} [options]
 *   `inTray` false means the pointer is off the tray (result null); `excludeUid` is the bead being dragged
 *   (hitting it or its dock gives `{type:"self"}`, and its own ribbons are skipped); `canPair` says whether
 *   the dragged thing could join a bead in tandem, which decides whether docks exist.
 * @returns {{type:"dock"|"bead"|"self",uid:string}|{type:"ribbon",from:string,to:string}|{type:"empty"}|null}
 *   `self` is not a model target: it means "back where it came from". `null` means off the tray.
 */
function hitTest(point, layoutResult, beads = [], options = {}) {
  const { inTray = true, excludeUid = null, canPair = true, ribbonDistance = RIBBON_HIT_DISTANCE } = options;
  if (!inTray) return null;
  if (!point || !layoutResult) return { type: "empty" };
  const positions = layoutResult.positions ?? {};
  const tandemUids = new Set(beads.filter((bead) => bead.with).map((bead) => bead.uid));
  const isTandem = (uid) => tandemUids.has(uid) || positions[uid].widthClass === 2;
  const uids = Object.keys(positions);

  for (const uid of uids) {
    if (isTandem(uid) || !dragRectContains(dockRectOf(positions[uid]), point.x, point.y)) continue;
    if (uid === excludeUid) return { type: "self", uid };
    if (canPair) return { type: "dock", uid };
  }
  for (const uid of uids) {
    if (!dragRectContains(positions[uid], point.x, point.y)) continue;
    return uid === excludeUid ? { type: "self", uid } : { type: "bead", uid };
  }
  return nearestRibbon(point, layoutResult, excludeUid, ribbonDistance) ?? { type: "empty" };
}

/**
 * Milliseconds from a CSS time string ("180ms", "0.18s"); `fallback` when unreadable.
 * @param {string|undefined|null} text
 * @param {number} fallback
 * @returns {number}
 */
function parseDurationMs(text, fallback) {
  const match = /^\s*(-?\d*\.?\d+)\s*(ms|s)\s*$/.exec(text ?? "");
  if (!match) return fallback;
  return match[2] === "s" ? Number(match[1]) * 1000 : Number(match[1]);
}

function dragTargetKey(target) {
  if (!target || target.type === "self") return "none";
  return `${target.type}|${target.uid ?? ""}|${target.from ?? ""}|${target.to ?? ""}`;
}

function dragModelTarget(target) {
  return { ...target };
}

/* ---------- the mount ---------- */

/**
 * Wire the drag gestures.
 *
 * @param {{ diagramHost: HTMLElement, canvas: { canvasEl: HTMLElement, trayEl: HTMLElement,
 *   getLayoutResult: () => object, setDropTarget: (target: object|null) => void, render: () => void } }} parts
 * @param {{ store?: object, document?: Document, window?: Window }} [options] `store` defaults to the app's
 *   story model; tests pass a fake with the same method names.
 * @returns {{ destroy: () => void }}
 */
function mountDragDrop({ diagramHost, canvas }, options = {}) {
  const store = options.store ?? DRAG_FALLBACK_STORE;
  const doc = options.document ?? globalThis.document;
  const win = options.window ?? globalThis.window ?? {};
  const liveGhosts = new Set();
  let gesture = null;
  let clickGuard = null;

  /* ----- environment helpers ----- */

  const prefersReducedMotion = () => Boolean(win.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches);
  const motionMs = (name) => {
    const value = win.getComputedStyle?.(doc.documentElement)?.getPropertyValue(name);
    return parseDurationMs(value, DRAG_DEFAULT_MS);
  };

  function toCanvasPoint(event) {
    const rect = canvas.canvasEl.getBoundingClientRect();
    return {
      x: event.clientX - rect.left + (canvas.canvasEl.scrollLeft || 0),
      y: event.clientY - rect.top + (canvas.canvasEl.scrollTop || 0),
    };
  }

  function canvasToClient(x, y) {
    const rect = canvas.canvasEl.getBoundingClientRect();
    return { x: x + rect.left - (canvas.canvasEl.scrollLeft || 0), y: y + rect.top - (canvas.canvasEl.scrollTop || 0) };
  }

  function pointerIsInTray(event) {
    const rect = canvas.trayEl.getBoundingClientRect();
    return event.clientX >= rect.left && event.clientX <= rect.right && event.clientY >= rect.top && event.clientY <= rect.bottom;
  }

  function showNotice(message) {
    canvas.setDropTarget(null);
    doc.dispatchEvent(new CustomEvent(EVT_NOTICE, { detail: { message } }));
  }

  /* ----- ghost ----- */

  function buildGhost(source, rect) {
    let ghost;
    if (source.namespaceURI === DRAG_SVG_NS) {
      ghost = doc.createElementNS(DRAG_SVG_NS, "svg");
      const box = source.getBBox?.() ?? { x: 0, y: 0, width: rect.width, height: rect.height };
      ghost.setAttribute("viewBox", `${box.x} ${box.y} ${box.width} ${box.height}`);
      ghost.appendChild(source.cloneNode(true));
    } else {
      ghost = source.cloneNode(true);
      for (const control of [...ghost.querySelectorAll(".st-bead__remove, .st-bead__dock, .st-bead__link-dot")]) control.remove();
    }
    for (const node of [ghost, ...ghost.querySelectorAll("[data-element-id], [data-bead-uid]")]) {
      node.removeAttribute("data-element-id");
      node.removeAttribute("data-bead-uid");
      node.removeAttribute("tabindex");
      node.removeAttribute("id");
    }
    ghost.classList.add("st-ghost");
    ghost.setAttribute("aria-hidden", "true");
    const style = ghost.style;
    style.position = "fixed";
    style.left = "0px";
    style.top = "0px";
    style.margin = "0";
    style.width = `${rect.width}px`;
    style.height = `${rect.height}px`;
    style.pointerEvents = "none";
    style.zIndex = "1000";
    doc.body.appendChild(ghost);
    return ghost;
  }

  function placeGhost(x, y) {
    gesture.ghost.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    gesture.ghostX = x;
    gesture.ghostY = y;
  }

  function retireGhost(ghost, keyframes, onDone) {
    const finish = () => {
      liveGhosts.delete(ghost);
      ghost.remove();
      onDone?.();
    };
    liveGhosts.add(ghost);
    if (prefersReducedMotion() || typeof ghost.animate !== "function") {
      finish();
      return;
    }
    const animation = ghost.animate(keyframes, { duration: motionMs("--m-base"), easing: "cubic-bezier(0.22, 1, 0.36, 1)", fill: "forwards" });
    animation.finished.then(finish, finish);
  }

  const ghostTransform = (x, y, scale = 1) => `translate3d(${x}px, ${y}px, 0) scale(${scale})`;

  function glideBack(state) {
    const from = ghostTransform(state.ghostX, state.ghostY);
    const to = ghostTransform(state.originRect.left, state.originRect.top);
    retireGhost(state.ghost, [{ transform: from, opacity: 1 }, { transform: to, opacity: 0.6 }], () => state.source.classList.remove("is-picked"));
  }

  function settleInto(state, uid) {
    const position = uid ? canvas.getLayoutResult()?.positions?.[uid] : null;
    const at = position ? canvasToClient(position.x + position.w / 2 - state.originRect.width / 2, position.y + position.h / 2 - state.originRect.height / 2) : { x: state.ghostX, y: state.ghostY };
    state.source.classList.remove("is-picked");
    retireGhost(state.ghost, [
      { transform: ghostTransform(state.ghostX, state.ghostY), opacity: 1 },
      { transform: ghostTransform(at.x, at.y, 1.06), opacity: 1, offset: 0.7 },
      { transform: ghostTransform(at.x, at.y, 1), opacity: 0 },
    ]);
  }

  function vanish(state) {
    state.source.classList.remove("is-picked");
    retireGhost(state.ghost, [
      { transform: ghostTransform(state.ghostX, state.ghostY), opacity: 1 },
      { transform: ghostTransform(state.ghostX, state.ghostY, 0.6), opacity: 0 },
    ]);
  }

  /* ----- starting a press ----- */

  function beadOf(element) {
    return element.closest(".st-bead");
  }

  function startPending(event, details) {
    if (gesture) return;
    gesture = { pointerId: event.pointerId, startX: event.clientX, startY: event.clientY, dragging: false, ...details };
    doc.addEventListener("pointermove", onPointerMove);
    doc.addEventListener("pointerup", onPointerUp);
    doc.addEventListener("pointercancel", onPointerCancel);
    doc.addEventListener("keydown", onKeyDown, true);
  }

  const isPrimaryPress = (event) => event.button === 0 && event.isPrimary !== false;

  function onTilePress(event) {
    if (!isPrimaryPress(event) || !event.target?.closest) return;
    const tile = event.target.closest("[data-element-id]");
    if (!tile) return;
    startPending(event, { kind: "tile", source: tile, elementId: tile.getAttribute("data-element-id") });
  }

  function onCanvasPress(event) {
    if (!isPrimaryPress(event) || !event.target?.closest) return;
    const linkDot = event.target.closest(".st-bead__link-dot");
    const bead = beadOf(event.target);
    if (!bead) return;
    const beadUid = bead.getAttribute("data-bead-uid");
    if (linkDot) {
      startPending(event, { kind: "link", source: bead, beadUid });
      return;
    }
    if (event.target.closest(DRAG_IGNORED_PRESS)) return;
    startPending(event, { kind: "bead", source: bead, beadUid });
  }

  /* ----- during a drag ----- */

  function beginDrag(event) {
    const state = gesture;
    state.dragging = true;
    state.highlightKey = "none";
    state.beads = store.getStoryState().beads;
    doc.body?.classList.add("st-is-dragging");
    if (state.kind === "link") {
      state.linkPath = null;
      return;
    }
    const rect = state.source.getBoundingClientRect();
    state.originRect = rect;
    state.grabX = state.startX - rect.left;
    state.grabY = state.startY - rect.top;
    state.ghost = buildGhost(state.source, rect);
    state.source.classList.add("is-picked");
    state.canPair = state.kind === "tile" || !state.beads.find((bead) => bead.uid === state.beadUid)?.with;
    canvas.trayEl.classList.add(DRAG_CAPS_PARTS[0]);
    if (state.canPair) canvas.trayEl.classList.add(DRAG_CAPS_PARTS[1]);
  }

  function targetAt(event) {
    const state = gesture;
    return hitTest(toCanvasPoint(event), canvas.getLayoutResult(), state.beads, {
      inTray: pointerIsInTray(event),
      excludeUid: state.beadUid ?? null,
      canPair: state.kind === "link" ? false : state.canPair,
    });
  }

  function highlight(target) {
    const key = dragTargetKey(target);
    if (key === gesture.highlightKey) return;
    gesture.highlightKey = key;
    canvas.setDropTarget(key === "none" ? null : dragModelTarget(target));
  }

  function findBeadElement(uid) {
    return [...canvas.canvasEl.querySelectorAll(".st-bead")].find((el) => el.getAttribute("data-bead-uid") === uid) ?? null;
  }

  function markLinkTarget(target) {
    const uid = target?.type === "bead" ? target.uid : null;
    if (uid === gesture.linkTargetUid) return;
    if (gesture.linkTargetUid) findBeadElement(gesture.linkTargetUid)?.classList.remove("is-link-target");
    gesture.linkTargetUid = uid;
    if (uid) findBeadElement(uid)?.classList.add("is-link-target");
  }

  function drawTempLink(event) {
    const state = gesture;
    const threads = canvas.canvasEl.querySelector("svg.st-threads");
    if (!threads) return;
    if (!state.linkPath) {
      state.linkPath = doc.createElementNS(DRAG_SVG_NS, "path");
      state.linkPath.setAttribute("class", "st-thread--temp");
      state.linkPath.setAttribute("aria-hidden", "true");
      state.linkPath.style.pointerEvents = "none";
    }
    if (state.linkPath.parentNode !== threads) threads.appendChild(state.linkPath);
    const from = canvas.getLayoutResult()?.positions?.[state.beadUid];
    const end = toCanvasPoint(event);
    const start = from ? { x: from.x + from.w, y: from.y + from.h / 2 } : end;
    const reach = Math.max(24, Math.abs(end.x - start.x) / 2);
    state.linkPath.setAttribute("d", `M ${start.x} ${start.y} C ${start.x + reach} ${start.y}, ${end.x - reach} ${end.y}, ${end.x} ${end.y}`);
  }

  function onPointerMove(event) {
    if (!gesture || event.pointerId !== gesture.pointerId) return;
    if (!gesture.dragging) {
      if (Math.hypot(event.clientX - gesture.startX, event.clientY - gesture.startY) <= DRAG_THRESHOLD_PX) return;
      beginDrag(event);
    }
    event.preventDefault?.();
    if (gesture.kind === "link") {
      drawTempLink(event);
      markLinkTarget(targetAt(event));
      return;
    }
    placeGhost(event.clientX - gesture.grabX, event.clientY - gesture.grabY);
    highlight(targetAt(event));
  }

  /* ----- finishing ----- */

  function swallowNextClick() {
    clickGuard?.();
    const remove = () => {
      clickGuard = null;
      win.removeEventListener?.("click", swallow, true);
      win.removeEventListener?.("pointerdown", remove, true);
    };
    const swallow = (event) => {
      event.stopPropagation();
      event.preventDefault?.();
      remove();
    };
    win.addEventListener?.("click", swallow, true);
    win.addEventListener?.("pointerdown", remove, true);
    clickGuard = remove;
  }

  /** Detach listeners and undo every mark the gesture put on the page; the ghost is handled separately. */
  function endGesture() {
    const state = gesture;
    if (!state) return;
    gesture = null;
    doc.removeEventListener("pointermove", onPointerMove);
    doc.removeEventListener("pointerup", onPointerUp);
    doc.removeEventListener("pointercancel", onPointerCancel);
    doc.removeEventListener("keydown", onKeyDown, true);
    if (!state.dragging) return;
    doc.body?.classList.remove("st-is-dragging");
    for (const name of DRAG_CAPS_PARTS) canvas.trayEl.classList.remove(name);
    if (state.linkTargetUid) findBeadElement(state.linkTargetUid)?.classList.remove("is-link-target");
    state.linkPath?.remove();
    if (state.highlightKey && state.highlightKey !== "none") canvas.setDropTarget(null);
    swallowNextClick();
  }

  function callModel(state, target) {
    const { kind, elementId, beadUid } = state;
    if (kind === "tile") {
      if (target.type === "dock") return { result: store.pairBead(target.uid, elementId), settleUid: target.uid };
      const result = store.addBead(elementId, dragModelTarget(target));
      return { result, settleUid: result.uid };
    }
    if (target.type === "dock") return { result: store.mergeBeads(beadUid, target.uid), settleUid: target.uid };
    return { result: store.moveBead(beadUid, dragModelTarget(target)), settleUid: beadUid };
  }

  function commitDrop(state, target) {
    if (state.kind === "bead" && target === null) {
      const result = store.removeBead(state.beadUid);
      if (result.ok) vanish(state);
      else refuse(state, result);
      return;
    }
    if (target === null || target.type === "self") {
      glideBack(state);
      return;
    }
    const { result, settleUid } = callModel(state, target);
    if (result.ok) settleInto(state, settleUid);
    else refuse(state, result);
  }

  function refuse(state, result) {
    showNotice(result.error?.message ?? "That could not be done");
    glideBack(state);
  }

  function commitLink(state, target) {
    if (target?.type !== "bead") return;
    const result = store.linkBeads(state.beadUid, target.uid);
    if (!result.ok) showNotice(result.error?.message ?? "That link could not be made");
  }

  function onPointerUp(event) {
    if (!gesture || event.pointerId !== gesture.pointerId) return;
    const state = gesture;
    if (!state.dragging) {
      endGesture();
      return;
    }
    const target = targetAt(event);
    endGesture();
    try {
      if (state.kind === "link") commitLink(state, target);
      else commitDrop(state, target);
    } catch (error) {
      console.warn("drag-drop: the story model threw on release; drag cancelled", error);
      if (state.ghost) glideBack(state);
    }
  }

  function cancelDrag() {
    const state = gesture;
    if (!state) return;
    endGesture();
    if (state.dragging && state.ghost) glideBack(state);
  }

  function onPointerCancel(event) {
    if (gesture && event.pointerId === gesture.pointerId) cancelDrag();
  }

  function onKeyDown(event) {
    if (event.key !== "Escape" || !gesture?.dragging) return;
    event.stopPropagation();
    event.preventDefault?.();
    cancelDrag();
  }

  diagramHost.addEventListener("pointerdown", onTilePress);
  canvas.canvasEl.addEventListener("pointerdown", onCanvasPress);

  return {
    destroy() {
      cancelDrag();
      endGesture();
      clickGuard?.();
      diagramHost.removeEventListener("pointerdown", onTilePress);
      canvas.canvasEl.removeEventListener("pointerdown", onCanvasPress);
      for (const ghost of liveGhosts) ghost.remove();
      liveGhosts.clear();
    },
  };
}

// ---- story/story-highlight.js ----
/**
 * story-highlight.js — marks the poster tiles used by the open story (library.spec FR-L8, diagram FR-D10).
 *
 * It only toggles the class `is-in-story` on each `<g class="tile">` and fills or hides the
 * `<text class="step-badge">` the diagram generator put inside it. It never touches tile data or the
 * printed table: the mark itself is drawn by CSS (style FR-S12).
 */

const IN_STORY_CLASS = "is-in-story";
const TILE_SELECTOR = "g.tile";
const BADGE_SELECTOR = ".step-badge";

/** Element ids a bead uses: its own and, for a tandem, its partner's. */
function idsOfBead(bead) {
  return bead.with ? [bead.elementId, bead.with] : [bead.elementId];
}

/**
 * The ids of every poster element used in a story. The Rogue card is not a poster tile, so it is never included.
 * @param {Array<{ elementId: string, with?: string }>} beads
 * @returns {Set<string>}
 */
function elementsInStory(beads) {
  const ids = new Set();
  for (const bead of beads) {
    for (const id of idsOfBead(bead)) {
      if (id !== ROGUE.id) ids.add(id);
    }
  }
  return ids;
}

/**
 * The step number to show on each element: the lowest step of any bead that uses it (FR-L8).
 * Both halves of a tandem take the tandem's step. Beads missing from `stepNumbers` are skipped.
 * @param {Array<{ uid: string, elementId: string, with?: string }>} beads
 * @param {{ stepNumbers: Record<string, number> }} layoutResult result of `layout()`
 * @returns {Record<string, number>} element id to step number
 */
function badgeFor(beads, layoutResult) {
  const steps = {};
  for (const bead of beads) {
    const step = layoutResult.stepNumbers[bead.uid];
    if (step === undefined) continue;
    for (const id of idsOfBead(bead)) {
      if (id === ROGUE.id) continue;
      if (!Object.hasOwn(steps, id) || step < steps[id]) steps[id] = step;
    }
  }
  return steps;
}

function showBadge(badge, step) {
  badge.textContent = String(step);
  badge.removeAttribute("hidden");
}

function hideBadge(badge) {
  badge.textContent = "";
  badge.setAttribute("hidden", "");
}

/**
 * Keeps the diagram's tile marks in step with the story map.
 * Options (for tests): `eventTarget` (default `document`), `getState` (default the app store),
 * `layoutFn` (default `layout`).
 * @param {Element} diagramHost the element holding the diagram's `<svg>`
 * @returns {{ refresh: () => void, destroy: () => void }} call `refresh()` after the diagram is redrawn
 */
function mountStoryHighlight(diagramHost, options = {}) {
  const eventTarget = options.eventTarget ?? globalThis.document;
  const getState = options.getState ?? getStoryState;
  const layoutFn = options.layoutFn ?? layout;
  const warnedTiles = new WeakSet();
  let current = { beads: [], ribbons: [] };

  function warnOnceAboutBadge(tile, elementId) {
    if (warnedTiles.has(tile)) return;
    warnedTiles.add(tile);
    console.warn(`story-highlight: tile "${elementId}" has no .step-badge element; its step number is skipped`);
  }

  function applyMarks() {
    const { beads, ribbons } = current;
    const inStory = elementsInStory(beads);
    const steps = inStory.size > 0 ? badgeFor(beads, layoutFn(beads, ribbons)) : {};
    for (const tile of diagramHost.querySelectorAll(TILE_SELECTOR)) {
      const elementId = tile.getAttribute("data-element-id");
      const marked = inStory.has(elementId);
      tile.classList.toggle(IN_STORY_CLASS, marked);
      const badge = tile.querySelector(BADGE_SELECTOR);
      if (!badge) {
        if (marked) warnOnceAboutBadge(tile, elementId);
        continue;
      }
      if (marked && Object.hasOwn(steps, elementId)) showBadge(badge, steps[elementId]);
      else hideBadge(badge);
    }
  }

  function setStory(state) {
    current = { beads: state?.beads ?? [], ribbons: state?.ribbons ?? [] };
    applyMarks();
  }

  const onChanged = (event) => setStory(event.detail);
  eventTarget?.addEventListener?.(EVT_STORY_CHANGED, onChanged);
  setStory(getState());

  return {
    refresh: () => applyMarks(),
    destroy: () => eventTarget?.removeEventListener?.(EVT_STORY_CHANGED, onChanged),
  };
}

// ---- data/library.js ----
// The shipped library: twelve narrative types, one story map each (library.spec FR-L1).
// Every entry uses the saved-story shape plus a one-line `note` on each bead.
// Adding an entry is a data edit only (FR-L7). Element ids must exist in ELEMENTS;
// notes are facts about the lead work, at most 80 characters (FR-L6).

const POSTER_CREDIT =
  "Built from the outline in the Periodic Table of Storytelling (ComputerSherpa)";

/** Credit line for an entry we authored ourselves (FR-L5). */
function authoredCredit(lead, type) {
  return `Our reading of ${lead} as ${type} — an interpretation`;
}

/**
 * Freezes a value and everything reachable from it, so no entry can be edited (FR-L4).
 * Recursion is safe here: the library is plain nested arrays and objects with no cycles.
 */
function deepFreezeLibrary(value) {
  if (value === null || typeof value !== "object" || Object.isFrozen(value)) return value;
  for (const child of Object.values(value)) deepFreezeLibrary(child);
  return Object.freeze(value);
}
