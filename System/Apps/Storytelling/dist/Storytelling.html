      ["b3", "b6"], ["b5", "b7"], ["b6", "b7"],
    ],
  },
];

/** The twelve ready-made story maps, in seed-list order. Deep-frozen: never edit an entry. */
const LIBRARY = deepFreezeLibrary(ENTRIES);

// ---- story/library-panel.js ----
/**
 * library-panel.js — the Library panel (library.spec FR-L2, FR-L3, FR-L5).
 *
 * Lists the twelve ready-made story maps and opens the chosen one as an editable copy through the
 * story model's `openStory`. The frozen `LIBRARY` entries are only read here, never changed (FR-L4).
 * Panel visibility uses the `hidden` attribute.
 */

const CLS = "st-library-panel";
const REPLACE_QUESTION = "Replace the map on screen?";

function element(doc, tag, className, text) {
  const node = doc.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function button(doc, className, label) {
  const node = element(doc, "button", className, label);
  node.setAttribute("type", "button");
  return node;
}

/** Example works with the lead first (FR-L2), whatever order the data lists them in. */
function examplesLeadFirst(entry) {
  return [entry.lead, ...entry.examples.filter((name) => name !== entry.lead)];
}

const ELEMENT_NAMES = new Map(ELEMENTS.map((el) => [el.id, el.name]));

/** A bead's element name, with its tandem partner when it has one; the id itself if the element is unknown. */
function beadName(bead, names) {
  const nameOf = (id) => names.get(id) ?? id;
  return bead.with ? `${nameOf(bead.elementId)} + ${nameOf(bead.with)}` : nameOf(bead.elementId);
}

/** The one line under a card: how many elements the map has and where it starts and ends. */
function summaryOf(entry, names = ELEMENT_NAMES) {
  const beads = entry.beads;
  if (beads.length === 0) return "";
  const first = beadName(beads[0], names);
  if (beads.length === 1) return `One element: ${first}.`;
  return `${beads.length} elements, from ${first} to ${beadName(beads[beads.length - 1], names)}.`;
}

/** The hover-over text: the credit, then each element in the map with its one-line explanation. */
function hoverTextOf(entry, names = ELEMENT_NAMES) {
  const steps = entry.beads.map((bead, index) => {
    const line = `${index + 1}. ${beadName(bead, names)}`;
    return bead.note ? `${line} — ${bead.note}` : line;
  });
  return [entry.credit, "", ...steps].join("\n");
}

const librarySignatureOf = (state) => JSON.stringify([state.beads, state.ribbons]);

/**
 * @param {Element} host the `#library-panel` element
 * @param {{ library?: object[], open?: (shape: object) => object, getState?: () => object,
 *   isDirty?: () => boolean, onOpened?: (info: { entry: object, result: object }) => void,
 *   doc?: Document, eventTarget?: EventTarget }} [options] all injectable for tests
 * @returns {{ open: () => void, close: () => void, isOpen: () => boolean, markClean: () => void }}
 *   `markClean()` tells the panel the map on screen is saved or freshly opened (the canvas calls it after
 *   a save or opening a saved story), so opening another entry does not ask first.
 */
function mountLibraryPanel(host, options = {}) {
  const doc = options.doc ?? globalThis.document;
  const eventTarget = options.eventTarget ?? doc;
  const library = options.library ?? LIBRARY;
  const names = options.names ?? ELEMENT_NAMES;
  const openShape = options.open ?? openStory;
  const getState = options.getState ?? getStoryState;
  let cleanSignature = null;
  let pendingEntry = null;
  let returnFocusTo = null;

  // A non-empty map counts as unsaved unless it is exactly what a library open (or markClean) left.
  const isDirty = options.isDirty ?? (() => {
    const state = getState();
    return state.beads.length > 0 && librarySignatureOf(state) !== cleanSignature;
  });

  host.className = CLS;
  host.setAttribute("role", "dialog");
  host.setAttribute("aria-label", "Library of story maps");
  host.hidden = true;

  const title = element(doc, "h2", `${CLS}__title`, "Library");
  const hint = element(doc, "p", `${CLS}__hint`, "Open a ready-made story map as your own editable copy.");
  const closeButton = button(doc, `${CLS}__close`, "Close");
  const list = element(doc, "ul", `${CLS}__list`);
  const status = element(doc, "p", `${CLS}__status`);
  status.setAttribute("role", "status");

  const confirm = element(doc, "div", `${CLS}__confirm`);
  confirm.setAttribute("role", "alertdialog");
  confirm.setAttribute("aria-label", REPLACE_QUESTION);
  confirm.hidden = true;
  const confirmQuestion = element(doc, "p", `${CLS}__confirm-question`, REPLACE_QUESTION);
  const replaceButton = button(doc, `${CLS}__replace`, "Replace");
  const keepButton = button(doc, `${CLS}__keep`, "Keep my map");
  confirm.append(confirmQuestion, replaceButton, keepButton);

  const entryButtons = new Map();
  for (const entry of library) {
    const item = element(doc, "li", `${CLS}__item`);
    const choose = button(doc, `${CLS}__entry`);
    choose.setAttribute("data-entry-id", entry.id);
    const others = examplesLeadFirst(entry).slice(1);
    choose.append(
      element(doc, "span", `${CLS}__type`, entry.title),
      element(doc, "span", `${CLS}__lead`, entry.lead),
      element(doc, "span", `${CLS}__examples`, others.length ? `, ${others.join(", ")}` : ""),
      element(doc, "span", `${CLS}__summary`, summaryOf(entry, names)),
      element(doc, "span", `${CLS}__credit`, entry.credit),
    );
    setTip(choose, hoverTextOf(entry, names));
    choose.addEventListener("click", () => openOrAsk(entry));
    item.appendChild(choose);
    list.appendChild(item);
    entryButtons.set(entry.id, choose);
  }
  host.append(title, hint, closeButton, list, confirm, status);

  function setStatus(message) {
    status.textContent = message;
  }

  function hideConfirm() {
    pendingEntry = null;
    confirm.hidden = true;
  }

  /** Opens a copy: the entry is copied into a fresh shape and named for its title (FR-L3). */
  function openCopy(entry) {
    hideConfirm();
    const result = openShape({ ...entry, name: entry.title });
    if (!result?.ok) {
      setStatus(result?.error?.message ?? "That story could not be opened.");
      return;
    }
    cleanSignature = librarySignatureOf(getState());
    setStatus("");
    options.onOpened?.({ entry, result });
    close();
  }

  function openOrAsk(entry) {
    setStatus("");
    if (isDirty()) {
      pendingEntry = entry;
      confirm.hidden = false;
      keepButton.focus?.();
      return;
    }
    openCopy(entry);
  }

  function open() {
    returnFocusTo = doc.activeElement ?? null;
    hideConfirm();
    setStatus("");
    host.hidden = false;
    entryButtons.get(library[0]?.id)?.focus?.();
  }

  function close() {
    hideConfirm();
    if (host.hidden) return;
    host.hidden = true;
    returnFocusTo?.focus?.();
    returnFocusTo = null;
  }

  // Esc first backs out of the replace question, then closes the panel.
  function onKeydown(event) {
    if (event.key !== "Escape" || host.hidden) return;
    if (pendingEntry) hideConfirm();
    else close();
  }

  closeButton.addEventListener("click", close);
  keepButton.addEventListener("click", () => {
    hideConfirm();
    entryButtons.get(library[0]?.id)?.focus?.();
  });
  replaceButton.addEventListener("click", () => {
    if (pendingEntry) openCopy(pendingEntry);
    else console.warn("library-panel: Replace pressed with no entry waiting");
  });
  eventTarget?.addEventListener?.(EVT_OPEN_LIBRARY, open);
  doc?.addEventListener?.("keydown", onKeydown);

  return {
    open,
    close,
    isOpen: () => !host.hidden,
    markClean: () => { cleanSignature = librarySignatureOf(getState()); },
  };
}

// ---- detail/detail-panel.js ----
/** The element detail panel (viewport-detail spec FR-V5, FR-V9, FR-V11). Opens on `storytelling:open`; Print and Copy live only here. */

const POPULARITY_UNIT = "kilowicks";
const POPULARITY_NOTE = "thousands of links to its page in the TV Tropes wiki";
const PRINT_TONE = "colour";
const DASH = "—";

const detailSymbolOf = (element) => element.symbol ?? element.id;

/** The credit line: the element's source URL (TV Tropes, or Wikipedia for an added element); may be undefined. */
function creditOf(element) {
  return element.sourceUrl;
}

const sourceLinkOf = (element) => (isWebUrl(element.sourceUrl) ? element.sourceUrl : null);

/**
 * The text Copy puts on the clipboard (FR-V5): `<symbol> — <name>`, description, `Example: …`,
 * `In this story: …` (only when a bead note is supplied), then the credit. Lines with no content are omitted.
 * @param {{id:string, symbol?:string, name:string, description?:string, example?:string, added?:boolean, sourceUrl?:string}} element
 * @param {string} [note] the bead's library note
 * @returns {string}
 */
function elementCopyText(element, note) {
  const lines = [`${detailSymbolOf(element)} ${DASH} ${element.name}`];
  if (element.description) lines.push(element.description);
  if (element.example) lines.push(`Example: ${element.example}`);
  if (note) lines.push(`In this story: ${note}`);
  const credit = creditOf(element);
  if (credit) lines.push(credit);
  return lines.join("\n");
}

/** "<n> kilowicks", or null when there is no number: rogue, or an added element with no TV Tropes page. */
function popularityText(element) {
  if (element.rogue) return null;
  const value = element.popText ?? element.popularity;
  if (value === undefined || value === null) {
    if (!element.added) console.warn(`detail-panel: poster element "${element.id}" has no popularity`);
    return null;
  }
  return `${value} ${POPULARITY_UNIT}`;
}

function makeNode(doc, tag, className, text) {
  const node = doc.createElement(tag);
  node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function makeButton(doc, className, label) {
  const button = makeNode(doc, "button", className, label);
  button.setAttribute("type", "button");
  return button;
}

function makeLabelledLine(doc, className, label) {
  const line = makeNode(doc, "p", className);
  const value = makeNode(doc, "span", "st-detail__value");
  line.append(makeNode(doc, "span", "st-detail__label", label), value);
  return { line, value };
}

function buildParts(doc) {
  const parts = {};
  parts.tile = makeNode(doc, "span", "st-detail__tile");
  parts.tile.setAttribute("aria-hidden", "true");
  parts.name = makeNode(doc, "h2", "st-detail__name");
  parts.name.setAttribute("id", "st-detail-name");
  parts.group = makeNode(doc, "p", "st-detail__group");
  parts.close = makeButton(doc, "st-detail__button st-detail__close", "Close");
  const titles = makeNode(doc, "div", "st-detail__titles");
  titles.append(parts.name, parts.group);
  parts.header = makeNode(doc, "div", "st-detail__header");
  parts.header.append(parts.tile, titles, parts.close);

  parts.tandem = makeNode(doc, "p", "st-detail__tandem");
  parts.popularity = makeNode(doc, "p", "st-detail__popularity");
  parts.popularityValue = makeNode(doc, "span", "st-detail__popularity-value");
  // The one-line explanation is a hover-over on the number (focusable so keyboard users get it too).
  setTip(parts.popularityValue, POPULARITY_NOTE);
  parts.popularityValue.setAttribute("tabindex", "0");
  parts.popularity.append(parts.popularityValue);

  parts.description = makeNode(doc, "p", "st-detail__description");
  const example = makeLabelledLine(doc, "st-detail__example", "Example");
  parts.example = example.line;
  parts.exampleValue = example.value;
  const story = makeLabelledLine(doc, "st-detail__story", "In this story");
  parts.story = story.line;
  parts.storyValue = story.value;

  parts.credit = makeNode(doc, "p", "st-detail__credit");
  parts.creditLabel = makeNode(doc, "span", "st-detail__label", "Source");
  parts.creditLink = makeNode(doc, "a", "st-detail__credit-link");
  parts.creditLink.setAttribute("target", "_blank");
  parts.creditLink.setAttribute("rel", "noopener");
  parts.creditText = makeNode(doc, "span", "st-detail__credit-text");
  parts.credit.append(parts.creditLabel, parts.creditLink, parts.creditText);

  parts.print = makeButton(doc, "st-detail__button st-detail__print", "Print");
  parts.copy = makeButton(doc, "st-detail__button st-detail__copy", "Copy");
  parts.status = makeNode(doc, "p", "st-detail__status");
  parts.status.setAttribute("role", "status");
  parts.status.setAttribute("aria-live", "polite");
  parts.actions = makeNode(doc, "div", "st-detail__actions");
  parts.actions.append(parts.print, parts.copy);
  return parts;
}

function setShown(node, shown) {
  node.hidden = !shown;
}

const isWebUrl = (url) => typeof url === "string" && /^https?:\/\//i.test(url);

function fillCredit(parts, element) {
  const credit = creditOf(element);
  const link = sourceLinkOf(element);
  setShown(parts.credit, Boolean(credit) || Boolean(link));
  setShown(parts.creditLabel, link !== null);
  setShown(parts.creditLink, link !== null);
  // A web URL shows as a link; any other credit text shows as plain text.
  const notice = link === null ? credit : null;
  setShown(parts.creditText, Boolean(notice));
  parts.creditText.textContent = notice ?? "";
  if (link) {
    parts.creditLink.setAttribute("href", link);
    parts.creditLink.textContent = link;
  }
}

function fillPopularity(parts, element) {
  const text = popularityText(element);
  setShown(parts.popularity, text !== null);
  if (text === null) return;
  parts.popularityValue.textContent = text;
}

function fillLine(line, valueNode, text) {
  setShown(line, Boolean(text));
  valueNode.textContent = text ?? "";
}

function fillParts(parts, element, groups, request) {
  const group = groups[element.group];
  parts.tile.className = `st-detail__tile tile-${element.group}${element.added ? " is-added" : ""}`;
  parts.tile.textContent = detailSymbolOf(element);
  parts.name.textContent = element.name;
  setShown(parts.group, Boolean(group) && group !== element.name);
  parts.group.textContent = group ?? "";

  setShown(parts.tandem, Boolean(request.tandemName));
  parts.tandem.textContent = request.tandemName ? `In tandem with ${request.tandemName}` : "";

  fillPopularity(parts, element);
  setShown(parts.description, Boolean(element.description));
  parts.description.textContent = element.description ?? "";
  fillLine(parts.example, parts.exampleValue, element.example);
  fillLine(parts.story, parts.storyValue, request.note);
  fillCredit(parts, element);
}

/** What is being shown: the element itself, or the Rogue card / a rogue bead built from ROGUE (FR-V11). */
function resolveSubject(request, lookup, rogue, rogueText) {
  if (request.elementId === rogue.id) {
    return request.label ? { ...rogue, name: request.label } : { ...rogue, description: rogueText };
  }
  return lookup(request.elementId);
}

function buildLookup(elements) {
  const byId = new Map(elements.map((element) => [element.id, element]));
  return (id) => byId.get(id);
}

/**
 * Builds the detail panel inside `host` (the aside; hidden until an open event arrives).
 * The open event's detail is `{ elementId, note?, label?, tandemWith?, tandemWithLabel? }`: `label` is a rogue bead's
 * own name; `tandemWith` is the other half's element id (`tandemWithLabel` when that half is a rogue bead).
 * @param {HTMLElement} host
 * @param {object} [options] test seams: `doc`, `lookup(id)`, `groups`, `rogue`, `rogueText`, `print`, `copy`
 * @returns {{open(request:object):boolean, close():void, isOpen():boolean, copy():Promise<void>, destroy():void}}
 */
function mountDetailPanel(host, options = {}) {
  const doc = options.doc ?? globalThis.document;
  const lookup = options.lookup ?? buildLookup(ELEMENTS);
  const groups = options.groups ?? GROUPS;
  const rogue = options.rogue ?? ROGUE;
  const rogueText = options.rogueText ?? ROGUE_DETAIL_TEXT;
  const print = options.print ?? setPrintTarget;
  const copy = options.copy ?? copyText;

  const parts = buildParts(doc);
  let current = null; // { subject, note } while open
  let returnFocusTo = null;

  host.classList.add("st-detail");
  host.setAttribute("aria-labelledby", "st-detail-name");
  host.hidden = true;
  host.append(parts.header, parts.tandem, parts.popularity, parts.description, parts.example, parts.story, parts.credit, parts.actions, parts.status);

  const isOpen = () => current !== null;

  function close() {
    if (!isOpen()) return;
    current = null;
    host.hidden = true;
    parts.status.textContent = "";
    const target = returnFocusTo;
    returnFocusTo = null;
    if (target && typeof target.focus === "function") target.focus();
  }

  function open(request) {
    if (!request || typeof request.elementId !== "string") {
      console.warn("detail-panel: open request has no elementId", request);
      return false;
    }
    const subject = resolveSubject(request, lookup, rogue, rogueText);
    if (!subject) {
      console.warn(`detail-panel: no element with id "${request.elementId}"`);
      return false;
    }
    const other = request.tandemWith;
    const tandemName = request.tandemWithLabel ?? (other ? (lookup(other)?.name ?? other) : undefined);
    fillParts(parts, subject, groups, { note: request.note, tandemName });
    parts.status.textContent = "";
    if (!isOpen()) returnFocusTo = doc.activeElement ?? null;
    current = { subject, note: request.note };
    host.hidden = false;
    parts.close.focus();
    return true;
  }

  async function copyCurrent() {
    if (!isOpen()) return;
    const result = await copy(elementCopyText(current.subject, current.note));
    parts.status.textContent = result?.ok ? "Copied" : "Could not copy — select the text and copy it by hand";
  }

  const onOpenEvent = (event) => open(event.detail);
  const onKeydown = (event) => {
    if (event.key !== "Escape" || !isOpen()) return;
    event.preventDefault?.();
    close();
  };

  parts.close.addEventListener("click", close);
  parts.print.addEventListener("click", () => {
    if (isOpen()) print("element", PRINT_TONE);
  });
  parts.copy.addEventListener("click", copyCurrent);
  doc.addEventListener(EVT_OPEN, onOpenEvent);
  doc.addEventListener("keydown", onKeydown);

  function destroy() {
    doc.removeEventListener(EVT_OPEN, onOpenEvent);
    doc.removeEventListener("keydown", onKeydown);
  }

  return { open, close, isOpen, copy: copyCurrent, destroy };
}

// ---- data/version.js ----
// Single source of truth for the app version, used by the bundler to name the shareable file.
const APP_VERSION = "1.1.0";

// ---- detail/about-panel.js ----
/** The About panel (distribution spec FR-X7). Opens on `storytelling:open-about`; closes on Esc or the Close button and returns focus to the toolbar's About button (viewport-detail FR-V10). */

const ABOUT_BUTTON_SELECTOR = '[data-action="about"]';

/**
 * Mount the About panel: it builds its contents inside the host element and shows or hides the host itself. It holds exactly what FR-X7 lists: the app name and
 * version, then the statements from `data/furniture.js`, then the poster's attribution `credits` (`licenceNotes` there are deliberately not shown).
 * @param {HTMLElement} host the host element supplied by index.html
 * @param {{ doc?: Document, about?: Object, version?: string }} [options] test overrides
 * @returns {{ isOpen: () => boolean }}
 */
function mountAboutPanel(host, { doc = document, about = ABOUT, version = APP_VERSION } = {}) {
  // The host is the panel: index.html supplies it hidden, so showing must clear the host's own attribute.
  const panel = host;
  panel.classList.add("st-about");
  panel.hidden = true;
  panel.setAttribute("role", "dialog");
  panel.setAttribute("aria-label", `About ${about.appName}`);

  const heading = doc.createElement("header");
  heading.className = "st-about__header";

  const nameEl = doc.createElement("h2");
  nameEl.className = "st-about__name";
  nameEl.textContent = about.appName;

  const versionEl = doc.createElement("p");
  versionEl.className = "st-about__version";
  versionEl.textContent = `${about.versionLabel} ${version}`;

  heading.append(nameEl, versionEl);
  panel.append(heading);

  const statementsSection = doc.createElement("section");
  statementsSection.className = "st-about__statements";

  for (const statement of about.statements) {
    const statementEl = doc.createElement("p");
    statementEl.className = "st-about__statement";
    fillStatement(doc, statementEl, statement);
    statementsSection.append(statementEl);
  }

  panel.append(statementsSection);

  if (about.credits?.length) {
    const creditsSection = doc.createElement("section");
    creditsSection.className = "st-about__credits";
    for (const line of about.credits) {
      const creditEl = doc.createElement("p");
      creditEl.className = "st-about__credit";
      creditEl.textContent = line;
      creditsSection.append(creditEl);
    }
    panel.append(creditsSection);
  }

  const closeBtn = doc.createElement("button");
  closeBtn.className = "st-about__close";
  closeBtn.setAttribute("type", "button");
  closeBtn.textContent = "Close";
  closeBtn.setAttribute("aria-label", "Close About panel");
  panel.append(closeBtn);

  let opener = null;

  // The toolbar announces on `document`, so the event's target is never the button: remember what had
  // focus, and fall back to the toolbar button where the browser gives a clicked button none (Safari).
  function rememberOpener() {
    const active = doc.activeElement;
    const isRealFocus = active && active !== doc.body && typeof active.focus === "function";
    opener = isRealFocus ? active : doc.querySelector(ABOUT_BUTTON_SELECTOR);
  }

  function close() {
    panel.hidden = true;
    if (opener && typeof opener.focus === "function") opener.focus();
    else console.warn("about-panel: no element to return focus to after closing");
    opener = null;
  }

  function handleKeyDown(e) {
    if (e.key === "Escape" && !panel.hidden) {
      close();
    }
  }

  function handleOpen() {
    rememberOpener();
    panel.hidden = false;
    closeBtn.focus();
  }

  closeBtn.addEventListener("click", close);
  doc.addEventListener("keydown", handleKeyDown);
  doc.addEventListener(EVT_OPEN_ABOUT, handleOpen);

  return {
    isOpen: () => !panel.hidden,
  };
}

/** Writes a statement's text; the optional `italic` substring (a work's title) is set in <em>. Text nodes only, never HTML. */
function fillStatement(doc, paragraph, { text, italic }) {
  const at = italic ? text.indexOf(italic) : -1;
  if (at < 0) {
    paragraph.textContent = text;
    return;
  }
  const em = doc.createElement("em");
  em.textContent = italic;
  paragraph.append(text.slice(0, at), em, text.slice(at + italic.length));
}

// ---- lists/list-text.js ----
const ADDED_FOOTNOTE = "† Added for this app — not on the original chart.";
const LIST_CREDIT = "Descriptions and examples adapted from TV Tropes (tvtropes.org), CC BY-NC-SA 3.0.";
const EXAMPLE_INDENT = "    ";

/**
 * Formats storytelling elements for a category (or all categories) as a dot-point list (FR-K3, FR-K4).
 * One pure function feeds the preview, Copy and Print so they cannot disagree (AD-K2).
 *
 * @param {string} categoryKey - A CATEGORIES key, or "all" for all categories
 * @param {{ examples?: boolean }} [options] - `examples` adds each element's example line (default false)
 * @param {{ CATEGORIES: Array<{key: string, label: string}>, ELEMENTS: Array<object> }} [data] - Test fixture; defaults to the real data
 * @returns {string} Formatted list as plain text
 * @throws {Error} when categoryKey is neither "all" nor a known key
 */
function listText(categoryKey, { examples = false } = {}, data) {
	const { CATEGORIES: allCategories, ELEMENTS: allElements } = data || { CATEGORIES, ELEMENTS };

	const isAll = categoryKey === "all";
	if (!isAll && !allCategories.some((category) => category.key === categoryKey)) {
		throw new Error(`Unknown category key: "${categoryKey}"`);
	}

	const shown = isAll ? allCategories : allCategories.filter((category) => category.key === categoryKey);
	const sections = shown.map((category) => ({ category, elements: elementsInCategory(category.key, allElements) }));

	const body = sections.map(({ category, elements }) => categoryBlock(category, elements, examples)).join("\n\n");
	const hasAdded = sections.some(({ elements }) => elements.some((element) => element.added));

	const closing = hasAdded ? [ADDED_FOOTNOTE, LIST_CREDIT] : [LIST_CREDIT];
	return `${body}\n\n${closing.join("\n")}\n`;
}

/**
 * Elements of one category: poster elements first, then added ones, each in ELEMENTS array order
 * (the array is already in poster reading order, and added elements in placement order, FR-D11).
 * Elements with no name are skipped so the text never holds an empty bullet.
 */
function elementsInCategory(categoryKey, elements) {
	const members = elements.filter((element) => {
		if (element.rogue || element.category !== categoryKey) return false;
		if (typeof element.name !== "string" || element.name.trim() === "") {
			console.warn(`list-text: element "${element.id}" has no name and is left out of the list`);
			return false;
		}
		return true;
	});
	return [...members.filter((element) => !element.added), ...members.filter((element) => element.added)];
}

function categoryBlock(category, elements, examples) {
	return [category.label, ...elements.map((element) => bulletFor(element, examples))].join("\n");
}

function bulletFor(element, examples) {
	const added = element.added ? " †" : "";
	const description = nonEmptyText(element.description);
	const example = nonEmptyText(element.example);

	let bullet = `• ${element.name}${added}`;
	if (description) bullet += ` — ${description}`;
	if (examples && example) bullet += `\n${EXAMPLE_INDENT}Example: ${example}`;
	return bullet;
}

function nonEmptyText(value) {
	return typeof value === "string" && value.trim() !== "" ? value : "";
}

// ---- lists/list-panel.js ----
const LISTS_BUTTON_SELECTOR = '[data-action="lists"]';
const COPY_DONE_TEXT = "Copied";
const COPY_FAILED_TEXT = "Copy failed — select the text above and copy it by hand";

/**
 * Mounts the Lists panel (lists.spec FR-K2): category chooser, Include examples checkbox,
 * live read-only preview, Copy, Print and Close. Opens on EVT_OPEN_LISTS, closes on Esc or Close,
 * and returns focus to the toolbar Lists button (viewport-detail FR-V10).
 *
 * @param {HTMLElement} host the `#list-panel` element; the panel is built inside it and hidden with `hidden`
 * @param {{ doc?: Document, output?: { copyText: Function, setPrintTarget: Function } }} [options] test overrides
 * @returns {{ open: () => void, close: () => void, isOpen: () => boolean }}
 */
function mountListPanel(host, { doc, output } = {}) {
	const document = doc || globalThis.document;
	const outputApi = output || { copyText, setPrintTarget };

	let selectedCategory = "all";
	let includeExamples = false;
	let opener = null;

	host.classList.add("st-list-panel");
	host.setAttribute("role", "dialog");
	host.setAttribute("aria-label", "Lists");
	host.setAttribute("hidden", "");

	const categorySelect = document.createElement("select");
	categorySelect.className = "st-list-panel__category-select";
	categorySelect.id = "list-panel-category";
	for (const { value, label } of [{ value: "all", label: "All categories" }, ...CATEGORIES.map(({ key, label }) => ({ value: key, label }))]) {
		const option = document.createElement("option");
		option.value = value;
		option.textContent = label;
		categorySelect.appendChild(option);
	}

	const categoryLabel = document.createElement("label");
	categoryLabel.className = "st-list-panel__category-label";
	categoryLabel.htmlFor = "list-panel-category";
	categoryLabel.textContent = "Category: ";
	categoryLabel.appendChild(categorySelect);

	const examplesCheckbox = document.createElement("input");
	examplesCheckbox.type = "checkbox";
	examplesCheckbox.className = "st-list-panel__examples-checkbox";
	examplesCheckbox.id = "list-panel-examples";
	examplesCheckbox.checked = false;

	const examplesLabel = document.createElement("label");
	examplesLabel.className = "st-list-panel__examples-label";
	examplesLabel.htmlFor = "list-panel-examples";
	examplesLabel.textContent = "Include examples";
	examplesLabel.prepend(examplesCheckbox);

	// Focusable so a keyboard user can scroll a long list. It is the Copy source and the on-screen view only; print uses `printBlock`.
	const preview = document.createElement("pre");
	preview.className = "st-list-panel__preview";
	preview.setAttribute("tabindex", "0");
	preview.setAttribute("aria-label", "List preview");

	// Print-only twin of the preview: real headings and bullets so print.css can start each category on a new page.
	const printBlock = document.createElement("div");
	printBlock.className = "st-list-panel__print";
	printBlock.setAttribute("data-print-list", "");
	printBlock.setAttribute("aria-hidden", "true");

	const status = document.createElement("p");
	status.className = "st-list-panel__status";
	status.setAttribute("role", "status");

	const buttons = document.createElement("div");
	buttons.className = "st-list-panel__buttons";
	const copyButton = makeListPanelButton(document, "copy-button", "Copy");
	const printButton = makeListPanelButton(document, "print-button", "Print");
	const closeButton = makeListPanelButton(document, "close-button", "Close");
	buttons.appendChild(copyButton);
	buttons.appendChild(printButton);
	buttons.appendChild(closeButton);

	host.appendChild(categoryLabel);
	host.appendChild(examplesLabel);
	host.appendChild(preview);
	host.appendChild(printBlock);
	host.appendChild(status);
	host.appendChild(buttons);

	function isOpen() {
		return !host.hasAttribute("hidden");
	}

	function showStatus(text) {
		status.textContent = text;
		status.classList.toggle("is-shown", text !== "");
	}

	function updatePreview() {
		const text = listText(selectedCategory, { examples: includeExamples });
		preview.textContent = text;
		printBlock.replaceChildren(...structuredListNodes(document, text));
		showStatus("");
	}

	async function handleCopy() {
		const result = await outputApi.copyText(preview.textContent);
		showStatus(result && result.ok ? COPY_DONE_TEXT : COPY_FAILED_TEXT);
	}

	// The toolbar announces on `document`, so the event's target is never the button: remember what
	// had focus, and fall back to the toolbar button where the browser gives a clicked button none (Safari).
	function rememberOpener() {
		const active = document.activeElement;
		const isRealFocus = active && active !== document.body && typeof active.focus === "function";
		opener = isRealFocus ? active : document.querySelector(LISTS_BUTTON_SELECTOR);
	}

	function open() {
		rememberOpener();
		host.removeAttribute("hidden");
		updatePreview();
		categorySelect.focus();
	}

	function close() {
		if (!isOpen()) return;
		host.setAttribute("hidden", "");
		if (opener && typeof opener.focus === "function") opener.focus();
		else console.warn("list-panel: no element to return focus to after closing");
		opener = null;
	}

	categorySelect.addEventListener("change", () => {
		selectedCategory = categorySelect.value;
		updatePreview();
	});
	examplesCheckbox.addEventListener("change", () => {
		includeExamples = examplesCheckbox.checked;
		updatePreview();
	});
	copyButton.addEventListener("click", handleCopy);
	printButton.addEventListener("click", () => outputApi.setPrintTarget("list", "colour"));
	closeButton.addEventListener("click", close);
	document.addEventListener("keydown", (event) => {
		if (event.key === "Escape" && isOpen()) close();
	});
	document.addEventListener(EVT_OPEN_LISTS, open);

	updatePreview();

	return { open, close, isOpen };
}

function makeListPanelButton(document, part, label) {
	const button = document.createElement("button");
	button.className = `st-list-panel__button st-list-panel__${part}`;
	button.type = "button";
	button.textContent = label;
	return button;
}

const BULLET_PREFIX = "• ";
const EXAMPLE_INDENT_PATTERN = /^\s+/;

/**
 * Rebuilds `listText` output as print markup, so the printed list and the preview cannot disagree (lists AD-K2).
 * The text is blank-line-separated blocks: category blocks (heading line, then bullet lines, each bullet optionally
 * followed by an indented Example line), and one closing block of footnote and credit lines, which is the last block.
 * Returns `h2` + `ul` per category and a `p` per closing line.
 */
function structuredListNodes(document, text) {
	const blocks = text.trim().split("\n\n");
	const closingBlock = blocks.pop();
	const nodes = [];
	for (const block of blocks) nodes.push(...categoryNodes(document, block.split("\n")));
	for (const line of closingBlock.split("\n")) nodes.push(textNode(document, "p", line));
	return nodes;
}

function categoryNodes(document, lines) {
	const [heading, ...bulletLines] = lines;
	const list = document.createElement("ul");
	for (const line of bulletLines) {
		if (line.startsWith(BULLET_PREFIX)) {
			list.appendChild(textNode(document, "li", line.slice(BULLET_PREFIX.length)));
		} else if (EXAMPLE_INDENT_PATTERN.test(line) && list.lastChild) {
			list.lastChild.appendChild(textNode(document, "div", line.trim()));
		} else {
			console.warn(`list-panel: unexpected line in the list text, left out of the printed list: "${line}"`);
		}
	}
	return [textNode(document, "h2", heading), list];
}

function textNode(document, tag, text) {
	const node = document.createElement(tag);
	node.textContent = text;
	return node;
}

// ---- agent/agent-api.js ----
/**
 * agent-api.js — `window.storytellingAgent`: hidden, self-describing levers an AI agent can call
 * from inside the open page (agent-api.spec).
 *
 * Every lever is synchronous, takes and returns plain JSON, and never throws. Success is
 * `{ ok: true, … }`; failure is `{ ok: false, error: { code, message, hint } }`. Writes go through
 * the same story-model functions the mouse gestures call (AD-A2), and saves go through
 * story-store.saveStory with `agent: true` (FR-A8). The manifest, the `<meta>` tag and `help()` are all
 * generated from one lever table (AD-A5), so they cannot drift from the code.
 *
 * Every top-level name here starts with `agent`/`AGENT` because the single-file bundler refuses a
 * name declared in two modules.
 */

const AGENT_GLOBAL_NAME = "storytellingAgent";
const AGENT_META_NAME = "storytelling-agent";
const AGENT_MANIFEST_ID = "storytelling-agent-manifest";
const AGENT_MAX_NAME = 60;

const AGENT_MAX_ID_LENGTH = 60;
const AGENT_MAX_QUERY = 80;
const AGENT_DEFAULT_LIMIT = 60;
const AGENT_MAX_LIMIT = 300;

/* ---------- results ---------- */

/** What the agent should try next, per error code (also published in the manifest). */
const AGENT_HINTS = Object.freeze({
  "bad-argument": "Check the lever's arguments against help().manifest.levers.",
  "unknown-element": "Search with elements({ query }) or list ids with elements({ category }).",
  "unknown-bead": "Call story() to see the uids of the beads that exist.",
  "no-such-ribbon": "Call story() and use one of its ribbons ([fromUid, toUid]).",
  "cap-reached": `A story holds at most ${MAX_BEADS} beads and ${MAX_RIBBONS} ribbons; remove something first.`,
  "tandem-full": "A bead holds at most two elements; add a new bead instead.",
  "same-element": "A tandem needs two different elements (two rogue cards are fine); choose another element.",
  "self-link": "A bead cannot link to itself; choose a different bead.",
  "duplicate-ribbon": "Those beads are already linked; call story() to see the ribbons.",
  "not-tandem": "Only a tandem can be split; call pair(uid, elementId) first.",
  "not-rogue": "Only a rogue card has a label.",
  "too-long": `Shorten the text: names ${AGENT_MAX_NAME}, notes ${MAX_NOTE}, labels ${MAX_LABEL} characters.`,
  "nothing-to-undo": "There is no cleared story to restore.",
  "bad-shape": "The story data could not be read; call story() to see what is loaded.",
  "no-session": "Call begin({ name }) first; write levers work only inside a session.",
  "map-not-empty": "Luke has a story open — ask him, or call begin({force:true}).",
  "not-agent-story": "An agent may replace only stories an agent saved; choose a new name.",
  exists: "That name is taken; choose another name, or pass { replace: true } to replace a story an agent saved.",
  "storage-unavailable": "The browser would not let the page save; tell Luke.",
  "internal-error": "This should not happen; tell Luke and call story() to check the map.",
});

const agentIsRecord = (value) => value !== null && typeof value === "object" && !Array.isArray(value);
const agentTextLength = (text) => [...text].length;

function agentFail(code, message, hint = AGENT_HINTS[code] ?? "Call help() for the lever list.") {
  return { ok: false, error: { code, message, hint } };
}

/** Plain JSON copy, so no result aliases frozen library data or live model state. */
const agentPlain = (value) => JSON.parse(JSON.stringify(value));

/** Turns a story-model result into the agent shape, adding a hint to a refusal. */
function agentFromModel(result, hint) {
  if (result.ok) return agentPlain(result);
  const { code, message } = result.error;
  return agentFail(code, message, hint ?? AGENT_HINTS[code]);
}

/* ---------- argument reading ---------- */

/** Control characters and whitespace runs become one space; trimmed (mirrors the model's clean-up). */
function agentCleanText(value) {
  return value.replace(/[\u0000-\u001f\u007f]+/g, " ").replace(/\s+/g, " ").trim();
}

function agentReadUid(value, what = "uid") {
  if (typeof value !== "string" || !value || value.length > AGENT_MAX_ID_LENGTH) {
    return agentFail("bad-argument", `${what} must be a bead uid (text)`);
  }
  return { ok: true, value };
}

/** An optional options object: absent is `{}`; anything but a plain object with known keys is refused. */
function agentReadOptions(value, allowedKeys) {
  if (value === undefined) return { ok: true, value: {} };
  if (!agentIsRecord(value)) return agentFail("bad-argument", "options must be an object");
  const unknown = Object.keys(value).find((key) => !allowedKeys.includes(key));
  if (unknown !== undefined) {
    return agentFail("bad-argument", `unknown option "${agentCleanText(unknown).slice(0, 30)}"`, `Allowed options: ${allowedKeys.join(", ") || "none"}.`);
  }
  return { ok: true, value };
}

function agentReadName(value) {
  if (typeof value !== "string") return agentFail("bad-argument", "name must be text");
  const text = agentCleanText(value);
  if (!text) return agentFail("bad-argument", "name must not be empty");
  if (agentTextLength(text) > AGENT_MAX_NAME) return agentFail("too-long", `name can be at most ${AGENT_MAX_NAME} characters`);
  return { ok: true, value: text };
}

/* ---------- nearest element ids (FR-A9) ---------- */

function agentEditDistance(a, b) {
  let previous = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i += 1) {
    const row = [i];
    for (let j = 1; j <= b.length; j += 1) {
      row[j] = Math.min(previous[j] + 1, row[j - 1] + 1, previous[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    previous = row;
  }
  return previous[b.length];
}

/** Up to five elements whose id or name is closest to `query`. */
function agentNearestElements(query, elements) {
  const wanted = String(query ?? "").slice(0, AGENT_MAX_ID_LENGTH).toLowerCase();
  if (!wanted) return [];
  const scored = elements.map((element) => {
    const id = element.id.toLowerCase();
    const name = element.name.toLowerCase();
    const contains = (id.includes(wanted) || name.includes(wanted) || (wanted.length > 2 && wanted.includes(name))) ? 0 : 1;
    return { element, contains, distance: Math.min(agentEditDistance(wanted, id), agentEditDistance(wanted, name)) };
  });
  scored.sort((x, y) => x.contains - y.contains || x.distance - y.distance);
  return scored.slice(0, 5).map((item) => item.element);
}

/* ---------- the lever table ---------- */

/** One example call and the shape of what comes back are part of each lever (FR-A2). */
function agentLever(name, kind, maxArgs, args, returns, example, run) {
  return { name, kind, maxArgs, arguments: args, returns, example, run };
}

const AGENT_PLACEMENT = "{ after?: uid, branchFrom?: uid, insertOn?: [fromUid, toUid] } (at most one; none = join after the active bead)";

/**
 * Builds the lever table for one mounted API. `ctx` carries the injected store, storage functions,
 * data and the session state; each `run` receives the caller's arguments only.
 */
function agentBuildLevers(ctx) {
  const { store, api, data } = ctx;
  const elementIds = new Set([...data.ELEMENTS.map((element) => element.id), data.ROGUE.id]);
  const elementById = (id) => (id === data.ROGUE.id ? agentRogueView(data) : agentElementView(data.ELEMENTS.find((element) => element.id === id)));
  const everyElement = () => [...data.ELEMENTS, data.ROGUE];

  const unknownElement = (id) => {
    const near = agentNearestElements(id, everyElement()).map((element) => `${element.id} (${element.name})`);
    const hint = near.length ? `Nearest matches: ${near.join(", ")}. Or search with elements({ query }).` : AGENT_HINTS["unknown-element"];
    return agentFail("unknown-element", "no such element", hint);
  };
  const readElementId = (value) => {
    if (typeof value !== "string" || value.length > AGENT_MAX_ID_LENGTH || !elementIds.has(value)) {
      return typeof value === "string" ? unknownElement(value) : agentFail("bad-argument", "elementId must be an element id (text)");
    }
    return { ok: true, value };
  };
  const readBead = (value, what) => {
    const uid = agentReadUid(value, what);
    if (!uid.ok) return uid;
    return store.getBead(uid.value) ? uid : agentFail("unknown-bead", `no bead ${uid.value}`);
  };
  const readCategory = (value) => {
    if (typeof value !== "string" || !(value === "rogue" || data.CATEGORIES.some((category) => category.key === value))) {
      return agentFail("bad-argument", "category must be a key from categories()", `Valid keys: ${data.CATEGORIES.map((c) => c.key).join(", ")}.`);
    }
    return { ok: true, value };
  };

  /** after / branchFrom / insertOn → a model target. `required` demands exactly one (move). */
  const readPlacement = (opts, required) => {
    const chosen = ["after", "branchFrom", "insertOn"].filter((key) => opts[key] !== undefined);
    if (chosen.length > 1) return agentFail("bad-argument", "give at most one of after, branchFrom, insertOn");
    if (chosen.length === 0) {
      return required
        ? agentFail("bad-argument", "give one of after, branchFrom, insertOn", "Say where the bead goes, e.g. move(uid, { after: otherUid }).")
        : { ok: true, target: { type: "empty" }, placed: undefined };
    }
    const [key] = chosen;
    if (key === "insertOn") {
      const pair = opts.insertOn;
      if (!Array.isArray(pair) || pair.length !== 2 || pair.some((uid) => typeof uid !== "string" || uid.length > AGENT_MAX_ID_LENGTH)) {
        return agentFail("bad-argument", "insertOn must be a ribbon [fromUid, toUid]");
      }
      const exists = store.getState().ribbons.some(([from, to]) => from === pair[0] && to === pair[1]);
      if (!exists) return agentFail("no-such-ribbon", `no ribbon ${pair[0]} → ${pair[1]}`);
      return { ok: true, target: { type: "ribbon", from: pair[0], to: pair[1] }, placed: "inserted" };
    }
    const bead = readBead(opts[key], key);
    if (!bead.ok) return bead;
    return { ok: true, target: { type: "bead", uid: bead.value }, placed: key === "after" ? "joined" : "branched" };
  };

  const addElement = (elementId, opts, placementOpts) => {
    const placement = readPlacement(placementOpts, false);
    if (!placement.ok) return placement;
    const result = agentFromModel(store.addBead(elementId, placement.target, opts));
    if (result.ok && placement.placed) result.placed = placement.placed;
    return result;
  };

  const levers = [
    agentLever("help", "read", 0, "()", "{ ok, manifest }", "storytellingAgent.help()", () => ({ ok: true, manifest: agentPlain(ctx.manifest) })),

    agentLever("categories", "read", 0, "()", "{ ok, categories: [{ key, label, count }] }", "storytellingAgent.categories()", () => ({
      ok: true,
      categories: data.CATEGORIES.map(({ key, label }) => ({ key, label, count: data.ELEMENTS.filter((element) => (element.category ?? element.group) === key).length })),
    })),

    agentLever("elements", "read", 1, "({ category?, query?, limit? })", "{ ok, total, elements: [{ id, name, category, description, example, popularity? }] } (rogue is id Rg)",
      'storytellingAgent.elements({ query: "twist", limit: 10 })', (rawOptions) => {
        const opts = agentReadOptions(rawOptions, ["category", "query", "limit"]);
        if (!opts.ok) return opts;
        const { category, query, limit } = opts.value;
        if (category !== undefined) {
          const checked = readCategory(category);
          if (!checked.ok) return checked;
        }
        if (query !== undefined && (typeof query !== "string" || query.length > AGENT_MAX_QUERY)) {
          return agentFail("bad-argument", `query must be text of at most ${AGENT_MAX_QUERY} characters`);
        }
        if (limit !== undefined && (!Number.isInteger(limit) || limit < 1 || limit > AGENT_MAX_LIMIT)) {
          return agentFail("bad-argument", `limit must be a whole number from 1 to ${AGENT_MAX_LIMIT}`);
        }
        const terms = (query ?? "").toLowerCase().split(/\s+/).filter(Boolean);
        const matches = [...data.ELEMENTS.map(agentElementView), agentRogueView(data)].filter((element) => {
          if (category !== undefined && element.category !== category) return false;
          const label = data.CATEGORIES.find((entry) => entry.key === element.category)?.label ?? "";
          const haystack = `${element.name} ${element.description ?? ""} ${element.category} ${label}`.toLowerCase();
          return terms.every((term) => haystack.includes(term));
        });
        return { ok: true, total: matches.length, elements: matches.slice(0, limit ?? AGENT_DEFAULT_LIMIT) };
      }),

    agentLever("element", "read", 1, "(id)", "{ ok, element: { id, name, category, description, example, popularity? } }", 'storytellingAgent.element("Pt")', (id) => {
      const checked = readElementId(id);
      return checked.ok ? { ok: true, element: agentPlain(elementById(id)) } : checked;
    }),

    agentLever("library", "read", 0, "()", "{ ok, entries: [{ id, title, examples, lead, origin }] } (the twelve story types)", "storytellingAgent.library()", () => ({
      ok: true,
      entries: agentPlain(data.LIBRARY.map(({ id, title, examples, lead, origin }) => ({ id, title, examples, lead, origin }))),
    })),

    agentLever("libraryEntry", "read", 1, "(id)", "{ ok, entry: { id, title, examples, lead, origin, credit, beads, ribbons } }", 'storytellingAgent.libraryEntry("quest-heros-journey")', (id) => {
      const entry = agentFindLibraryEntry(data, id);
      return entry.ok ? { ok: true, entry: agentPlain(entry.value) } : entry;
    }),

    agentLever("story", "read", 0, "()", "{ ok, name, agent, activeUid, beads: [{ uid, n, elementId, with?, label?, withLabel?, note?, layer, lane }], ribbons: [[fromUid, toUid]] }",
      "storytellingAgent.story()", () => ({ ok: true, ...agentStoryView(ctx) })),

    agentLever("text", "read", 0, "()", "{ ok, text } (the same text as Copy; empty for an empty map)", "storytellingAgent.text()", () => {
      const { beads, ribbons } = store.getState();
      if (beads.length === 0) return { ok: true, text: "" };
      return { ok: true, text: ctx.storyText(ctx.session.name ?? "", beads, ribbons, ctx.layout(beads, ribbons)) };
    }),

    agentLever("check", "read", 0, "()", "{ ok, beads, ribbons, forks, merges, loops (counts), roots, unreachable (uid lists), warnings: [text] }", "storytellingAgent.check()",
      () => ({ ok: true, ...agentCheck(store.getState(), ctx.layout) })),

    agentLever("lists", "read", 2, '(categoryKey | "all", { examples? })', "{ ok, text } (the same text as the Lists panel)", 'storytellingAgent.lists("all", { examples: true })', (key, rawOptions) => {
      const opts = agentReadOptions(rawOptions, ["examples"]);
      if (!opts.ok) return opts;
      if (opts.value.examples !== undefined && typeof opts.value.examples !== "boolean") return agentFail("bad-argument", "examples must be true or false");
      if (key !== "all") {
        const checked = readCategory(key);
        if (!checked.ok) return checked;
        if (key === "rogue") return agentFail("bad-argument", "the rogue card is in no list", 'Use a key from categories() or "all".');
      }
      return { ok: true, text: ctx.listText(key, { examples: opts.value.examples === true }) };
    }),

    agentLever("begin", "session", 1, "({ name?, force? })", "{ ok, name, mapWasEmpty }; map-not-empty if a story is open and force is not true", 'storytellingAgent.begin({ name: "Mystery" })', (rawOptions) => {
      const opts = agentReadOptions(rawOptions, ["name", "force"]);
      if (!opts.ok) return opts;
      if (opts.value.force !== undefined && typeof opts.value.force !== "boolean") return agentFail("bad-argument", "force must be true or false");
      let name = ctx.session.open ? ctx.session.name : null;
      if (opts.value.name !== undefined) {
        const read = agentReadName(opts.value.name);
        if (!read.ok) return read;
        name = read.value;
      }
      const empty = store.getState().beads.length === 0;
      if (!ctx.session.open && !empty && opts.value.force !== true) {
        return agentFail("map-not-empty", "a story is already open in the page");
      }
      ctx.setSession(true, name);
      return { ok: true, name: ctx.session.name, mapWasEmpty: empty };
    }),

    agentLever("end", "session", 0, "()", "{ ok, wasOpen }", "storytellingAgent.end()", () => {
      const wasOpen = ctx.session.open;
      ctx.setSession(false, ctx.session.name);
      return { ok: true, wasOpen };
    }),

    agentLever("add", "write", 2, `(elementId, { note?, label? } + ${AGENT_PLACEMENT})`, "{ ok, uid, placed: started|joined|branched|inserted }", 'storytellingAgent.add("Pt", { note: "The butler did it" })', (elementId, rawOptions) => {
      const opts = agentReadOptions(rawOptions, ["after", "branchFrom", "insertOn", "note", "label"]);
      if (!opts.ok) return opts;
      const id = readElementId(elementId);
      if (!id.ok) return id;
      const { after, branchFrom, insertOn, ...text } = opts.value;
      return addElement(id.value, text, { after, branchFrom, insertOn });
    }),

    agentLever("addRogue", "write", 2, `(label, { note? } + ${AGENT_PLACEMENT})`, "{ ok, uid, placed }", 'storytellingAgent.addRogue("The Twin", { after: "b2" })', (label, rawOptions) => {
      const opts = agentReadOptions(rawOptions, ["after", "branchFrom", "insertOn", "note"]);
      if (!opts.ok) return opts;
      if (typeof label !== "string" || !agentCleanText(label)) return agentFail("bad-argument", "label must be non-empty text", "Name the rogue element, e.g. addRogue(\"The Twin\").");
      const text = { value: label };
      const { after, branchFrom, insertOn, note } = opts.value;
      return addElement(data.ROGUE.id, { label: text.value, note }, { after, branchFrom, insertOn });
    }),

    agentLever("pair", "write", 3, "(uid, elementId, { label? })", "{ ok, uid, placed: \"paired\" } (a tandem: the bead now holds two elements)", 'storytellingAgent.pair("b2", "Dra")', (uid, elementId, rawOptions) => {
      const opts = agentReadOptions(rawOptions, ["label"]);
      if (!opts.ok) return opts;
      const bead = readBead(uid);
      if (!bead.ok) return bead;
      const id = readElementId(elementId);
      if (!id.ok) return id;
      return agentFromModel(store.pairBead(bead.value, id.value, opts.value));
    }),

    agentLever("split", "write", 1, "(uid)", "{ ok, uid, secondUid } (a tandem becomes two beads in sequence)", 'storytellingAgent.split("b2")', (uid) => {
      const bead = readBead(uid);
      return bead.ok ? agentFromModel(store.splitBead(bead.value)) : bead;
    }),

    agentLever("link", "write", 2, "(fromUid, toUid)", "{ ok } (adds a ribbon; merges and loops are made this way)", 'storytellingAgent.link("b3", "b5")', (fromUid, toUid) => {
      const from = readBead(fromUid, "fromUid");
      if (!from.ok) return from;
      const to = readBead(toUid, "toUid");
      return to.ok ? agentFromModel(store.linkBeads(from.value, to.value)) : to;
    }),

    agentLever("cut", "write", 2, "(fromUid, toUid)", "{ ok } (removes that ribbon)", 'storytellingAgent.cut("b3", "b5")', (fromUid, toUid) => {
      const from = agentReadUid(fromUid, "fromUid");
      if (!from.ok) return from;
      const to = agentReadUid(toUid, "toUid");
      if (!to.ok) return to;
      const exists = store.getState().ribbons.some(([a, b]) => a === from.value && b === to.value);
      return exists ? agentFromModel(store.cutRibbon(from.value, to.value)) : agentFail("no-such-ribbon", `no ribbon ${from.value} → ${to.value}`);
    }),

    agentLever("move", "write", 2, "(uid, { after | branchFrom | insertOn })", "{ ok, uid, placed }", 'storytellingAgent.move("b4", { after: "b1" })', (uid, rawOptions) => {
      const opts = agentReadOptions(rawOptions, ["after", "branchFrom", "insertOn"]);
      if (!opts.ok) return opts;
      const bead = readBead(uid);
      if (!bead.ok) return bead;
      const placement = readPlacement(opts.value, true);
      if (!placement.ok) return placement;
      const result = agentFromModel(store.moveBead(bead.value, placement.target));
      if (result.ok && placement.placed) result.placed = placement.placed;
      return result;
    }),

    agentLever("remove", "write", 1, "(uid)", "{ ok, uid, healed } (what led into the bead is reconnected to what it led to)", 'storytellingAgent.remove("b4")', (uid) => {
      const bead = readBead(uid);
      return bead.ok ? agentFromModel(store.removeBead(bead.value)) : bead;
    }),

    agentLever("newRibbon", "write", 0, "()", "{ ok } (the next add starts an unattached bead)", "storytellingAgent.newRibbon()", () => agentFromModel(store.newRibbon())),

    agentLever("setActive", "write", 1, "(uid)", "{ ok, uid } (the next plain add joins after this bead)", 'storytellingAgent.setActive("b2")', (uid) => {
      const bead = readBead(uid);
      return bead.ok ? agentFromModel(store.setActive(bead.value)) : bead;
    }),

    agentLever("setName", "write", 1, `(name)`, `{ ok, name } (1-${AGENT_MAX_NAME} characters, plain text)`, 'storytellingAgent.setName("A mystery")', (name) => {
      const read = agentReadName(name);
      if (!read.ok) return read;
      ctx.setSession(true, read.value);
      return { ok: true, name: read.value };
    }),

    agentLever("setNote", "write", 2, "(uid, text)", `{ ok, uid } (at most ${MAX_NOTE} characters; "" removes the note)`, 'storytellingAgent.setNote("b1", "A locked room")', (uid, text) => {
      const bead = readBead(uid);
      if (!bead.ok) return bead;
      if (typeof text !== "string") return agentFail("bad-argument", "text must be text");
      return agentFromModel(store.setNote(bead.value, text));
    }),

    agentLever("clear", "write", 0, "()", `{ ok, cleared } (Luke's inline Undo can restore it for ${UNDO_MS / 1000} seconds)`, "storytellingAgent.clear()", () => agentFromModel(store.clear())),

    agentLever("openLibrary", "write", 1, "(id)", "{ ok, name, note } (loads an editable copy of a library story, replacing the map)", 'storytellingAgent.openLibrary("quest-heros-journey")', (id) => {
      const entry = agentFindLibraryEntry(data, id);
      if (!entry.ok) return entry;
      const loaded = agentFromModel(store.openStory({ name: entry.value.title, beads: entry.value.beads, ribbons: entry.value.ribbons }));
      if (!loaded.ok) return loaded;
      ctx.setSession(true, entry.value.title);
      return { ok: true, name: entry.value.title, note: loaded.note };
    }),

    agentLever("save", "write", 1, "({ name?, replace? })", "{ ok, name, warning? } (saved with the AI tag; exists / not-agent-story if refused)", 'storytellingAgent.save({ name: "A mystery" })', (rawOptions) => {
      const opts = agentReadOptions(rawOptions, ["name", "replace"]);
      if (!opts.ok) return opts;
      if (opts.value.replace !== undefined && typeof opts.value.replace !== "boolean") return agentFail("bad-argument", "replace must be true or false");
      const name = agentReadName(opts.value.name ?? ctx.session.name ?? undefined);
      if (!name.ok) return agentFail(name.error.code, name.error.message, opts.value.name === undefined ? "Pass { name } or call setName(name) first." : undefined);
      return agentSave(ctx, name.value, opts.value.replace === true);
    }),
  ];
  return levers;
}

/* ---------- read helpers ---------- */

function agentElementView(element) {
  const view = { id: element.id, name: element.name, category: element.category ?? element.group, description: element.description, example: element.example };
  if (typeof element.popularity === "number") view.popularity = element.popularity;
  return view;
}

function agentRogueView(data) {
  return { id: data.ROGUE.id, name: data.ROGUE.name, category: "rogue", description: data.ROGUE_DETAIL_TEXT };
}

function agentFindLibraryEntry(data, id) {
  if (typeof id !== "string" || id.length > AGENT_MAX_ID_LENGTH) return agentFail("bad-argument", "id must be a library id (text)");
  const entry = data.LIBRARY.find((candidate) => candidate.id === id);
  if (entry) return { ok: true, value: entry };
  return agentFail("bad-argument", "no such library story", `Valid ids: ${data.LIBRARY.map((candidate) => candidate.id).join(", ")}.`);
}

function agentStoryView(ctx) {
  const { beads, ribbons, activeUid } = ctx.store.getState();
  const arranged = ctx.layout(beads, ribbons);
  const byUid = new Map(beads.map((bead) => [bead.uid, bead]));
  const ordered = arranged.order.map((uid) => byUid.get(uid)).filter(Boolean);
  return {
    name: ctx.session.name,
    agent: ctx.session.open,
    activeUid,
    beads: ordered.map((bead) => {
      const { uid, elementId, ...rest } = bead;
      const place = arranged.positions[uid];
      return { uid, n: arranged.stepNumbers[uid], elementId, ...rest, layer: place.layer, lane: place.lane };
    }),
    ribbons,
  };
}

/** Undirected connected pieces of the map, so "not joined to the rest" is one clear test. */
function agentConnectedToFirst(beads, ribbons, firstUid) {
  const neighbours = new Map(beads.map((bead) => [bead.uid, []]));
  for (const [from, to] of ribbons) {
    neighbours.get(from)?.push(to);
    neighbours.get(to)?.push(from);
  }
  const seen = new Set([firstUid]);
  const queue = [firstUid];
  while (queue.length) {
    for (const next of neighbours.get(queue.shift()) ?? []) {
      if (!seen.has(next)) {
        seen.add(next);
        queue.push(next);
      }
    }
  }
  return seen;
}

function agentCheck({ beads, ribbons }, layoutFn) {
  const arranged = layoutFn(beads, ribbons);
  const incoming = new Map(beads.map((bead) => [bead.uid, 0]));
  const outgoing = new Map(beads.map((bead) => [bead.uid, 0]));
  for (const [from, to] of ribbons) {
    outgoing.set(from, (outgoing.get(from) ?? 0) + 1);
    incoming.set(to, (incoming.get(to) ?? 0) + 1);
  }
  const uids = arranged.order;
  const roots = uids.filter((uid) => incoming.get(uid) === 0);
  const joined = uids.length ? agentConnectedToFirst(beads, ribbons, uids[0]) : new Set();
  const unreachable = uids.filter((uid) => !joined.has(uid));
  const loops = arranged.loopRibbons.length;
  const warnings = [];
  if (beads.length === 0) warnings.push("The story is empty.");
  if (beads.length === 1) warnings.push("The story has only one bead.");
  if (unreachable.length) warnings.push(`${unreachable.length} bead(s) are not connected to the rest of the story: ${unreachable.join(", ")}.`);
  for (const [from, to] of arranged.loopRibbons) warnings.push(`The ribbon ${from} → ${to} loops back to an earlier bead.`);
  if (beads.length > 0 && uids.every((uid) => outgoing.get(uid) > 0)) warnings.push("The ribbon never ends: every bead leads on to another.");
  return {
    beads: beads.length,
    ribbons: ribbons.length,
    forks: uids.filter((uid) => outgoing.get(uid) > 1).length,
    merges: uids.filter((uid) => incoming.get(uid) > 1).length,
    loops,
    roots,
    unreachable,
    warnings,
  };
}

/* ---------- saving (FR-A8) ---------- */

function agentSave(ctx, name, replace) {
  const { beads, ribbons } = ctx.store.getState();
  if (beads.length === 0) return agentFail("bad-argument", "there is nothing to save", "Add beads first with add(elementId).");
  try {
    const existing = ctx.api.list().stories.find((story) => story.name === name);
    if (existing && !replace) return agentFail("exists", `a story named "${name}" is already saved`);
    if (existing && existing.agent !== true) return agentFail("not-agent-story", `"${name}" was not saved by an agent`);
    const result = ctx.api.save({ name, beads, ribbons, agent: true, replace });
    if (!result.ok) return agentSaveRefusal(result);
    ctx.setSession(true, name);
    const status = ctx.api.list();
    return status.message ? { ok: true, name, warning: `${status.message}; the story is kept only until the page closes` } : { ok: true, name };
  } catch (error) {
    console.warn(`agent-api save: ${error && error.message}`);
    return agentFail("storage-unavailable", "the story could not be saved");
  }
}

function agentSaveRefusal(result) {
  if (result.exists) return agentFail("exists", "that name is already saved");
  if (/non-agent/i.test(result.error ?? "")) return agentFail("not-agent-story", "that story was not saved by an agent");
  return agentFail("bad-argument", String(result.error ?? "the story could not be saved"));
}

/* ---------- manifest ---------- */

const AGENT_MANIFEST_BASE = Object.freeze({
  name: AGENT_GLOBAL_NAME,
  global: `window.${AGENT_GLOBAL_NAME}`,
  summary: "Levers to read the Periodic Table of Storytelling elements and build, name, save and check a story map (a ribbon of beads).",
  conventions: {
    calls: "Synchronous; plain JSON in and out; never throws.",
    success: "{ ok: true, ... }",
    failure: "{ ok: false, error: { code, message, hint } } — the hint says what to call or change next.",
    kinds: "read = always allowed and changes nothing; session = begin/end; write = needs a session (no-session otherwise).",
  },
  workflow: [
    "help() — read this manifest",
    "elements({ query }) — find element ids",
    "begin({ name }) — open a session (map-not-empty if Luke has a story open)",
    "add(elementId, ...) — build; story() and check() to review; text() for the copy text",
    "save({ name }) — save with the AI tag; end() when done",
  ],
  bounds: { nameCharacters: AGENT_MAX_NAME, noteCharacters: MAX_NOTE, labelCharacters: MAX_LABEL, beads: MAX_BEADS, ribbons: MAX_RIBBONS },
  errors: AGENT_HINTS,
});

/**
 * The self-description of the levers, generated from the lever table itself so it cannot drift.
 * @param {Array<{ name: string, kind: string, arguments: string, returns: string, example: string }>} levers
 * @param {object} [base] the fixed part of the manifest (name, conventions, bounds, error hints)
 * @returns {object} plain JSON: `{ ...base, levers: [{ name, kind, arguments, returns, example }] }`
 */
function buildManifest(levers, base = AGENT_MANIFEST_BASE) {
  return agentPlain({
    ...base,
    levers: levers.map(({ name, kind, arguments: args, returns, example }) => ({ name, kind, arguments: args, returns, example })),
  });
}

/* ---------- mounting ---------- */

function agentGuard(lever, ctx, args) {
  if (lever.kind === "write" && !ctx.session.open) return agentFail("no-session", "no session is open");
  if (args.length > lever.maxArgs) {
    return agentFail("bad-argument", `${lever.name} takes ${lever.maxArgs === 0 ? "no arguments" : `at most ${lever.maxArgs} argument(s)`}`, `Call it as ${lever.example}`);
  }
  return null;
}

/** Runs one lever; the only place a thrown error is caught, so nothing can escape to the caller. */
function agentRun(lever, ctx, args) {
  try {
    return agentGuard(lever, ctx, args) ?? lever.run(...args);
  } catch (error) {
    console.warn(`agent-api ${lever.name}: ${error && error.message}`);
    return agentFail("internal-error", `${lever.name} failed unexpectedly`);
  }
}

function agentDefaultApi() {
  return { save: (payload) => saveStory(payload), list: () => listStories() };
}

/**
 * Installs `window.storytellingAgent`, the `<meta name="storytelling-agent">` tag and the JSON
 * manifest. No visible control is added (FR-A1). All dependencies are injectable for tests.
 *
 * @param {{ store?: object, storyStoreApi?: { save: Function, list: Function }, doc?: Document, win?: Window,
 *   data?: object, layoutFn?: Function, listTextFn?: Function, storyTextFn?: Function }} [options]
 * @returns {{ manifest: object, destroy: () => void }}
 */
function mountAgentApi(options = {}) {
  const doc = options.doc ?? globalThis.document;
  const win = options.win ?? globalThis.window ?? globalThis;
  const ctx = {
    store: options.store ?? storyStore,
    api: options.storyStoreApi ?? agentDefaultApi(),
    data: options.data ?? { ELEMENTS, CATEGORIES, ROGUE, ROGUE_DETAIL_TEXT, LIBRARY },
    layout: options.layoutFn ?? layout,
    listText: options.listTextFn ?? listText,
    storyText: options.storyTextFn ?? storyText,
    session: { open: false, name: null },
    manifest: null,
    setSession(open, name) {
      this.session.open = open;
      this.session.name = name;
      agentAnnounce(doc, { active: open, name });
    },
  };
  const levers = agentBuildLevers(ctx);
  ctx.manifest = buildManifest(levers);

  const agent = {};
  for (const lever of levers) agent[lever.name] = (...args) => agentPlain(agentRun(lever, ctx, args));
  win[AGENT_GLOBAL_NAME] = Object.freeze(agent);

  const nodes = agentInstallNodes(doc, ctx.manifest);
  return {
    manifest: ctx.manifest,
    destroy() {
      for (const node of nodes) node.remove();
      delete win[AGENT_GLOBAL_NAME];
      ctx.session.open = false;
    },
  };
}

function agentInstallNodes(doc, manifest) {
  if (!doc || typeof doc.createElement !== "function") return [];
  const meta = doc.createElement("meta");
  meta.setAttribute("name", AGENT_META_NAME);
  meta.setAttribute("content", `window.${AGENT_GLOBAL_NAME}`);
  const script = doc.createElement("script");
  script.setAttribute("type", "application/json");
  script.setAttribute("id", AGENT_MANIFEST_ID);
  script.textContent = JSON.stringify(manifest);
  const parent = doc.head ?? doc.body;
  parent.appendChild(meta);
  parent.appendChild(script);
  return [meta, script];
}

/** Tells the page's status line a session opened, closed or was renamed; the API draws nothing itself. */
function agentAnnounce(doc, detail) {
  if (!doc || typeof doc.dispatchEvent !== "function") return;
  const event = typeof CustomEvent === "function" ? new CustomEvent(EVT_AGENT_SESSION, { detail }) : { type: EVT_AGENT_SESSION, detail };
  doc.dispatchEvent(event);
}

// ---- main.js ----
/**
 * main.js — the only module that imports several others; it finds each page region by id and mounts the
 * module that owns it (documentation.spec §3). Modules talk to each other by events, so the order below
 * matters only where one needs another's return value (the drag-drop and library wiring).
 *
 * Every mount is isolated: a module that throws is logged by name and the rest of the page still comes up (JS-2).
 */

const LAYOUT_NAME = "revised";

/** Runs one mount; on failure logs which module broke and returns null so the others carry on. */
function mountSafely(moduleName, mount) {
  try {
    return mount();
  } catch (error) {
    console.error(`main: ${moduleName} failed to mount — the rest of the page continues without it.`, error);
    return null;
  }
}

/** The page region with this id, or null after logging which region is missing from index.html. */
function regionById(id) {
  const region = document.getElementById(id);
  if (!region) console.error(`main: index.html has no element with id "${id}"; the module that owns it is skipped.`);
  return region;
}

/** Mounts `mount(region)` on the region with this id; null if the region is missing or the mount fails. */
function mountInto(moduleName, id, mount) {
  const region = regionById(id);
  return region ? mountSafely(moduleName, () => mount(region)) : null;
}

/** Library entries open through the canvas so the name field, saved-state and unsaved-changes test agree. */
function libraryOptionsFor(canvas) {
  if (!canvas) return {};
  return {
    isDirty: () => canvas.hasUnsavedChanges(),
    open: (shape) => canvas.loadShape(shape, shape.name),
  };
}

/** Builds the whole page. Exported so a test page can call it; the module also runs it on load. */
function startStorytelling() {
  mountSafely("tooltip", () => mountTooltips(document));
  const diagramHost = regionById("diagram-host");
  if (diagramHost) mountSafely("diagram-svg", () => drawDiagram(diagramHost, LAYOUT_NAME));

  if (diagramHost) {
    mountSafely("viewport", () => mountViewport(diagramHost));
    mountSafely("selection", () => mountSelection(diagramHost));
  }
  mountInto("toolbar", "toolbar", (host) =>
    mountToolbar(host, { getSvg: () => diagramHost?.querySelector("svg") ?? null }));

  const canvas = mountInto("story-canvas", "story-area", (host) => mountStoryCanvas(host));
  if (diagramHost && canvas) mountSafely("drag-drop", () => mountDragDrop({ diagramHost, canvas }));

  mountInto("detail-panel", "detail-panel", (host) => mountDetailPanel(host));
  mountInto("list-panel", "list-panel", (host) => mountListPanel(host));
  mountInto("about-panel", "about-panel", (host) => mountAboutPanel(host));
  mountInto("library-panel", "library-panel", (host) => mountLibraryPanel(host, libraryOptionsFor(canvas)));

  if (diagramHost) mountSafely("story-highlight", () => mountStoryHighlight(diagramHost));
  mountSafely("agent-api", () => mountAgentApi());
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", startStorytelling, { once: true });
} else {
  startStorytelling();
}
})();
</script>
