const LOOP_HEIGHT = 46;
/** How far a loop ribbon first pushes out to the right of its source bead. */
const LOOP_OUT = 24;
/** A forward ribbon never bends tighter than this, so a short hop still curves. */
const MIN_CURVE_DX = 12;

const TANDEM_WIDTH_CLASS = 2;

/**
 * Width class of a bead: 2 for a tandem (it carries `with`), 1 otherwise.
 * @param {{ with?: string }} bead
 * @returns {1|2}
 */
function beadWidthClass(bead) {
  return bead && bead.with ? TANDEM_WIDTH_CLASS : 1;
}

/**
 * Arrange a story map.
 *
 * @param {Array<{ uid: string, with?: string }>} beads in the order they were added
 * @param {Array<[string, string]>} ribbons `[fromUid, toUid]` pairs, in the order they were made
 * @returns {{
 *   positions: Object<string, { x: number, y: number, w: number, h: number, layer: number, lane: number, widthClass: 1|2 }>,
 *   ribbonPaths: Array<{ from: string, to: string, loop: boolean, curve: Array<{x:number,y:number}> }>,
 *   loopRibbons: Array<[string, string]>,
 *   stepNumbers: Object<string, number>,
 *   order: string[],
 *   width: number,
 *   height: number
 * }} `order` lists uids in reading order (step 1 first). Unknown-uid ribbons are skipped with a warning.
 */
function layout(beads, ribbons) {
  const uids = collectUids(beads);
  const known = new Set(uids);
  const links = collectLinks(ribbons, known);
  if (uids.length === 0) return emptyLayout();

  const loopIdx = findLoopRibbonIndexes(uids, links);
  const dagLinks = links.filter((_, i) => !loopIdx.has(i));

  const layerOf = assignLayers(uids, dagLinks);
  const laneOf = assignLanes(uids, dagLinks, layerOf);
  const widthClassOf = new Map(beads.filter((b) => known.has(b.uid)).map((b) => [b.uid, beadWidthClass(b)]));

  const result = placeBeads(uids, layerOf, laneOf, widthClassOf, loopIdx.size > 0);
  result.loopRibbons = [...loopIdx].map((i) => [links[i].from, links[i].to]);
  result.ribbonPaths = links.map((link, i) => {
    const loop = loopIdx.has(i);
    return { from: link.from, to: link.to, loop, curve: curveBetween(result.positions, link.from, link.to, loop) };
  });
  return result;
}

/**
 * The four Bezier control points of a ribbon in an existing layout. Shared by drawing and hit-testing
 * so the line you see is the line you hit.
 *
 * @param {[string, string]} ribbon `[fromUid, toUid]`
 * @param {{ positions: object, loopRibbons?: Array<[string,string]> }} layoutResult from `layout()`
 * @param {boolean} [loop] force the loop variant on or off; by default read from `layoutResult.loopRibbons`
 * @returns {Array<{x:number,y:number}>|null} `[p0, p1, p2, p3]`, or null if either bead is not in the layout
 */
function ribbonCurve(ribbon, layoutResult, loop) {
  const [from, to] = ribbon;
  const isLoop = loop !== undefined
    ? loop
    : (layoutResult.loopRibbons || []).some(([f, t]) => f === from && t === to);
  return curveBetween(layoutResult.positions, from, to, isLoop);
}

/**
 * A point on a cubic Bezier.
 * @param {Array<{x:number,y:number}>} curve four control points
 * @param {number} t 0..1
 * @returns {{x:number,y:number}}
 */
function pointOnCurve(curve, t) {
  const [p0, p1, p2, p3] = curve;
  const u = 1 - t;
  const a = u * u * u;
  const b = 3 * u * u * t;
  const c = 3 * u * t * t;
  const d = t * t * t;
  return { x: a * p0.x + b * p1.x + c * p2.x + d * p3.x, y: a * p0.y + b * p1.y + c * p2.y + d * p3.y };
}

function emptyLayout() {
  return { positions: {}, ribbonPaths: [], loopRibbons: [], stepNumbers: {}, order: [], width: 0, height: 0 };
}

function collectUids(beads) {
  const seen = new Set();
  const uids = [];
  for (const bead of beads) {
    if (seen.has(bead.uid)) {
      console.warn(`story-layout: duplicate bead uid "${bead.uid}" ignored`);
      continue;
    }
    seen.add(bead.uid);
    uids.push(bead.uid);
  }
  return uids;
}

function collectLinks(ribbons, known) {
  const links = [];
  for (const [from, to] of ribbons) {
    if (!known.has(from) || !known.has(to)) {
      console.warn(`story-layout: ribbon ${from} -> ${to} names a bead not in the map; skipped`);
      continue;
    }
    links.push({ from, to });
  }
  return links;
}

/**
 * FR-C7 step 1. Depth-first walk from beads with no incoming ribbon (in bead order); a ribbon that
 * points at a bead still on the walk's stack closes a cycle and is a loop ribbon. Beads the roots
 * cannot reach (a pure cycle) are walked afterwards in bead order, so every bead is visited.
 * Iterative, so a 200-bead chain cannot overflow the call stack.
 */
function findLoopRibbonIndexes(uids, links) {
  const outgoing = new Map(uids.map((uid) => [uid, []]));
  const hasIncoming = new Set();
  links.forEach((link, i) => {
    outgoing.get(link.from).push({ to: link.to, index: i });
    hasIncoming.add(link.to);
  });

  const ON_STACK = 1;
  const DONE = 2;
  const state = new Map();
  const loops = new Set();

  const walk = (start) => {
    const stack = [{ uid: start, next: 0 }];
    state.set(start, ON_STACK);
    while (stack.length > 0) {
      const frame = stack[stack.length - 1];
      const edges = outgoing.get(frame.uid);
      if (frame.next >= edges.length) {
        state.set(frame.uid, DONE);
        stack.pop();
        continue;
      }
      const edge = edges[frame.next++];
      const targetState = state.get(edge.to);
      if (targetState === ON_STACK) loops.add(edge.index);
      else if (targetState === undefined) {
        state.set(edge.to, ON_STACK);
        stack.push({ uid: edge.to, next: 0 });
      }
    }
  };

  for (const uid of uids) if (!hasIncoming.has(uid) && !state.has(uid)) walk(uid);
  for (const uid of uids) if (!state.has(uid)) walk(uid);
  return loops;
}

/** FR-C7 step 2: longest path from any source, over the acyclic ribbons (Kahn's order, bead-order ties). */
function assignLayers(uids, dagLinks) {
  const layerOf = new Map(uids.map((uid) => [uid, 0]));
  const remaining = new Map(uids.map((uid) => [uid, 0]));
  const outgoing = new Map(uids.map((uid) => [uid, []]));
  for (const { from, to } of dagLinks) {
    remaining.set(to, remaining.get(to) + 1);
    outgoing.get(from).push(to);
  }
  const queue = uids.filter((uid) => remaining.get(uid) === 0);
  for (let head = 0; head < queue.length; head++) {
    const uid = queue[head];
    for (const to of outgoing.get(uid)) {
      layerOf.set(to, Math.max(layerOf.get(to), layerOf.get(uid) + 1));
      remaining.set(to, remaining.get(to) - 1);
      if (remaining.get(to) === 0) queue.push(to);
    }
  }
  return layerOf;
}

/**
 * FR-C7 step 3. Beads are visited by (layer, bead order). A start takes a new lane below all existing
 * ones; a bead that is its parent's first child, or a merge, takes its first parent's lane. If that
 * (layer, lane) cell is already taken the bead falls back to a new lane, so nothing ever overlaps.
 */
function assignLanes(uids, dagLinks, layerOf) {
  const parents = new Map(uids.map((uid) => [uid, []]));
  const firstChild = new Map();
  for (const { from, to } of dagLinks) {
    parents.get(to).push(from);
    if (!firstChild.has(from)) firstChild.set(from, to);
  }

  const indexOf = new Map(uids.map((uid, i) => [uid, i]));
  const ordered = [...uids].sort((a, b) => layerOf.get(a) - layerOf.get(b) || indexOf.get(a) - indexOf.get(b));

  const laneOf = new Map();
  const taken = new Set();
  let laneCount = 0;
  for (const uid of ordered) {
    const own = parents.get(uid);
    let lane;
    if (own.length > 0 && (own.length > 1 || firstChild.get(own[0]) === uid)) lane = laneOf.get(own[0]);
    if (lane === undefined || taken.has(`${layerOf.get(uid)}:${lane}`)) lane = laneCount++;
    laneCount = Math.max(laneCount, lane + 1);
    laneOf.set(uid, lane);
    taken.add(`${layerOf.get(uid)}:${lane}`);
  }
  return laneOf;
}

/** FR-C7 step 5: x from the widest bead of the layers before, y from the lane, numbers in (layer, lane) order. */
function placeBeads(uids, layerOf, laneOf, widthClassOf, hasLoops) {
  const layerCount = Math.max(...uids.map((uid) => layerOf.get(uid))) + 1;
  const laneCount = Math.max(...uids.map((uid) => laneOf.get(uid))) + 1;

  const layerWidth = new Array(layerCount).fill(0);
  for (const uid of uids) {
    const layer = layerOf.get(uid);
    layerWidth[layer] = Math.max(layerWidth[layer], widthClassOf.get(uid) * BEAD_W);
  }
  const layerX = [];
  let cursor = PAD_X;
  for (let layer = 0; layer < layerCount; layer++) {
    layerX.push(cursor);
    cursor += layerWidth[layer] + LAYER_GAP;
  }

  const top = PAD_Y + (hasLoops ? LOOP_HEIGHT : 0);
  const positions = {};
  for (const uid of uids) {
    const widthClass = widthClassOf.get(uid);
    positions[uid] = {
      x: layerX[layerOf.get(uid)],
      y: top + laneOf.get(uid) * (BEAD_H + LANE_GAP),
      w: widthClass * BEAD_W,
      h: BEAD_H,
      layer: layerOf.get(uid),
      lane: laneOf.get(uid),
      widthClass,
    };
  }

  const order = [...uids].sort((a, b) => positions[a].layer - positions[b].layer || positions[a].lane - positions[b].lane);
  const stepNumbers = {};
  order.forEach((uid, i) => { stepNumbers[uid] = i + 1; });

  return {
    positions,
    ribbonPaths: [],
    loopRibbons: [],
    stepNumbers,
    order,
    width: cursor - LAYER_GAP + PAD_X,
    height: top + laneCount * BEAD_H + (laneCount - 1) * LANE_GAP + PAD_Y,
  };
}

function curveBetween(positions, fromUid, toUid, loop) {
  const from = positions[fromUid];
  const to = positions[toUid];
  if (!from || !to) return null;
  return loop ? loopCurve(from, to) : forwardCurve(from, to);
}

/** Right side of the source to left side of the target; a tandem's edges are the whole pair's edges. */
function forwardCurve(from, to) {
  const p0 = { x: from.x + from.w, y: from.y + from.h / 2 };
  const p3 = { x: to.x, y: to.y + to.h / 2 };
  const dx = Math.max(MIN_CURVE_DX, (p3.x - p0.x) / 2);
  return [p0, { x: p0.x + dx, y: p0.y }, { x: p3.x - dx, y: p3.y }, p3];
}

/**
 * Leaves the source's right side, rises so the curve's peak clears the higher of the two beads by
 * LOOP_HEIGHT, and drops vertically into the top of the target (so the arrowhead points down). A cubic
 * with both inner control points at height c peaks at (y0 + y3 + 6c) / 8; solving for c hits the peak exactly.
 */
function loopCurve(from, to) {
  const p0 = { x: from.x + from.w, y: from.y + from.h / 2 };
  const p3 = { x: to.x + to.w / 2, y: to.y };
  const peakY = Math.min(from.y, to.y) - LOOP_HEIGHT;
  const controlY = (8 * peakY - p0.y - p3.y) / 6;
  return [p0, { x: p0.x + LOOP_OUT, y: controlY }, { x: p3.x, y: controlY }, p3];
}

// ---- story/story-text.js ----
/**
 * story-text.js — plain-text copy of a story map (story-map FR-C13).
 *
 * Pure function: no DOM, no side effects. One line per bead in layout order, so the copy, the
 * screen and the print all number beads the same way (D-13).
 */

const UNTITLED_NAME = "My story map";
const ROGUE_DEFAULT_LABEL = "Rogue";
const ROGUE_SYMBOL = "Rg";
const NOTE_INDENT = "  ";

let cachedElementLookup = null;

/** Looks an id up in the real data: `(elementId) => { id, name, symbol? } | undefined`. Built on first use. */
function defaultElementLookup() {
  if (!cachedElementLookup) {
    const byId = new Map(ELEMENTS.map((element) => [element.id, element]));
    cachedElementLookup = (elementId) => byId.get(elementId);
  }
  return cachedElementLookup;
}

/**
 * Produce the plain text that Copy puts on the clipboard (FR-C13):
 *
 *     <name>
 *     N. <symbol> — <name>                      a bead
 *     N. <sym> + <sym> — <name> + <name>        a tandem
 *     N. Rg — <label>                           a rogue card (as either half of a tandem: Rg and its label)
 *       <note>                                  the bead's note, indented, when it has one
 *
 * ` → a, b` is appended to a bead's line only when its ribbons do not lead solely to the
 * next-numbered bead; `a, b` are the step numbers of the beads it leads to, lowest first, so a
 * straight chain has no arrows and an element used twice is never ambiguous.
 *
 * @param {string} name Story name (falls back to "My story map" when blank)
 * @param {Array<{ uid: string, elementId: string, with?: string, label?: string, withLabel?: string, note?: string }>} beads
 * @param {Array<[string, string]>} ribbons [fromUid, toUid] pairs
 * @param {{ order: string[], stepNumbers: Object<string, number> }} layoutResult from `layout(beads, ribbons)`
 * @param {(elementId: string) => ({ id: string, name: string, symbol?: string } | undefined)} [lookup] defaults to ELEMENTS
 * @returns {string}
 */
function storyText(name, beads, ribbons, layoutResult, lookup = defaultElementLookup()) {
  const beadsByUid = new Map(beads.map((bead) => [bead.uid, bead]));
  const { order, stepNumbers } = layoutResult;

  const lines = [name || UNTITLED_NAME];
  for (const uid of order) {
    const bead = beadsByUid.get(uid);
    const stepNumber = stepNumbers[uid];
    if (!bead || stepNumber === undefined) {
      console.warn(`story-text: bead "${uid}" is in the layout order but missing from the map or unnumbered; left out of the copy`);
      continue;
    }
    lines.push(beadLine(bead, stepNumber, lookup) + arrowSuffix(uid, stepNumber, ribbons, stepNumbers));
    if (bead.note) lines.push(`${NOTE_INDENT}${bead.note}`);
  }
  return lines.join("\n");
}

function beadLine(bead, stepNumber, lookup) {
  const halves = [describeHalf(bead.elementId, bead.label, lookup)];
  if (bead.with) halves.push(describeHalf(bead.with, bead.withLabel, lookup));
  const symbols = halves.map((half) => half.symbol).join(" + ");
  const names = halves.map((half) => half.name).join(" + ");
  return `${stepNumber}. ${symbols} — ${names}`;
}

/** The symbol and the name to print for one element of a bead; a rogue card shows `Rg` and its label. */
function describeHalf(elementId, label, lookup) {
  if (elementId === ROGUE.id) return { symbol: ROGUE_SYMBOL, name: label || ROGUE_DEFAULT_LABEL };
  const element = lookup(elementId);
  if (!element) {
    console.warn(`story-text: no element "${elementId}"; printing its id instead`);
    return { symbol: elementId, name: elementId };
  }
  return { symbol: element.symbol ?? element.id, name: element.name };
}

/** ` → 3, 5` for the beads this one leads to, or "" when it leads only to the next-numbered bead (or nowhere). */
function arrowSuffix(uid, stepNumber, ribbons, stepNumbers) {
  const targets = [...new Set(ribbons.filter(([from]) => from === uid).map(([, to]) => stepNumbers[to]))]
    .filter((target) => target !== undefined)
    .sort((a, b) => a - b);
  const leadsOnlyToNext = targets.length === 1 && targets[0] === stepNumber + 1;
  return targets.length === 0 || leadsOnlyToNext ? "" : ` → ${targets.join(", ")}`;
}

// ---- shared/tooltip.js ----
/**
 * tooltip.js — hover-over text that shows in every browser, including the Claude app's built-in pane (which draws no
 * native `title` tooltips). A node carries its text in `data-tip`; one delegated listener on the document shows it in a
 * single floating `.st-tooltip` on hover or keyboard focus and hides it on leave, blur, scroll or Escape.
 */
const TIP_ATTR = "data-tip";
const GAP = 8;
const MARGIN = 8;

/** Sets (or, for empty text, removes) a node's hover-over text. */
function setTip(node, text) {
  if (text) node.setAttribute(TIP_ATTR, text);
  else node.removeAttribute(TIP_ATTR);
}

/** Left/top for a tip of `tipSize` next to `target`: below it, or above when there is no room, kept inside the viewport. */
function tipPosition(target, tipSize, viewport) {
  let left = Math.min(target.left, viewport.width - tipSize.width - MARGIN);
  left = Math.max(MARGIN, left);
  let top = target.bottom + GAP;
  if (top + tipSize.height > viewport.height - MARGIN) top = Math.max(MARGIN, target.top - GAP - tipSize.height);
  return { left, top };
}

/** Installs the delegated listeners once on `doc`. Returns `{ hide, destroy }`. */
function mountTooltips(doc = globalThis.document) {
  const tip = doc.createElement("div");
  tip.className = "st-tooltip";
  tip.setAttribute("role", "tooltip");
  tip.hidden = true;
  doc.body.appendChild(tip);
  let current = null;

  const tipTarget = (event) => (event.target && event.target.closest ? event.target.closest(`[${TIP_ATTR}]`) : null);

  function hide() {
    current = null;
    tip.hidden = true;
  }

  function show(target) {
    const text = target.getAttribute(TIP_ATTR);
    if (!text) return hide();
    current = target;
    tip.textContent = text;
    tip.hidden = false;
    const view = doc.defaultView ?? globalThis;
    const at = tipPosition(target.getBoundingClientRect(), tip.getBoundingClientRect(), { width: view.innerWidth, height: view.innerHeight });
    tip.style.left = `${at.left}px`;
    tip.style.top = `${at.top}px`;
  }

  const onOver = (event) => {
    const target = tipTarget(event);
    if (target && target !== current) show(target);
    else if (!target) hide();
  };
  const onOut = (event) => {
    if (current && !(event.relatedTarget && current.contains && current.contains(event.relatedTarget))) hide();
  };
  const onFocus = (event) => {
    const target = tipTarget(event);
    if (target) show(target);
  };
  const onKey = (event) => {
    if (event.key === "Escape") hide();
  };

  const listeners = [["mouseover", onOver], ["mouseout", onOut], ["focusin", onFocus], ["focusout", hide], ["scroll", hide], ["keydown", onKey]];
  for (const [name, handler] of listeners) doc.addEventListener(name, handler, true);
  return {
    hide,
    destroy() {
      for (const [name, handler] of listeners) doc.removeEventListener(name, handler, true);
      tip.remove?.();
    },
  };
}

// ---- story/story-model.js ----
/**
 * story-model.js — the only place a story (a graph of beads and ribbons) is changed.
 *
 * No DOM, no storage (story-map AD-C1). A store holds `{ beads, ribbons, activeUid }`, applies each
 * operation to a working copy and commits it only when the whole operation succeeds, so a refused
 * operation never leaves a half-changed map. Each commit sends `storytelling:story-changed` on
 * `document` (or an injected event target).
 *
 * Bead   = { uid, elementId, with?, label?, withLabel?, note? }     (key order is fixed, FR-A11)
 * Ribbon = [fromUid, toUid]
 * Target = { type: "empty" } | { type: "bead", uid } | { type: "ribbon", from, to } | { type: "dock", uid }
 *
 * Every operation returns `{ ok: true, ... }` or `{ ok: false, error: { code, message } }`.
 */

const MAX_BEADS = 200;
const MAX_RIBBONS = 400;
const TANDEM_MAX = 2;
const UNDO_MS = 6000;
const MAX_NOTE = 80;
const DEFAULT_ROGUE_LABEL = "Rogue";
const TANDEM_FULL_MESSAGE = "A tandem holds two";

/* ---------- small helpers ---------- */

const isPlainObject = (value) => value !== null && typeof value === "object" && !Array.isArray(value);
const ribbonKey = (from, to) => `${from}\u0000${to}`;
const textLength = (text) => [...text].length;

function refuse(code, message) {
  return { ok: false, error: { code, message } };
}

/** Guard for a caller mistake ("shouldn't happen" from the UI): refuse and say where (JS-2). */
function refuseBadCall(ctx, where, code, message) {
  ctx.warn(`story-model ${where}: ${message}`);
  return refuse(code, message);
}

let defaultLookup = null;
/** Default element check: every poster element plus the Rogue card. Built once, on first use. */
function defaultElementExists(elementId) {
  if (!defaultLookup) defaultLookup = new Set([...ELEMENTS.map((element) => element.id), ROGUE.id]);
  return defaultLookup.has(elementId);
}

function makeUidCounter() {
  let next = 1;
  return () => `b${next++}`;
}

const isRogueId = (elementId) => elementId === ROGUE.id;
const elementCount = (bead) => (bead.with ? 2 : 1);

/**
 * The one place a bead's shape is decided: fixed key order, absent fields omitted, a rogue half
 * always carries a label and a non-rogue half never does (AD-C2).
 */
function canonicalBead({ uid, elementId, with: partner, label, withLabel, note }) {
  const bead = { uid, elementId };
  if (partner) bead.with = partner;
  if (isRogueId(elementId)) bead.label = label || DEFAULT_ROGUE_LABEL;
  if (partner && isRogueId(partner)) bead.withLabel = withLabel || DEFAULT_ROGUE_LABEL;
  if (note) bead.note = note;
  return bead;
}

const cloneBead = (bead) => canonicalBead(bead);
const cloneState = (state) => ({
  beads: state.beads.map(cloneBead),
  ribbons: state.ribbons.map(([from, to]) => [from, to]),
  activeUid: state.activeUid,
});

const findBead = (work, uid) => work.beads.find((bead) => bead.uid === uid);
const ribbonIndex = (work, from, to) => work.ribbons.findIndex((r) => r[0] === from && r[1] === to);

/** Clean plain text: control characters and whitespace runs become one space; trimmed. */
function cleanText(value) {
  return value.replace(/[\u0000-]+/g, " ").replace(/\s+/g, " ").trim();
}

/** Validates a label or note. `max` is the character limit; empty text yields `undefined`. */
function readText(ctx, where, value, max, what) {
  if (value === undefined || value === null) return { ok: true, text: undefined };
  if (typeof value !== "string") return refuseBadCall(ctx, where, "bad-argument", `${what} must be text`);
  const text = cleanText(value);
  if (textLength(text) > max) return refuse("too-long", `${what} can be at most ${max} characters`);
  return { ok: true, text: text || undefined };
}

/* ---------- ribbons ---------- */

function addRibbon(work, from, to) {
  if (from === to) return refuse("self-link", "A bead cannot link to itself");
  if (ribbonIndex(work, from, to) >= 0) return refuse("duplicate-ribbon", "Those beads are already linked");
  if (work.ribbons.length >= MAX_RIBBONS) {
    return refuse("cap-reached", `A story holds at most ${MAX_RIBBONS} ribbons`);
  }
  work.ribbons.push([from, to]);
  return { ok: true };
}

/**
 * Takes a bead out of the ribbon graph and reconnects each bead that led into it to each bead it
 * led to (FR-C6). Healed ribbons take the place of the ribbon that led in, so a parent's first
 * child — which decides its lane — stays the first child. Returns the ribbons it added.
 */
function disconnect(work, uid, ctx) {
  const successors = work.ribbons.filter(([from]) => from === uid).map(([, to]) => to);
  const untouched = work.ribbons.filter(([from, to]) => from !== uid && to !== uid);
  const present = new Set(untouched.map(([from, to]) => ribbonKey(from, to)));
  const healed = [];
  const rebuilt = [];
  for (const ribbon of work.ribbons) {
    const [from, to] = ribbon;
    if (from === uid) continue;
    if (to !== uid) {
      rebuilt.push(ribbon);
      continue;
    }
    for (const next of successors) {
      if (from === next || present.has(ribbonKey(from, next))) continue;
      if (untouched.length + healed.length >= MAX_RIBBONS) {
        ctx.warn(`story-model remove: ribbon cap reached while reconnecting ${from} to ${next}`);
        continue;
      }
      present.add(ribbonKey(from, next));
      healed.push([from, next]);
      rebuilt.push([from, next]);
    }
  }
  work.ribbons = rebuilt;
  return healed;
}

/* ---------- targets ---------- */

function readTarget(ctx, where, target) {
  if (target === undefined || target === null) return { ok: true, target: { type: "empty" } };
  if (!isPlainObject(target)) return refuseBadCall(ctx, where, "bad-argument", "target must be an object");
  const { type } = target;
  if (type === "empty") return { ok: true, target: { type } };
  if ((type === "bead" || type === "dock") && typeof target.uid === "string") {
    return { ok: true, target: { type, uid: target.uid } };
  }
  if (type === "ribbon" && typeof target.from === "string" && typeof target.to === "string") {
    return { ok: true, target: { type, from: target.from, to: target.to } };
  }
  return refuseBadCall(ctx, where, "bad-argument", `unusable target ${JSON.stringify(target)}`);
}

/** Connects the bead `uid` (already in `work.beads`, carrying no ribbons) per the drop target. */
function attach(work, ctx, where, uid, target) {
  if (target.type === "bead") {
    if (target.uid === uid) return refuse("self-link", "A bead cannot branch from itself");
    if (!findBead(work, target.uid)) {
      return refuseBadCall(ctx, where, "unknown-bead", `no bead ${target.uid}`);
    }
    const added = addRibbon(work, target.uid, uid);
    return added.ok ? { ok: true, placed: "branched" } : added;
  }
  if (target.type === "ribbon") {
    const index = ribbonIndex(work, target.from, target.to);
    if (index < 0) {
      return refuseBadCall(ctx, where, "no-such-ribbon", `no ribbon ${target.from} → ${target.to}`);
    }
    if (work.ribbons.length >= MAX_RIBBONS) {
      return refuse("cap-reached", `A story holds at most ${MAX_RIBBONS} ribbons`);
    }
    work.ribbons.splice(index, 1, [target.from, uid], [uid, target.to]);
    return { ok: true, placed: "inserted" };
  }
  const active = work.activeUid;
  if (active && active !== uid && findBead(work, active)) {
    const added = addRibbon(work, active, uid);
    return added.ok ? { ok: true, placed: "joined" } : added;
  }
  return { ok: true, placed: "started" };
}

/* ---------- element / label validation ---------- */

function readElement(ctx, where, elementId, label) {
  if (typeof elementId !== "string" || !ctx.elementExists(elementId)) {
    return refuseBadCall(ctx, where, "unknown-element", `unknown element ${JSON.stringify(elementId)}`);
  }
  if (!isRogueId(elementId)) {
    if (label !== undefined && label !== null) {
      return refuseBadCall(ctx, where, "bad-argument", "only the Rogue card takes a label");
    }
    return { ok: true, label: undefined };
  }
  const text = readText(ctx, where, label, MAX_LABEL, "A label");
  if (!text.ok) return text;
  return { ok: true, label: text.text ?? DEFAULT_ROGUE_LABEL };
}

/* ---------- mutators: each edits a working copy and returns a result ---------- */

function mutateAdd(work, ctx, elementId, target, options) {
  const where = "addBead";
  const read = readTarget(ctx, where, target);
  if (!read.ok) return read;
  const opts = isPlainObject(options) ? options : {};
  if (read.target.type === "dock") return mutatePair(work, ctx, read.target.uid, elementId, opts);

  const element = readElement(ctx, where, elementId, opts.label);
  if (!element.ok) return element;
  const note = readText(ctx, where, opts.note, MAX_NOTE, "A note");
  if (!note.ok) return note;
  if (work.beads.length >= MAX_BEADS) return refuse("cap-reached", `A story holds at most ${MAX_BEADS} beads`);

  const uid = ctx.makeUid();
  work.beads.push(canonicalBead({ uid, elementId, label: element.label, note: note.text }));
  const attached = attach(work, ctx, where, uid, read.target);
  if (!attached.ok) return attached;
  work.activeUid = uid;
  return { ok: true, uid, placed: attached.placed };
}

function mutateMove(work, ctx, uid, target) {
  const where = "moveBead";
  const read = readTarget(ctx, where, target);
  if (!read.ok) return read;
  if (!findBead(work, uid)) return refuseBadCall(ctx, where, "unknown-bead", `no bead ${uid}`);
  if (read.target.type === "dock") return mutateMerge(work, ctx, uid, read.target.uid);

  disconnect(work, uid, ctx);
  const attached = attach(work, ctx, where, uid, read.target);
  if (!attached.ok) return attached;
  work.activeUid = uid;
  return { ok: true, uid, placed: attached.placed };
}

function mutateRemove(work, ctx, uid) {
  const index = work.beads.findIndex((bead) => bead.uid === uid);
  if (index < 0) return refuseBadCall(ctx, "removeBead", "unknown-bead", `no bead ${uid}`);
  const predecessor = work.ribbons.find(([, to]) => to === uid)?.[0] ?? null;
  const healed = disconnect(work, uid, ctx);
  work.beads.splice(index, 1);
  if (work.activeUid === uid) work.activeUid = predecessor;
  return { ok: true, uid, healed };
}

function mutateLink(work, ctx, fromUid, toUid) {
  if (!findBead(work, fromUid) || !findBead(work, toUid)) {
    return refuseBadCall(ctx, "linkBeads", "unknown-bead", `no bead ${!findBead(work, fromUid) ? fromUid : toUid}`);
  }
  return addRibbon(work, fromUid, toUid);
}

function mutateCut(work, ctx, fromUid, toUid) {
  const index = ribbonIndex(work, fromUid, toUid);
  if (index < 0) return refuseBadCall(ctx, "cutRibbon", "no-such-ribbon", `no ribbon ${fromUid} → ${toUid}`);
  work.ribbons.splice(index, 1);
  return { ok: true };
}

function replaceBead(work, uid, patch) {
  const index = work.beads.findIndex((bead) => bead.uid === uid);
  work.beads[index] = canonicalBead({ ...work.beads[index], ...patch });
}

function mutatePair(work, ctx, uid, elementId, options) {
  const where = "pairBead";
  const bead = findBead(work, uid);
  if (!bead) return refuseBadCall(ctx, where, "unknown-bead", `no bead ${uid}`);
  const opts = isPlainObject(options) ? options : {};
  const element = readElement(ctx, where, elementId, opts.label);
  if (!element.ok) return element;
  if (elementCount(bead) >= TANDEM_MAX) return refuse("tandem-full", TANDEM_FULL_MESSAGE);
  if (bead.elementId === elementId && !isRogueId(elementId)) {
    return refuse("same-element", "A tandem cannot pair an element with itself");
  }
  replaceBead(work, uid, { with: elementId, withLabel: element.label });
  work.activeUid = uid;
  return { ok: true, uid, placed: "paired" };
}

function mutateSplit(work, ctx, uid) {
  const where = "splitBead";
  const index = work.beads.findIndex((bead) => bead.uid === uid);
  if (index < 0) return refuseBadCall(ctx, where, "unknown-bead", `no bead ${uid}`);
  const bead = work.beads[index];
  if (!bead.with) return refuse("not-tandem", "That bead is not a tandem");
  if (work.beads.length >= MAX_BEADS) return refuse("cap-reached", `A story holds at most ${MAX_BEADS} beads`);
  if (work.ribbons.length >= MAX_RIBBONS) {
    return refuse("cap-reached", `A story holds at most ${MAX_RIBBONS} ribbons`);
  }
  const secondUid = ctx.makeUid();
  const first = canonicalBead({ uid, elementId: bead.elementId, label: bead.label, note: bead.note });
  const second = canonicalBead({ uid: secondUid, elementId: bead.with, label: bead.withLabel });
  work.beads.splice(index, 1, first, second);
  work.ribbons = work.ribbons.map(([from, to]) => (from === uid ? [secondUid, to] : [from, to]));
  work.ribbons.push([uid, secondUid]);
  if (work.activeUid === uid) work.activeUid = secondUid;
  return { ok: true, uid, secondUid };
}

function mutateSwap(work, ctx, uid) {
  const bead = findBead(work, uid);
  if (!bead) return refuseBadCall(ctx, "swapTandem", "unknown-bead", `no bead ${uid}`);
  if (!bead.with) return refuse("not-tandem", "That bead is not a tandem");
  replaceBead(work, uid, {
    elementId: bead.with,
    with: bead.elementId,
    label: bead.withLabel,
    withLabel: bead.label,
  });
  return { ok: true, uid };
}

/** Drag one bead onto another's dock (FR-C16c): its ribbons move to the target, its element joins it. */
function mutateMerge(work, ctx, fromUid, intoUid) {
  const where = "mergeBeads";
  const from = findBead(work, fromUid);
  const into = findBead(work, intoUid);
  if (!from || !into) {
    return refuseBadCall(ctx, where, "unknown-bead", `no bead ${!from ? fromUid : intoUid}`);
  }
  if (from === into) return refuse("self-link", "A bead cannot join itself");
  if (elementCount(from) + elementCount(into) > TANDEM_MAX) return refuse("tandem-full", TANDEM_FULL_MESSAGE);
  if (from.elementId === into.elementId && !isRogueId(from.elementId)) {
    return refuse("same-element", "A tandem cannot pair an element with itself");
  }
  const seen = new Set();
  work.ribbons = work.ribbons
    .map(([a, b]) => [a === fromUid ? intoUid : a, b === fromUid ? intoUid : b])
    .filter(([a, b]) => {
      const key = ribbonKey(a, b);
      if (a === b || seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  replaceBead(work, intoUid, {
    with: from.elementId,
    withLabel: from.label,
    note: into.note ?? from.note,
  });
  work.beads.splice(work.beads.findIndex((bead) => bead.uid === fromUid), 1);
  work.activeUid = intoUid;
  return { ok: true, uid: intoUid, merged: true };
}

function mutateSetNote(work, ctx, uid, text) {
  if (!findBead(work, uid)) return refuseBadCall(ctx, "setNote", "unknown-bead", `no bead ${uid}`);
  const note = readText(ctx, "setNote", text, MAX_NOTE, "A note");
  if (!note.ok) return note;
  replaceBead(work, uid, { note: note.text });
  return { ok: true, uid };
}

function mutateSetLabel(work, ctx, uid, text, options) {
  const where = "setLabel";
  const bead = findBead(work, uid);
  if (!bead) return refuseBadCall(ctx, where, "unknown-bead", `no bead ${uid}`);
  const half = isPlainObject(options) && options.half === "with" ? "with" : "main";
  const rogue = half === "with" ? bead.with && isRogueId(bead.with) : isRogueId(bead.elementId);
  if (!rogue) return refuse("not-rogue", "Only a Rogue card has a label");
  const label = readText(ctx, where, text, MAX_LABEL, "A label");
  if (!label.ok) return label;
  replaceBead(work, uid, half === "with" ? { withLabel: label.text } : { label: label.text });
  return { ok: true, uid };
}

/* ---------- loadStory: the one loader (FR-C14, library FR-L3) ---------- */

function refuseShape(message) {
  console.warn(`story-model loadStory: ${message}`);
  return refuse("bad-shape", message);
}

function readLoadedBeads(rawBeads, elementExists, makeUid) {
  const seenUids = new Set();
  const dropped = { beads: 0, ribbons: 0, halves: 0 };
  const uidMap = new Map();
  const beads = [];
  for (const raw of rawBeads) {
    if (!isPlainObject(raw) || typeof raw.uid !== "string" || !raw.uid || typeof raw.elementId !== "string") {
      return refuseShape("a bead needs a uid and an elementId");
    }
    if (seenUids.has(raw.uid)) return refuseShape(`two beads share the uid ${raw.uid}`);
    seenUids.add(raw.uid);
    if (!elementExists(raw.elementId)) {
      dropped.beads += 1;
      continue;
    }
    let partner = raw.with;
    if (partner !== undefined && (typeof partner !== "string" || !partner)) {
      return refuseShape(`bead ${raw.uid} has an unusable "with"`);
    }
    if (partner !== undefined && !elementExists(partner)) {
      dropped.halves += 1;
      partner = undefined;
    }
    if (partner === raw.elementId && !isRogueId(partner)) {
      return refuseShape(`bead ${raw.uid} pairs an element with itself`);
    }
    const texts = {};
    for (const [key, max, applies] of [
      ["label", MAX_LABEL, isRogueId(raw.elementId)],
      ["withLabel", MAX_LABEL, partner !== undefined && isRogueId(partner)],
      ["note", MAX_NOTE, true],
    ]) {
      if (raw[key] === undefined || !applies) continue;
      if (typeof raw[key] !== "string") return refuseShape(`bead ${raw.uid} has a ${key} that is not text`);
      const text = cleanText(raw[key]);
      if (textLength(text) > max) return refuseShape(`bead ${raw.uid} has a ${key} over ${max} characters`);
      texts[key] = text;
    }
    const uid = makeUid();
    uidMap.set(raw.uid, uid);
    beads.push(canonicalBead({ uid, elementId: raw.elementId, with: partner, ...texts }));
  }
  if (beads.length > MAX_BEADS) return refuseShape(`a story holds at most ${MAX_BEADS} beads`);
  return { ok: true, beads, dropped, uidMap, knownUids: seenUids };
}

function readLoadedRibbons(rawRibbons, uidMap, knownUids, dropped) {
  const ribbons = [];
  const seen = new Set();
  for (const raw of rawRibbons) {
    if (!Array.isArray(raw) || raw.length !== 2 || typeof raw[0] !== "string" || typeof raw[1] !== "string") {
      return refuseShape("a ribbon must be [fromUid, toUid]");
    }
    const from = uidMap.get(raw[0]);
    const to = uidMap.get(raw[1]);
    if (!from || !to) {
      if (!knownUids.has(raw[0]) || !knownUids.has(raw[1])) {
        console.warn(`story-model loadStory: ribbon ${raw[0]} → ${raw[1]} names a bead that is not in the story`);
      }
      dropped.ribbons += 1;
      continue;
    }
    const key = ribbonKey(from, to);
    if (from === to || seen.has(key)) {
      dropped.ribbons += 1;
      continue;
    }
    seen.add(key);
    ribbons.push([from, to]);
  }
  if (ribbons.length > MAX_RIBBONS) return refuseShape(`a story holds at most ${MAX_RIBBONS} ribbons`);
  return { ok: true, ribbons };
}

function droppedNote({ beads, halves }) {
  const parts = [];
  if (beads) parts.push(`Left out ${beads} bead${beads === 1 ? "" : "s"} whose element no longer exists.`);
  if (halves) parts.push(`Left out ${halves} tandem partner${halves === 1 ? "" : "s"} that no longer exist${halves === 1 ? "s" : ""}.`);
  return parts.join(" ");
}

/**
 * Validates a story shape (saved story, draft or library entry) and returns an editable copy with
 * fresh bead uids. Never aliases or mutates its input, so deep-frozen library data is safe.
 * Beads whose element no longer exists are dropped with their ribbons (FR-C12).
 *
 * @param {{ beads: object[], ribbons?: string[][], name?: string, agent?: boolean }} shape
 * @param {{ elementExists?: (id: string) => boolean, makeUid?: () => string }} [options]
 * @returns {{ ok: true, beads: object[], ribbons: string[][], name?: string, agent: boolean,
 *   dropped: { beads: number, ribbons: number, halves: number }, note: string,
 *   uidMap: Record<string, string> } | { ok: false, error: { code: string, message: string } }}
 */
function loadStory(shape, options = {}) {
  const elementExists = options.elementExists ?? defaultElementExists;
  const makeUid = options.makeUid ?? makeUidCounter();
  if (!isPlainObject(shape) || !Array.isArray(shape.beads)) return refuseShape("a story needs a beads array");
  if (shape.ribbons !== undefined && !Array.isArray(shape.ribbons)) return refuseShape("ribbons must be an array");

  const read = readLoadedBeads(shape.beads, elementExists, makeUid);
  if (!read.ok) return read;
  const ribbonRead = readLoadedRibbons(shape.ribbons ?? [], read.uidMap, read.knownUids, read.dropped);
  if (!ribbonRead.ok) return ribbonRead;
  return {
    ok: true,
    beads: read.beads,
    ribbons: ribbonRead.ribbons,
    name: typeof shape.name === "string" ? shape.name : undefined,
    agent: shape.agent === true,
    dropped: read.dropped,
    note: droppedNote(read.dropped),
    uidMap: Object.fromEntries(read.uidMap),
  };
}

/* ---------- the store ---------- */

/**
 * Builds a story store. Options (all injectable for tests):
 *  - `elementExists(id)` element lookup, default ELEMENTS + ROGUE;
 *  - `eventTarget` receiver of `storytelling:story-changed`, default `document` when there is one;
 *  - `makeUid()` bead id source; `now()` clock for the Undo window; `warn(msg)` guard logger.
 */
function createStoryStore(options = {}) {
  const ctx = {
    elementExists: options.elementExists ?? defaultElementExists,
    makeUid: options.makeUid ?? makeUidCounter(),
    now: options.now ?? (() => Date.now()),
    warn: options.warn ?? ((...args) => console.warn(...args)),
  };
  let state = { beads: [], ribbons: [], activeUid: null };
  let undoSnapshot = null;
  let undoDeadline = 0;

  function emit() {
    const target = options.eventTarget ?? globalThis.document;
    if (!target || typeof target.dispatchEvent !== "function") return;
    const detail = cloneState(state);
    const event = typeof CustomEvent === "function"
      ? new CustomEvent(EVT_STORY_CHANGED, { detail })
      : { type: EVT_STORY_CHANGED, detail };
    target.dispatchEvent(event);
  }

  function discardUndo() {
    undoSnapshot = null;
    undoDeadline = 0;
  }

  /** Runs a mutator on a copy; commits, drops the Undo snapshot (a map edit) and announces on success. */
  function commit(mutator, { edit = true } = {}) {
    const work = cloneState(state);
    const result = mutator(work);
    if (!result.ok) return result;
    state = work;
    if (edit) discardUndo();
    emit();
    return result;
  }

  function canUndo() {
    if (!undoSnapshot) return false;
    if (ctx.now() >= undoDeadline) {
      discardUndo();
      return false;
    }
    return true;
  }

  return {
    /** Current `{ beads, ribbons, activeUid }` as a deep copy. */
    getState: () => cloneState(state),
    /** One bead (a copy) or `undefined`. */
    getBead: (uid) => {
      const bead = findBead(state, uid);
      return bead ? cloneBead(bead) : undefined;
    },
    getActiveUid: () => state.activeUid,

    /** Drop, add-tile, or `C`: `options = { label?, note? }`. A `dock` target pairs (tandem). */
    addBead: (elementId, target, options) => commit((work) => mutateAdd(work, ctx, elementId, target, options)),
    /** Move a bead to any target; a `dock` target merges it into that bead. */
    moveBead: (uid, target) => commit((work) => mutateMove(work, ctx, uid, target)),
    /** Remove a bead and reconnect what led into it to what it led to. */
    removeBead: (uid) => commit((work) => mutateRemove(work, ctx, uid)),
    linkBeads: (fromUid, toUid) => commit((work) => mutateLink(work, ctx, fromUid, toUid)),
    cutRibbon: (fromUid, toUid) => commit((work) => mutateCut(work, ctx, fromUid, toUid)),

    /** `T` with a tile and a bead selected: the tile joins the bead in tandem. `options = { label? }`. */
    pairBead: (uid, elementId, options) => commit((work) => mutatePair(work, ctx, uid, elementId, options)),
    splitBead: (uid) => commit((work) => mutateSplit(work, ctx, uid)),
    swapTandem: (uid) => commit((work) => mutateSwap(work, ctx, uid)),
    mergeBeads: (fromUid, intoUid) => commit((work) => mutateMerge(work, ctx, fromUid, intoUid)),

    setNote: (uid, text) => commit((work) => mutateSetNote(work, ctx, uid, text)),
    /** Edit a rogue label; `options = { half: "with" }` edits the tandem partner's. */
    setLabel: (uid, text, options) => commit((work) => mutateSetLabel(work, ctx, uid, text, options)),

    /** Make a bead the active one (a click, or `Enter`). Not a map edit: Undo stays offered. */
    setActive: (uid) =>
      commit((work) => {
        if (!findBead(work, uid)) return refuseBadCall(ctx, "setActive", "unknown-bead", `no bead ${uid}`);
        work.activeUid = uid;
        return { ok: true, uid };
      }, { edit: false }),
    /** New ribbon: clear the active bead so the next drop starts an unattached bead. */
    newRibbon: () =>
      commit((work) => {
        work.activeUid = null;
        return { ok: true };
      }, { edit: false }),

    /** Empty the map, keeping one snapshot for `undo()`. Does nothing on an empty map. */
    clear: () => {
      if (state.beads.length === 0) return { ok: true, cleared: false };
      undoSnapshot = cloneState(state);
      undoDeadline = ctx.now() + UNDO_MS;
      state = { beads: [], ribbons: [], activeUid: null };
      emit();
      return { ok: true, cleared: true };
    },
    /** True while the snapshot from `clear()` is still offered (within UNDO_MS and no edit since). */
    canUndo,
    /** Milliseconds left in the Undo window; 0 when it is gone. */
    undoRemainingMs: () => (canUndo() ? undoDeadline - ctx.now() : 0),
    /** Restore the snapshot exactly, active bead included, and forget it. */
    undo: () => {
      if (!canUndo()) return refuse("nothing-to-undo", "There is nothing to undo");
      state = cloneState(undoSnapshot);
      discardUndo();
      emit();
      return { ok: true };
    },
    /** The caller's timer calls this at UNDO_MS so the snapshot is dropped. */
    discardUndo,

    /** A deep copy of the whole map, for callers that keep their own snapshot. */
    snapshot: () => cloneState(state),
    /** Replace the whole map from a `snapshot()`. Counts as an edit. */
    restore: (snapshot) => {
      if (!isPlainObject(snapshot) || !Array.isArray(snapshot.beads) || !Array.isArray(snapshot.ribbons)) {
        return refuseBadCall(ctx, "restore", "bad-argument", "restore needs a snapshot from snapshot()");
      }
      return commit((work) => {
        work.beads = snapshot.beads.map(cloneBead);
        work.ribbons = snapshot.ribbons.map(([from, to]) => [from, to]);
        work.activeUid = snapshot.activeUid ?? null;
        return { ok: true };
      });
    },

    /**
     * Open a saved story, draft or library entry as an editable copy (see `loadStory`). The last bead
     * becomes the active one so a new tile continues the story. Returns the `loadStory` result.
     */
    openStory: (shape) => {
      const loaded = loadStory(shape, { elementExists: ctx.elementExists, makeUid: ctx.makeUid });
      if (!loaded.ok) return loaded;
      commit((work) => {
        work.beads = loaded.beads.map(cloneBead);
        work.ribbons = loaded.ribbons.map(([from, to]) => [from, to]);
        work.activeUid = work.beads.length ? work.beads[work.beads.length - 1].uid : null;
        return { ok: true };
      });
      return loaded;
    },
  };
}

/* ---------- the app's own store, and bound functions for the modules that use it ---------- */

/** The one store the running app uses. Modules import the bound functions below. */
const storyStore = createStoryStore();

const getStoryState = () => storyStore.getState();
const getActiveUid = () => storyStore.getActiveUid();
const addBead = (elementId, target, options) => storyStore.addBead(elementId, target, options);
const moveBead = (uid, target) => storyStore.moveBead(uid, target);
const removeBead = (uid) => storyStore.removeBead(uid);
const linkBeads = (fromUid, toUid) => storyStore.linkBeads(fromUid, toUid);
const cutRibbon = (fromUid, toUid) => storyStore.cutRibbon(fromUid, toUid);
const pairBead = (uid, elementId, options) => storyStore.pairBead(uid, elementId, options);
const splitBead = (uid) => storyStore.splitBead(uid);
const swapTandem = (uid) => storyStore.swapTandem(uid);
const mergeBeads = (fromUid, intoUid) => storyStore.mergeBeads(fromUid, intoUid);
const setNote = (uid, text) => storyStore.setNote(uid, text);
const setLabel = (uid, text, options) => storyStore.setLabel(uid, text, options);
const setActive = (uid) => storyStore.setActive(uid);
const newRibbon = () => storyStore.newRibbon();
const clearStory = () => storyStore.clear();
const undoClear = () => storyStore.undo();
const canUndoClear = () => storyStore.canUndo();
const discardUndo = () => storyStore.discardUndo();
const openStory = (shape) => storyStore.openStory(shape);

// ---- story/story-store.js ----
/**
 * story-store.js — persistence for saved stories and the draft (story-map FR-C10 to FR-C12).
 *
 * The only file that touches `localStorage` (AD-C1), under `storytelling.stories.v1` and
 * `storytelling.draft.v1`. Every function takes an optional storage object (default: the browser's
 * localStorage, looked up safely because merely reading it can throw when it is blocked), so tests
 * pass a hand-built fake.
 *
 * Shape (AD-C2):
 *   stories: { version, stories: [{ name, beads, ribbons, agent? }] }   newest first, at most 200
 *   draft:   { version, beads, ribbons }
 *
 * Storage failure (FR-C12): if storage is missing, blocked, unreadable or full, the store keeps
 * working from memory and `storageStatus()` / `listStories().message` say why ("Storage full" or
 * "Storage unavailable"). A later successful write clears the message.
 *
 * Agent guard (FR-A8): an agent's save (`agent: true`) may replace only a story that an agent saved.
 * A save that does not pass `agent: true` is Luke's own gesture and may replace any story.
 */

const STORIES_KEY = "storytelling.stories.v1";
const DRAFT_KEY = "storytelling.draft.v1";
const CURRENT_VERSION = 1;
const MAX_SAVED = 200;
const MAX_NAME = 60;
const STORAGE_FULL_MESSAGE = "Storage full";
const STORAGE_UNAVAILABLE_MESSAGE = "Storage unavailable";

// Working copy of everything; storage is only ever a mirror of it.
let memoryStories = [];
let memoryDraft = null;
let savedStoriesRead = false;
let draftRead = false;
let storageProblem = "";

/** The given storage, else the browser's localStorage, else null (blocked storage throws on access). */
function resolveStorage(storage) {
  if (storage) return storage;
  try {
    return globalThis.localStorage ?? null;
  } catch (error) {
    return null;
  }
}

function isQuotaError(error) {
  return Boolean(error) && (error.name === "QuotaExceededError" || error.name === "NS_ERROR_DOM_QUOTA_REACHED" || error.code === 22 || error.code === 1014);
}

/** Records that storage failed, warning only when the problem is new so a blocked page does not spam the console. */
function noteStorageFailure(action, error) {
  const message = isQuotaError(error) ? STORAGE_FULL_MESSAGE : STORAGE_UNAVAILABLE_MESSAGE;
  if (storageProblem !== message) console.warn(`story-store: could not ${action}: ${error?.message ?? error}`);
  storageProblem = message;
}

function noteStorageWorks() {
  storageProblem = "";
}

/** A copy that shares nothing with the caller, in exactly the form storage would return. */
function plainCopy(value) {
  return JSON.parse(JSON.stringify(value));
}

function isSavedStory(candidate) {
  return Boolean(candidate) && typeof candidate.name === "string" && Array.isArray(candidate.beads);
}

/** Saved stories from a stored JSON string; unreadable or foreign data is reported and treated as empty (not as a storage failure). */
function parseSavedStories(json) {
  try {
    const data = JSON.parse(json);
    if (data && data.version === CURRENT_VERSION && Array.isArray(data.stories)) {
      return data.stories.filter(isSavedStory).map((story) => ({ ...story, ribbons: Array.isArray(story.ribbons) ? story.ribbons : [] }));
    }
    console.warn(`story-store: ignoring saved stories of an unknown shape (version ${data && data.version})`);
  } catch (error) {
    console.warn(`story-store: ignoring unreadable saved stories: ${error.message}`);
  }
  return [];
}

/** Reads the saved stories from storage once per page; afterwards memory is the source. */
function readSavedStoriesOnce(storage) {
  if (savedStoriesRead) return;
  savedStoriesRead = true;
  const target = resolveStorage(storage);
  if (!target) {
    noteStorageFailure("read saved stories", new Error("localStorage is not available"));
    return;
  }
  try {
    const json = target.getItem(STORIES_KEY);
    if (json) memoryStories = parseSavedStories(json);
  } catch (error) {
    noteStorageFailure("read saved stories", error);
  }
}

function persistSavedStories(storage) {
  const target = resolveStorage(storage);
  if (!target) {
    noteStorageFailure("save stories", new Error("localStorage is not available"));
    return;
  }
  try {
    target.setItem(STORIES_KEY, JSON.stringify({ version: CURRENT_VERSION, stories: memoryStories }));
    noteStorageWorks();
  } catch (error) {
    noteStorageFailure("save stories", error);
  }
}

function checkStoryName(name) {
  if (typeof name !== "string" || name.trim() === "") return "Name is required";
  if (name.length > MAX_NAME) return `Name must be 1–${MAX_NAME} characters`;
  return "";
}

/**
 * Save a story under a name (newest first; at most 200 saved).
 * A name that is already taken is refused with `exists: true` unless `replace` is true, so the
 * caller can ask inline. Refusals never throw; they return `{ ok: false, error, exists?, code? }`.
 * An agent save (`agent: true`) is also refused (`code: "not-agent-story"`, message contains
 * "non-agent") when the existing story was not saved by an agent, whatever `replace` says (FR-A8).
 *
 * @param {{ name: string, beads: object[], ribbons?: Array<[string, string]>, agent?: boolean, replace?: boolean }} story
 * @param {Storage} [storage] test stand-in for localStorage
 * @returns {{ ok: true } | { ok: false, error: string, exists?: boolean, code?: string }}
 */
function saveStory({ name, beads, ribbons = [], agent = false, replace = false }, storage) {
  readSavedStoriesOnce(storage);

  const nameProblem = checkStoryName(name);
  if (nameProblem) return { ok: false, error: nameProblem };
  if (!Array.isArray(beads) || beads.length === 0) return { ok: false, error: "Map is empty" };

  const existing = memoryStories.find((story) => story.name === name);
  if (existing && !replace) return { ok: false, error: "Story already exists", exists: true, code: "exists" };
  if (existing && agent && existing.agent !== true) {
    return { ok: false, error: "Cannot replace a non-agent story as an agent", code: "not-agent-story" };
  }
  if (!existing && memoryStories.length >= MAX_SAVED) {
    return { ok: false, error: `Saved stories are full (${MAX_SAVED}) — delete one to save another`, code: "full" };
  }

  const record = { name, beads: plainCopy(beads), ribbons: plainCopy(Array.isArray(ribbons) ? ribbons : []), ...(agent && { agent: true }) };
  memoryStories = [record, ...memoryStories.filter((story) => story !== existing)];

  persistSavedStories(storage);
  return { ok: true };
}

/**
 * The saved stories, newest first, each `{ name, agent? }`. `message` is present when storage has
 * failed, so the UI can say the list lives in memory only.
 *
 * @param {Storage} [storage]
 * @returns {{ ok: true, stories: Array<{ name: string, agent?: true }>, message?: string }}
 */
function listStories(storage) {
  readSavedStoriesOnce(storage);
  return {
    ok: true,
    stories: memoryStories.map((story) => ({ name: story.name, ...(story.agent && { agent: true }) })),
    ...(storageProblem && { message: storageProblem }),
  };
}

/**
 * Open a saved story by name: a copy of its beads and ribbons, plus `agent` if an agent saved it.
 *
 * @param {string} name
 * @param {Storage} [storage]
 * @returns {{ ok: true, name: string, beads: object[], ribbons: Array<[string, string]>, agent?: true } | { ok: false, error: string }}
 */
function openSavedStory(name, storage) {
  readSavedStoriesOnce(storage);
  const story = memoryStories.find((candidate) => candidate.name === name);
  if (!story) return { ok: false, error: "Story not found" };
  return { ok: true, name: story.name, beads: plainCopy(story.beads), ribbons: plainCopy(story.ribbons), ...(story.agent && { agent: true }) };
}

/**
 * Delete a saved story.
 *
 * @param {string} name
 * @param {Storage} [storage]
 * @returns {{ ok: boolean, error?: string }}
 */
function deleteStory(name, storage) {
  readSavedStoriesOnce(storage);
  if (!memoryStories.some((story) => story.name === name)) return { ok: false, error: "Story not found" };
  memoryStories = memoryStories.filter((story) => story.name !== name);
  persistSavedStories(storage);
  return { ok: true };
}

/**
 * Write the current, unsaved map as the draft; called on every change (FR-C11).
 * Always succeeds from the caller's view: if storage fails the draft stays in memory.
 *
 * @param {object[]} beads
 * @param {Array<[string, string]>} [ribbons]
 * @param {Storage} [storage]
 * @returns {{ ok: true }}
 */
function writeDraft(beads, ribbons = [], storage) {
  memoryDraft = { version: CURRENT_VERSION, beads: plainCopy(Array.isArray(beads) ? beads : []), ribbons: plainCopy(Array.isArray(ribbons) ? ribbons : []) };
  draftRead = true;

  const target = resolveStorage(storage);
  if (!target) {
    noteStorageFailure("write the draft", new Error("localStorage is not available"));
    return { ok: true };
  }
  try {
    target.setItem(DRAFT_KEY, JSON.stringify(memoryDraft));
    noteStorageWorks();
  } catch (error) {
    noteStorageFailure("write the draft", error);
  }
  return { ok: true };
}

/**
 * The draft to restore at load (FR-C11): empty beads and ribbons when there is none.
 * `message` is present when storage has failed.
 *
 * @param {Storage} [storage]
 * @returns {{ ok: true, beads: object[], ribbons: Array<[string, string]>, message?: string }}
 */
function readDraft(storage) {
  if (!draftRead) {
    draftRead = true;
    readDraftFromStorage(storage);
  }
  return {
    ok: true,
    beads: memoryDraft ? plainCopy(memoryDraft.beads) : [],
    ribbons: memoryDraft ? plainCopy(memoryDraft.ribbons) : [],
    ...(storageProblem && { message: storageProblem }),
  };
}

function readDraftFromStorage(storage) {
  const target = resolveStorage(storage);
  if (!target) {
    noteStorageFailure("read the draft", new Error("localStorage is not available"));
    return;
  }
  let json;
  try {
    json = target.getItem(DRAFT_KEY);
  } catch (error) {
    noteStorageFailure("read the draft", error);
    return;
  }
  if (!json) return;
  try {
    const data = JSON.parse(json);
    if (data && data.version === CURRENT_VERSION && Array.isArray(data.beads)) {
      memoryDraft = { version: CURRENT_VERSION, beads: data.beads, ribbons: Array.isArray(data.ribbons) ? data.ribbons : [] };
    } else {
      console.warn("story-store: ignoring a draft of an unknown shape");
    }
  } catch (error) {
    console.warn(`story-store: ignoring an unreadable draft: ${error.message}`);
  }
}

/**
 * Whether storage is working, for the UI's one-time note next to Save (FR-C12).
 *
 * @returns {{ available: boolean, message: string }} `message` is "" when available
 */
function storageStatus() {
  return { available: storageProblem === "", message: storageProblem };
}

/** Forget everything held in memory, as at a fresh page load. For tests, which share this module's state. */
function resetStoryStore() {
  memoryStories = [];
  memoryDraft = null;
  savedStoriesRead = false;
  draftRead = false;
  storageProblem = "";
}

// ---- story/story-canvas.js ----
/**
 * story-canvas.js — the story map's renderer and its own toolbar (story-map FR-C4, C8–C12, C13, C15–C17).
 *
 * Draws beads and ribbons from `layout()` and the story store; it never decides where a bead sits and
 * never changes a story except through the bound story-model functions. Pointer drags (ghost, hit-testing,
 * link-dot drag) belong to drag-drop.js, which uses `getLayoutResult()`, `setDropTarget()` and
 * `setDragging()` from here.
 *
 * `canvasEl` is the content box (`.st-tray__content`), NOT the whole area: drag-drop.js turns pointer
 * positions into layout coordinates with `canvasEl.getBoundingClientRect()`, so it must be the element
 * whose top-left is the layout origin (no padding or border; it moves with the tray's scroll). The whole
 * area is `areaEl`.
 *
 * DOM contract (class and data-attribute names are the interface for drag-drop.js and the CSS):
 *   .st-story                                   the whole area (areaEl)
 *     .st-story__toolbar                        savebar + actions
 *     .st-story__saved                          saved-stories list + Library button
 *     .st-story__status                         count + "Next tile joins…" line
 *     .st-tray[data-hint][data-empty]           the scrolling tray (trayEl)
 *       .st-tray__empty                         empty state
 *       .st-tray__content                       relative box sized to the layout (canvasEl = contentEl)
 *         svg.st-threads                        ribbons (threadsEl)
 *         .st-tray__beads                       the beads
 *         button.st-thread-cut                  cut control for the selected ribbon
 * See the module's report for the full list.
 */

const CANVAS_SVG_NS = "http://www.w3.org/2000/svg";
const NAME_MAX = 60;

/** Drop-target wording (story-map FR-C3); drag-drop.js relies on the tray's `data-hint` carrying these. */
const HINT_BRANCH = "Branch from this bead";
const HINT_INSERT = "Insert on this ribbon";
const HINT_ADD = "Add to the story";
const HINT_DOCK = "Pair as a tandem";

const CANVAS_ELEMENTS = new Map([...ELEMENTS, ROGUE].map((element) => [element.id, element]));

/* ---------- small DOM helpers (never innerHTML, D-11) ---------- */

function canvasNode(tag, className, text) {
  const node = globalThis.document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function canvasButton(className, label, attributes = {}) {
  const button = canvasNode("button", className, label);
  button.setAttribute("type", "button");
  for (const [name, value] of Object.entries(attributes)) button.setAttribute(name, value);
  return button;
}

function canvasSvgNode(tag, attributes = {}) {
  const node = globalThis.document.createElementNS(CANVAS_SVG_NS, tag);
  for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, String(value));
  return node;
}

const canvasClosest = (node, selector) => (node && typeof node.closest === "function" ? node.closest(selector) : null);

function canvasIsEditable(node) {
  const tag = String(node?.tagName ?? "").toUpperCase();
  return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || node?.isContentEditable === true;
}

/* ---------- what a bead shows ---------- */

function halfInfo(bead, which) {
  const elementId = which === "with" ? bead.with : bead.elementId;
  const label = which === "with" ? bead.withLabel : bead.label;
  const element = CANVAS_ELEMENTS.get(elementId);
  const rogue = elementId === ROGUE.id;
  if (!element) console.warn(`story-canvas: bead ${bead.uid} names unknown element ${elementId}`);
  return {
    which,
    elementId,
    rogue,
    label: rogue ? label || DEFAULT_ROGUE_LABEL : undefined,
    group: rogue ? "rogue" : element?.group ?? "unknown",
    added: Boolean(element?.added),
    symbol: rogue ? ROGUE.id : element?.symbol ?? elementId,
    name: rogue ? label || DEFAULT_ROGUE_LABEL : element?.name ?? elementId,
  };
}

const beadHalves = (bead) => (bead.with ? [halfInfo(bead, "main"), halfInfo(bead, "with")] : [halfInfo(bead, "main")]);

function beadTitle(bead) {
  const halves = beadHalves(bead);
  return { symbol: halves.map((h) => h.symbol).join(" + "), name: halves.map((h) => h.name).join(" + ") };
}

function beadFaceSignature(bead, step, editingHalf) {
  return JSON.stringify([bead.elementId, bead.with, bead.label, bead.withLabel, bead.note, step, editingHalf]);
}

/* ---------- DOM builders ---------- */

function buildHalfNode(half, editingHalf, onLabelKey, onLabelBlur) {
  const classes = ["st-bead__half", `tile-${half.group}`];
  if (half.added) classes.push("is-added");
  if (half.rogue) classes.push("is-rogue");
  const node = canvasNode("div", classes.join(" "));
  node.setAttribute("data-element-id", half.elementId);
  node.setAttribute("data-half", half.which);
  node.appendChild(canvasNode("span", "st-bead__symbol", half.symbol));
  if (editingHalf === half.which && half.rogue) {
    const input = canvasNode("input", "st-bead__label-input");
    input.setAttribute("type", "text");
    input.setAttribute("maxlength", String(MAX_LABEL));
    input.setAttribute("aria-label", "Name for this rogue element");
    input.value = half.label;
    input.addEventListener("keydown", onLabelKey);
    input.addEventListener("blur", onLabelBlur);
    node.appendChild(input);
  } else {
    node.appendChild(canvasNode("span", "st-bead__name", half.name));
  }
  return node;
}

function buildSeamNode() {
  const seam = canvasNode("span", "st-bead__seam");
  seam.appendChild(canvasNode("span", "st-bead__seam-plus", "+"));
  seam.appendChild(canvasButton("st-bead__swap", "⇄", { "aria-label": "Swap the two elements" }));
  seam.appendChild(canvasButton("st-bead__split", "Split", { "aria-label": "Split into two beads" }));
  return seam;
}

/** Fills a bead node's children; returns its dock node (or null for a tandem, which takes no third). */
function fillBeadNode(node, bead, step, editingHalf, handlers) {
  const halves = beadHalves(bead);
  const tiles = canvasNode("div", "st-bead__tiles");
  const halfNodes = halves.map((half) => buildHalfNode(half, editingHalf, handlers.onLabelKey, handlers.onLabelBlur));
  tiles.appendChild(halfNodes[0]);
  if (halfNodes[1]) {
    tiles.appendChild(buildSeamNode());
    tiles.appendChild(halfNodes[1]);
  }
  const parts = [canvasNode("span", "st-bead__step", String(step)), tiles];
  parts.push(canvasButton("st-bead__remove", "×", { "aria-label": `Remove step ${step}` }));
  parts.push(canvasButton("st-bead__link-dot", "", { "aria-label": `Link from step ${step}`, tabindex: "-1" }));
  let dock = null;
  if (!bead.with) {
    dock = canvasNode("span", "st-bead__dock");
    dock.setAttribute("data-dock-for", bead.uid);
    dock.setAttribute("aria-hidden", "true");
    parts.push(dock);
  }
  if (bead.note) parts.push(canvasNode("span", "st-bead__note", bead.note));
  node.replaceChildren(...parts);
  const title = beadTitle(bead);
  node.setAttribute("aria-label", `Step ${step}: ${title.name}`);
  setTip(node, bead.note);
  return dock;
}

function buildThreadsRoot() {
  const svg = canvasSvgNode("svg", { class: "st-threads", "aria-hidden": "false", focusable: "false" });
  const defs = canvasSvgNode("defs");
  const marker = canvasSvgNode("marker", {
    id: "st-arrow",
    viewBox: "0 0 10 10",
    refX: 9,
    refY: 5,
    markerWidth: 7,
    markerHeight: 7,
    orient: "auto-start-reverse",
  });
  marker.appendChild(canvasSvgNode("path", { class: "st-threads__arrow", d: "M0,0 L10,5 L0,10 z", fill: "currentColor" }));
  defs.appendChild(marker);
  return { svg, defs };
}

const curvePath = ([p0, p1, p2, p3]) => `M${p0.x},${p0.y} C${p1.x},${p1.y} ${p2.x},${p2.y} ${p3.x},${p3.y}`;

function buildThreadNode(ribbonPath, steps, selected) {
  const classes = ["st-thread"];
  if (ribbonPath.loop) classes.push("is-loop");
  if (selected) classes.push("is-selected");
  const group = canvasSvgNode("g", {
    class: classes.join(" "),
    tabindex: 0,
    role: "button",
    "data-from": ribbonPath.from,
    "data-to": ribbonPath.to,
    "aria-label": `Ribbon from step ${steps[ribbonPath.from]} to step ${steps[ribbonPath.to]}. Enter selects it, Delete cuts it.`,
  });
  const d = curvePath(ribbonPath.curve);
  group.appendChild(canvasSvgNode("path", { class: "st-thread__hit", d, fill: "none", stroke: "transparent", "stroke-width": 14, "pointer-events": "stroke" }));
  group.appendChild(canvasSvgNode("path", { class: "st-thread__line", d, fill: "none", "marker-end": "url(#st-arrow)" }));
  return group;
}

function buildToolbarDom() {
  const root = canvasNode("div", "st-story");
  const toolbar = canvasNode("div", "st-story__toolbar");
  toolbar.setAttribute("role", "toolbar");
  toolbar.setAttribute("aria-label", "Story map");

  const savebar = canvasNode("div", "st-story__savebar");
  const nameLabel = canvasNode("label", "st-story__name-label");
  nameLabel.appendChild(canvasNode("span", "st-story__name-caption", "Story name"));
  const nameInput = canvasNode("input", "st-story__name");
  nameInput.setAttribute("type", "text");
  nameInput.setAttribute("maxlength", String(NAME_MAX));
  nameInput.setAttribute("placeholder", "Name this story");
  nameLabel.appendChild(nameInput);
  const saveButton = canvasButton("st-story__save", "Save");
  const message = canvasNode("span", "st-story__message");
  message.setAttribute("role", "status");
  const storageNote = canvasNode("span", "st-story__storage-note");
  storageNote.hidden = true;
  const prompt = canvasNode("span", "st-story__prompt");
  prompt.hidden = true;
  savebar.append(nameLabel, saveButton, message, storageNote, prompt);

  const actions = canvasNode("div", "st-story__actions");
  const newRibbonButton = canvasButton("st-story__new-ribbon", "New ribbon");
  const addButton = canvasButton("st-story__add", "Add to story");
  const clearButton = canvasButton("st-story__clear", "Clear");
  const undo = canvasNode("span", "st-story__undo");
  undo.hidden = true;
  const undoButton = canvasButton("st-story__undo-btn", "Undo");
  const undoTimer = canvasNode("span", "st-story__undo-timer");
  undoTimer.setAttribute("aria-hidden", "true");
  undo.append(undoButton, undoTimer);
  const copyButton = canvasButton("st-story__copy", "Copy");
  const printWrap = canvasNode("span", "st-story__print");
  const printToggle = canvasButton("st-story__print-toggle", "Print", { "aria-haspopup": "true", "aria-expanded": "false" });
  const printMenu = canvasNode("span", "st-story__print-menu");
  printMenu.hidden = true;
  for (const [target, targetLabel] of [["story", "Ribbon only"], ["story-with-table", "Ribbon with table"]]) {
    for (const [tone, toneLabel] of [["colour", "Colour"], ["gray", "Grayscale"]]) {
      printMenu.appendChild(canvasButton("st-story__print-option", `${targetLabel} — ${toneLabel}`, {
        "data-print-target": target,
        "data-print-tone": tone,
      }));
    }
  }
  printWrap.append(printToggle, printMenu);
  actions.append(newRibbonButton, addButton, clearButton, undo, copyButton, printWrap);
  toolbar.append(savebar, actions);

  const saved = canvasNode("div", "st-story__saved");
  const savedHead = canvasNode("div", "st-story__saved-head");
  savedHead.appendChild(canvasNode("span", "st-story__saved-title", "Saved stories"));
  const libraryButton = canvasButton("st-story__library", "Library");
  savedHead.appendChild(libraryButton);
  const savedList = canvasNode("ul", "st-story__saved-list");
  const savedEmpty = canvasNode("p", "st-story__saved-empty", "No saved stories yet.");
  saved.append(savedHead, savedList, savedEmpty);

  const status = canvasNode("div", "st-story__status");
  const count = canvasNode("span", "st-story__count");
  const next = canvasNode("span", "st-story__next");
  next.setAttribute("role", "status");
  status.append(count, next);

  const tray = canvasNode("div", "st-tray");
  tray.setAttribute("role", "region");
  tray.setAttribute("aria-label", "Story map tray");
  tray.setAttribute("tabindex", "-1");
  const empty = canvasNode("p", "st-tray__empty", "Drag a tile here, or select one and press C, to start a story.");
  const content = canvasNode("div", "st-tray__content");
  const { svg, defs } = buildThreadsRoot();
  const beadsLayer = canvasNode("div", "st-tray__beads");
  const cut = canvasButton("st-thread-cut", "Cut", { "aria-label": "Cut this ribbon" });
  cut.hidden = true;
  content.append(svg, beadsLayer, cut);
  tray.append(empty, content);

  root.append(toolbar, saved, status, tray);
  return {
    root, nameInput, saveButton, message, storageNote, prompt, newRibbonButton, addButton, clearButton, undo,
    undoButton, undoTimer, copyButton, printToggle, printMenu, libraryButton, savedList, savedEmpty, count, next,
    tray, empty, content, svg, defs, beadsLayer, cut,
  };
}

/**
 * Usable sheet width for a landscape print, in CSS px: Letter (279.4mm) less the 10mm @page margins on each side is
 * about 980px, the narrower of Letter and A4, so one scale fits both. print.css applies it as `zoom` on the map.
 */
const PRINT_SHEET_WIDTH_PX = 980;
const PRINT_SCALE_PROPERTY = "--print-scale";
const MAP_PRINT_TARGETS = ["story", "story-with-table"];

/** Factor that fits a map of `mapWidth` px on one sheet's width; never above 1 (a small map prints at its own size). */
function printScaleFor(mapWidth, sheetWidth = PRINT_SHEET_WIDTH_PX) {
  return mapWidth > sheetWidth ? sheetWidth / mapWidth : 1;
}

const signatureOf = (state) => JSON.stringify([state.beads, state.ribbons]);
const threadKey = (from, to) => `${from}\u0000${to}`;
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

function emitOnDocument(type, detail) {
  const target = globalThis.document;
  const event = typeof CustomEvent === "function" ? new CustomEvent(type, { detail }) : { type, detail };
  target.dispatchEvent(event);
}

/**
 * Mounts the story map (toolbar, saved list, status line and tray) inside `host`.
 *
 * @param {HTMLElement} host
 * @param {{ storage?: object, setTimer?: Function, clearTimer?: Function,
 *   copyText?: Function, setPrintTarget?: Function }} [options] injection points for tests
 * @returns {{ areaEl: HTMLElement, canvasEl: HTMLElement, trayEl: HTMLElement, contentEl: HTMLElement, threadsEl: Element,
 *   getLayoutResult: () => object, setDropTarget: (target: object|null) => void,
 *   setDragging: (active: boolean, pairable?: boolean) => void, showMessage: (text: string, kind?: string) => void,
 *   openShape: (shape: object, name?: string) => void, loadShape: (shape: object, name?: string) => object,
 *   hasUnsavedChanges: () => boolean,
 *   render: () => void, destroy: () => void }}
 */
function mountStoryCanvas(host, options = {}) {
  const storage = options.storage;
  const startTimer = options.setTimer ?? ((fn, ms) => globalThis.setTimeout(fn, ms));
  const stopTimer = options.clearTimer ?? ((id) => globalThis.clearTimeout(id));
  const doCopy = options.copyText ?? copyText;
  const doPrint = options.setPrintTarget ?? setPrintTarget;

  const dom = buildToolbarDom();
  const { tray, content, svg, beadsLayer } = dom;
  host.appendChild(dom.root);

  const beadNodes = new Map();
  const dockNodes = new Map();
  const faceSignatures = new Map();
  let threadNodes = new Map();
  let markedNodes = [];
  let lastLayout = layout([], []);
  let lastBeads = new Map();
  let hasRendered = false;
  let selectedElementId = null;
  let selectedRibbon = null;
  let linkFrom = null;
  let editing = null;
  let focusEditorNext = false;
  let dropTarget = null;
  let undoTimerId = null;
  let storageNoticeShown = false;
  let quietRogueEdit = 0;
  let savedSignature = signatureOf({ beads: [], ribbons: [] });

  /* ----- messages, prompts, storage notice ----- */

  function say(text, kind = "info") {
    dom.message.textContent = text;
    dom.message.setAttribute("data-kind", kind);
  }

  function clearPrompt() {
    dom.prompt.replaceChildren();
    dom.prompt.hidden = true;
  }

  function askPrompt(text, choices) {
    const parts = [canvasNode("span", "st-story__prompt-text", text)];
    for (const choice of choices) {
      const button = canvasButton("st-story__prompt-btn", choice.label, { "data-choice": choice.label });
      button.addEventListener("click", () => {
        clearPrompt();
        if (choice.run) choice.run();
      });
      parts.push(button);
    }
    dom.prompt.replaceChildren(...parts);
    dom.prompt.hidden = false;
  }

  function checkStorage() {
    const status = storageStatus();
    if (status.available || storageNoticeShown) return;
    storageNoticeShown = true;
    dom.storageNote.textContent = `${status.message || "Storage unavailable"} — saving is off, so your story is kept in memory only until you close this page.`;
    dom.storageNote.hidden = false;
  }

  /* ----- saved stories ----- */

  function renderSaved() {
    const result = listStories(storage);
    const items = (result.stories ?? []).map((story) => {
      const item = canvasNode("li", "st-story__saved-item");
      item.setAttribute("data-story-name", story.name);
      item.appendChild(canvasButton("st-story__open", story.name));
      if (story.agent) {
        const chip = canvasNode("span", "st-story__ai", "AI");
        setTip(chip, "Saved by an agent");
        item.appendChild(chip);
      }
      item.appendChild(canvasButton("st-story__delete", "Delete", { "aria-label": `Delete ${story.name}` }));
      return item;
    });
    dom.savedList.replaceChildren(...items);
    dom.savedEmpty.hidden = items.length > 0;
    checkStorage();
  }

  const hasUnsavedChanges = () => {
    const state = getStoryState();
    return state.beads.length > 0 && signatureOf(state) !== savedSignature;
  };

  function loadShape(shape, name) {
    quietRogueEdit += 1;
    let loaded;
    try {
      loaded = openStory(shape);
    } finally {
      quietRogueEdit -= 1;
    }
    if (!loaded.ok) {
      say(loaded.error.message, "error");
      return loaded;
    }
    dom.nameInput.value = name ?? shape.name ?? "";
    savedSignature = signatureOf(getStoryState());
    say(loaded.note || (dom.nameInput.value ? `Opened “${dom.nameInput.value}”.` : "Opened."));
    return loaded;
  }

  /** Asks first when the map has unsaved changes; `loadShape` is the same open without asking, for a caller (the Library panel) that already did. */
  function openShape(shape, name) {
    clearPrompt();
    const title = name ?? shape.name ?? "this story";
    if (!hasUnsavedChanges()) {
      loadShape(shape, name);
      return;
    }
    askPrompt(`Open “${title}”? The current map has unsaved changes.`, [
      { label: "Open anyway", run: () => loadShape(shape, name) },
      { label: "Cancel" },
    ]);
  }

  function openSaved(name) {
    const result = openSavedStory(name, storage);
    if (!result.ok) {
      say(result.error, "error");
      return;
    }
    openShape({ beads: result.beads, ribbons: result.ribbons, name, agent: result.agent }, name);
  }

  function performSave(name, replace) {
    const state = getStoryState();
    const result = saveStory({ name, beads: state.beads, ribbons: state.ribbons, replace }, storage);
    if (result.exists) {
      askPrompt(`“${name}” already exists.`, [
        { label: "Replace", run: () => performSave(name, true) },
        { label: "Cancel" },
      ]);
      return;
    }
    if (!result.ok) {
      say(result.error, "error");
      return;
    }
    savedSignature = signatureOf(state);
    say(`Saved “${name}”.`);
    renderSaved();
    checkStorage();
  }

  function onSave() {
    clearPrompt();
    const state = getStoryState();
    const name = dom.nameInput.value.trim();
    if (state.beads.length === 0) return say("The map is empty — add a tile before saving.", "error");
    if (!name) return say(`Give the story a name (1–${NAME_MAX} characters).`, "error");
    if (name.length > NAME_MAX) return say(`A name can be at most ${NAME_MAX} characters.`, "error");
    return performSave(name, false);
  }

  function askDelete(name) {
    askPrompt(`Delete “${name}”?`, [
      {
        label: "Delete",
        run: () => {
          const result = deleteStory(name, storage);
          say(result.ok ? `Deleted “${name}”.` : result.error, result.ok ? "info" : "error");
          renderSaved();
        },
      },
      { label: "Keep" },
    ]);
  }

  /* ----- clear and undo (FR-C17) ----- */

  function onUndoExpiry() {
    undoTimerId = null;
    discardUndo();
    syncUndo();
  }

  function syncUndo() {
    const visible = canUndoClear();
    dom.undo.hidden = !visible;
    if (visible && undoTimerId === null) {
      dom.undoTimer.style.setProperty("--undo-ms", `${UNDO_MS}ms`);
      dom.undoTimer.setAttribute("data-undo-ms", String(UNDO_MS));
      undoTimerId = startTimer(onUndoExpiry, UNDO_MS);
    } else if (!visible && undoTimerId !== null) {
      stopTimer(undoTimerId);
      undoTimerId = null;
    }
  }

  /* ----- adding, pairing, splitting, linking ----- */

  const reportFailure = (result) => {
    if (!result.ok) say(result.error.message, "error");
    return result;
  };

  function focusedBeadUid() {
    const focused = canvasClosest(globalThis.document.activeElement, ".st-bead");
    return focused ? focused.getAttribute("data-bead-uid") : null;
  }

  const targetBeadUid = () => focusedBeadUid() ?? getActiveUid();

  function addSelectedTile() {
    if (!selectedElementId) return say("Select a tile first.", "error");
    return reportFailure(addBead(selectedElementId, { type: "empty" }));
  }

  function pairSelectedTile() {
    if (!selectedElementId) return say("Select a tile first.", "error");
    const uid = targetBeadUid();
    if (!uid) return say("Select a bead to pair the tile with.", "error");
    return reportFailure(pairBead(uid, selectedElementId));
  }

  function splitTargetBead() {
    const uid = targetBeadUid();
    if (!uid) return say("Select a bead to split.", "error");
    return reportFailure(splitBead(uid));
  }

  function startLink(uid) {
    linkFrom = uid;
    say(`Linking from step ${lastLayout.stepNumbers[uid]} — Tab to another bead, then Enter. Esc cancels.`);
    render();
  }

  function finishLink(toUid) {
    const from = linkFrom;
    linkFrom = null;
    const result = linkBeads(from, toUid);
    if (result.ok) say("Linked.");
    else say(result.error.message, "error");
    render();
  }

  function removeAndRefocus(uid) {
    const index = lastLayout.order.indexOf(uid);
    if (!reportFailure(removeBead(uid)).ok) return;
    const order = lastLayout.order;
    const next = order[Math.min(index, order.length - 1)];
    const node = next ? beadNodes.get(next) : null;
