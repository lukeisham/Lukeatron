<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Style — A Reference of Elements</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="header.css">
<link rel="stylesheet" href="list.css">
<link rel="stylesheet" href="labels.css">
<link rel="stylesheet" href="labeltable.css">
<link rel="stylesheet" href="compare.css">
<link rel="stylesheet" href="grid.css">
<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="print.css">
</head>
<body>
<header class="masthead">
  <h1 class="masthead-title">Style</h1>
  <p class="masthead-subrule">A Reference of Elements <span id="entry-count" class="masthead-count"></span></p>
  <div class="toolbar">
    <div class="search-row">
      <label class="search-field">
        <span class="visually-hidden">Search elements</span>
        <span class="search-glyph" aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Search elements…" autocomplete="off">
      </label>
      <label class="toolbar-check"><input id="fuzzy" type="checkbox"> Fuzzy match</label>
    </div>
    <div id="sort" class="sort-list" role="group" aria-label="Sort order"></div>
    <div class="options-row">
      <div class="menu">
        <button id="display-button" class="btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="display-panel">Display <span class="btn-caret" aria-hidden="true">▾</span></button>
        <div id="display-panel" class="menu-panel" role="group" aria-label="Display options" hidden>
          <label class="menu-item"><input id="show-definitions" type="checkbox" checked> Show definitions</label>
          <label class="menu-item" title="AI-written examples built to fit the definition."><input id="show-ai-examples" type="checkbox" checked> Show AI examples</label>
          <label class="menu-item" title="Real quotes, credited to who said them."><input id="show-quotes" type="checkbox" checked> Show quotes</label>
          <label class="menu-item"><input id="show-confidence" type="checkbox" checked> Show AI confidence</label>
          <label class="menu-item" title="On: an element lists its thumbnails under its examples. Off: they show only when the row is opened."><input id="show-images" type="checkbox" checked> Show images</label>
          <label class="menu-item" title="On: a single element's view lists where it is filed in Templates, Brainstorming, Research and Topical. Off by default."><input id="show-groups" type="checkbox"> Show Groups</label>
          <label class="menu-item" title="On: a single element's view lists the labels it is filed under. Off by default."><input id="show-labels" type="checkbox"> Show Labels</label>
          <label class="menu-item" title="On: add, edit, delete and drag labels and the elements under them. Off: read only; clicking and the options above still work."><input id="edit-mode" type="checkbox" checked> Edit mode</label>
          <label class="menu-item" title="On: a click on a label opens it (its sub-labels and elements show) or closes it. Off: every sub-label and element is listed."><input id="reveal" type="checkbox" checked> Indent</label>
        </div>
      </div>
      <label class="toolbar-check">Open on
        <select id="default-sort" class="toolbar-select">
          <option value="none">Search only</option>
          <option value="alphabetical">Alphabetical</option>
          <option value="templates">Templates</option>
          <option value="brainstorming">Brainstorming</option>
          <option value="research">Research</option>
          <option value="topical">Topical</option>
          <option value="labels">Labels</option>
          <option value="grid">Grid</option>
          <option value="index">Index</option>
          <option value="compare">Compare</option>
        </select>
      </label>
      <button id="print" class="btn" type="button">Print</button>
      <button id="copy" class="btn" type="button">Copy</button>
      <button id="compare" class="btn" type="button" aria-pressed="false">Compare</button>
      <a class="btn btn-link" href="about.html">About</a>
      <span id="copy-status" class="toolbar-status" role="status"></span>
    </div>
  </div>
  <p class="ornament" aria-hidden="true">── ❧ ──</p>
</header>
<main class="workspace">
  <div class="workspace-bar">
    <button id="home" class="home-link" type="button" hidden>← Home</button>
  </div>
  <div id="labels-bar" class="labels-bar" role="group" aria-label="Add labels and elements" hidden>
    <form id="label-form" class="labels-form" autocomplete="off">
      <label class="label-field"><span class="visually-hidden">New label name</span>
        <input id="label-name" type="text" maxlength="80" placeholder="New label…" required></label>
      <label class="label-field label-explanation"><span class="visually-hidden">What the label means</span>
        <input id="label-definition" type="text" maxlength="300" placeholder="What it means (optional)…"></label>
      <span class="picker parent-picker">
        <label class="label-field"><span class="visually-hidden">Add the label under</span>
          <input id="label-parent" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="label-parent-list" placeholder="At the top level — or find a parent…"></label>
        <ul id="label-parent-list" class="picker-list" role="listbox" hidden></ul>
      </span>
      <button class="btn" type="submit">Add label</button>
      <button class="btn" type="submit" data-link="true" title="Add the name as a link to a new, empty section at the end of the About page. A link has no explanation and holds no elements.">Add link</button>
    </form>
    <form id="label-entry-form" class="labels-form" autocomplete="off">
      <span class="picker">
        <label class="label-field"><span class="visually-hidden">Element to add</span>
          <input id="entry-pick" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="entry-pick-list" placeholder="Find a element…"></label>
        <ul id="entry-pick-list" class="picker-list" role="listbox" hidden></ul>
      </span>
      <label><span class="visually-hidden">Add the element to</span><select id="entry-label" class="toolbar-select"></select></label>
      <button class="btn" type="submit">Add element</button>
    </form>
    <span id="labels-status" class="toolbar-status" role="status"></span>
  </div>
  <div id="grid-bar" class="grid-bar" role="group" aria-label="Grid options" hidden>
    <span id="grid-roles" class="grid-roles"></span>
  </div>
  <div id="index-bar" class="index-bar" role="group" aria-label="Index options" hidden>
    <span id="index-orders" class="index-orders"></span>
    <button id="index-full" class="btn" type="button" aria-pressed="false" title="Show each whole quote, with a link to its element">Full display</button>
  </div>
  <div id="compare-bar" class="compare-bar" role="group" aria-label="Compare a element with its Counterpart" hidden>
    <label class="compare-field"><span class="visually-hidden">Element</span><select id="compare-pick" class="toolbar-select"></select></label>
    <button id="compare-prev" class="btn" type="button">◂ Prev</button>
    <button id="compare-next" class="btn" type="button">Next ▸</button>
    <span id="compare-count" class="toolbar-status" role="status"></span>
    <span class="compare-switches">
      <label class="toolbar-check"><input id="table-names" type="checkbox" checked> Names</label>
      <label class="toolbar-check"><input id="table-definitions" type="checkbox" checked> Definitions</label>
      <label class="toolbar-check"><input id="table-examples" type="checkbox" checked> Examples</label>
    </span>
  </div>
  <div id="list" class="list" aria-live="polite"></div>
</main>
<dialog id="table-dialog" class="table-dialog" aria-labelledby="table-dialog-title">
  <form id="table-form" class="table-form" autocomplete="off">
    <h2 id="table-dialog-title" class="table-dialog-title">Table</h2>
    <div class="table-controls">
      <label class="table-count">Columns <input id="table-cols" type="number" inputmode="numeric"></label>
      <label class="table-count">Rows <input id="table-rows" type="number" inputmode="numeric"></label>
      <label class="toolbar-check"><input id="table-col-heads" type="checkbox"> Column headings</label>
      <label class="toolbar-check"><input id="table-row-heads" type="checkbox"> Row headings</label>
    </div>
    <label class="table-caption-field">Caption (optional) <input id="table-caption" type="text"></label>
    <div class="table-grid-wrap"><table id="table-grid" class="table-grid"></table></div>
    <p class="table-hint">Headings are the first row and column, shown in bold. Paste from a spreadsheet to fill the grid. <code>*word*</code> makes italics and <code>_word_</code> makes bold.</p>
    <div class="table-actions">
      <button id="table-delete" class="btn" type="button" hidden>Delete table</button>
      <span id="table-status" class="toolbar-status" role="status"></span>
      <button id="table-cancel" class="btn" type="button">Cancel</button>
      <button class="btn" type="submit">Save</button>
    </div>
  </form>
</dialog>
<script type="module" src="main.js"></script>
</body>
</html>
