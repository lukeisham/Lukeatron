<h2 class="sr-only">Project urgency dashboard — active projects ranked from most to least urgent by nearest upcoming task date.</h2>
<style>
.bp{background:#B5D4F4;color:#0C447C}.bc{background:#CECBF6;color:#3C3489}.bt{background:#9FE1CB;color:#085041}.br{background:#C0DD97;color:#27500A}
@media(prefers-color-scheme:dark){.bp{background:#0C447C;color:#85B7EB}.bc{background:#3C3489;color:#CECBF6}.bt{background:#085041;color:#5DCAA5}.br{background:#27500A;color:#C0DD97}}
.pr{padding:8px 4px;transition:background .1s}
.pr:hover{background:var(--color-background-secondary)}
</style>

<div id="dbwrap" style="padding:.75rem 0;position:relative">
  <p style="font-size:11px;color:var(--color-text-tertiary);margin:0 0 1rem">Urgency gravity — nearest task date rises to the top. No-date sorted by state. Today: __TODAY_LABEL__.</p>

  <div style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:1.25rem;font-size:11px;color:var(--color-text-secondary);align-items:center">
    <span style="font-size:10px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.06em">Tasks</span>
    <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:#EF9F27;display:inline-block"></span>Open</span>
    <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:#378ADD;display:inline-block"></span>Doing</span>
    <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:#1D9E75;display:inline-block"></span>Done</span>
    <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:#E24B4A;display:inline-block"></span>Blocked</span>
    <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:#737373;display:inline-block"></span>Undefined</span>
    <span style="color:var(--color-border-secondary);margin:0 2px">|</span>
    <span style="font-size:10px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.06em">State</span>
    <span style="display:flex;align-items:center;gap:4px"><span style="width:7px;height:7px;border-radius:50%;background:#A32D2D;display:inline-block"></span>Urgent</span>
    <span style="display:flex;align-items:center;gap:4px"><span style="width:7px;height:7px;border-radius:50%;background:#BA7517;display:inline-block"></span>Your move</span>
    <span style="display:flex;align-items:center;gap:4px"><span style="width:7px;height:7px;border-radius:50%;background:#2563B0;display:inline-block"></span>Waiting</span>
    <span style="display:flex;align-items:center;gap:4px"><span style="width:7px;height:7px;border-radius:50%;background:#0F6E56;display:inline-block"></span>On track</span>
  </div>

  <div id="db"></div>
  <div id="tip" role="tooltip" style="position:absolute;left:0;top:0;z-index:50;display:none;max-width:300px;background:var(--color-background-primary);color:var(--color-text-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:6px 9px;font-size:12px;line-height:1.45;pointer-events:none"></div>
</div>

<script>
const TC={open:'#EF9F27',doing:'#378ADD',done:'#1D9E75',blocked:'#E24B4A',undefined:'#737373'};
const SL2={open:'Open',doing:'Doing',done:'Done',blocked:'Blocked',undefined:'Undefined (unassigned / no date)'};
const SC={ontrack:'#0F6E56',waiting:'#2563B0',yourmove:'#BA7517',urgent:'#A32D2D',undefined:'#737373',pending:'#B4B2A9',complete:'#1D9E75'};
const SL={ontrack:'On track',waiting:'Waiting',yourmove:'Your move',urgent:'Urgent',undefined:'Undefined',pending:'Pending first sweep',complete:'Complete'};
const BC={PP:'bp',CH:'bc',TE:'bt',PR:'br'};
const TODAY=new Date('__TODAY_ISO__');

// __SECTIONS__ is replaced per render by !Dashboard. One object per band; ps[] sorted by nd ascending.
// tasks: [{s,t}] — s=status token (open/doing/done/blocked), t=action text shown on square hover.
const SECTIONS=__SECTIONS__;

function daysUntil(d){if(!d)return null;return Math.ceil((new Date(d)-TODAY)/86400000);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

function renderDots(tasks,state){
  if(state==='complete') return '<span style="font-size:11px;color:#1D9E75;font-weight:500">all done</span>';
  if(!tasks) return '<span style="font-size:11px;color:var(--color-text-tertiary)">&mdash;</span>';
  return tasks.map(t=>{
    const tip=esc(SL2[t.s]+' · '+t.t);
    return `<span data-tip="${tip}" style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${TC[t.s]};cursor:default" title="${tip}"></span>`;
  }).join('');
}

function renderDate(p){
  if(!p.nl) return '<span style="font-size:12px;color:var(--color-text-tertiary)">&mdash;</span>';
  const d=daysUntil(p.nd);
  const lbl=d===1?'Tomorrow':d===0?'Today':p.nl;
  const col=d<=1?'#E24B4A':d<=7?'#BA7517':'var(--color-text-primary)';
  const fw=d<=7?'500':'400';
  return `<span style="font-size:12px;font-weight:${fw};color:${col};white-space:nowrap">${lbl}</span>`;
}

let html='';
SECTIONS.forEach(sec=>{
  html+=`<div style="display:flex;align-items:center;gap:8px;margin:14px 0 2px">
    <span style="font-size:10px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap">${sec.label}</span>
    <span style="flex:1;height:0.5px;background:var(--color-border-tertiary)"></span>
  </div>`;
  sec.ps.forEach((p,i)=>{
    const last=i===sec.ps.length-1;
    const dim=(p.state==='complete'||p.state==='pending')?'opacity:.55;':'';
    html+=`<div class="pr" style="display:flex;align-items:center;gap:10px;${dim}${last?'':'border-bottom:0.5px solid var(--color-border-tertiary)'}">
      <span class="${BC[p.ctx]}" style="font-size:10px;font-weight:500;border-radius:4px;padding:2px 7px;flex-shrink:0">${p.ctx}</span>
      <span data-tip="${esc(p.title)}" style="width:240px;flex-shrink:0;font-size:13.5px;color:var(--color-text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:default">${p.title}</span>
      <span style="display:flex;gap:5px;align-items:center;flex:1;flex-wrap:wrap;min-width:0">${renderDots(p.tasks,p.state)}</span>
      <span data-tip="${esc(SL[p.state])}" style="width:7px;height:7px;border-radius:50%;background:${SC[p.state]};flex-shrink:0;cursor:default" title="${SL[p.state]}"></span>
      <span style="min-width:68px;text-align:right;flex-shrink:0">${renderDate(p)}</span>
    </div>`;
  });
});
document.getElementById('db').innerHTML=html;

const _tip=document.getElementById('tip'), _wrap=document.getElementById('dbwrap'), _db=document.getElementById('db');
_db.addEventListener('mousemove',e=>{
  const el=e.target.closest('[data-tip]');
  if(!el){_tip.style.display='none';return;}
  _tip.textContent=el.getAttribute('data-tip');
  _tip.style.display='block';
  const r=_wrap.getBoundingClientRect();
  let x=e.clientX-r.left+14, y=e.clientY-r.top+16;
  const maxX=_wrap.clientWidth-_tip.offsetWidth-6;
  if(x>maxX)x=Math.max(6,maxX);
  if(y+_tip.offsetHeight>_wrap.clientHeight)y=e.clientY-r.top-_tip.offsetHeight-12;
  _tip.style.left=x+'px'; _tip.style.top=y+'px';
});
_db.addEventListener('mouseleave',()=>{_tip.style.display='none';});
</script>
