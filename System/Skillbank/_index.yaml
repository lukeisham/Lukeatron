n WebSearch/WebFetch, batched in ≤250-word passes for low token cost), while the browser widget remains a secondary tagging/viewer surface and is not rebuilt in this pass. Reuses the spec's existing five-category taxonomy, 17-row whitelist, and found-source double-check verbatim rather than inventing new rules. Sandbox-tested live (System/Sandbox/factcheck-skill-test.md) against a worked paragraph covering a direct quote, a paraphrase, a common-knowledge fact, a non-checkable opinion, and a deliberately unfindable claim — including a real whitelist-source-403 case proving the fallback-and-double-check path works rather than citing a dead link.
skills:
  - name: "!GenerateSupportiveContent"
    path: "System/Skillbank/GeneralPurposeSkills/!GenerateSupportiveContent/skill.md"
    domain: "GeneralPurpose"
    intent: "Generate content that serves an EXISTING target (repo, file, widget, report, email, project, wiki page, sermon, argument, web artefact) — matching that target's own tone and style, and emphasising / supporting / illustrating / defending what it already claims. Never freestanding, never introduces a new claim. Three deterministic gates: LOCATE (kind, path, audience, mode — ask, never guess), DISCOVER (adjacent assets, Skillbank hits, !Tone source, Long-Term stores), VERIFY (every quote, figure, citation, name, code signature and claim-about-the-target checked against a primary source, plus a 13-row slop scan). Strict abstention rule: unconfirmed or under-contexted means NO content at all, delivered as an abstention ledger — nothing beats slop, and the rule is not overridable."
    triggers: ["generate supportive content", "write something to back this up", "make the case for this", "add supporting content to", "illustrate this", "defend this", "write a companion piece for", "expand on this in its own voice", "support this argument", "!GenerateSupportiveContent"]
  - name: "!Magpie"
    path: "System/Skillbank/GeneralPurposeSkills/!Magpie/skill.md"
    domain: "GeneralPurpose"
    intent: "Searching and surveying top-ranked agent skills on GitHub, then observing patterns and/or extracting ideas, code, nomenclature or whole skills. Three modes (SURVEY / HUNT / LIFT) over a deterministic ranked list of ten repos in reference/top-repos.md, with an adjacency map from question-type to repo. Read-only outward, Sandbox-first inward — nothing lands in the Skillbank without !Checkpoint."
    triggers: ["magpie", "survey the skill repos", "what skills are popular", "what's out there", "how do others do this skill", "find me a skill for", "steal a skill", "scan github for skills", "is there a skill for this already"]
  - name: "!Brainstorm"
    path: "System/Skillbank/GeneralPurposeSkills/!Brainstorm/skill.md"
    domain: "GeneralPurpose"
    intent: "The FIRST station in the thinking pathway — the divergent half, before !grilling narrows the field. A SESSION, not a single pass: reacts to a theme, starting idea or starting question by running a named METHOD from a fixed 13-row deck (free association, the opposite, problem->solution, common/outdated/fringe/trending ideas, suggest a Reddit post, suggest a non-paywalled article, argue with the AI, analogy transfer, constraint injection, pre-mortem), testing each on yield/spread/traction, and chaining or swapping. STEP 0 re-reads every turn and PIVOTS the method when Luke's ask changes shape (REFRAME / CONSTRAINT / STEER / GROUND / CONTINUE / READY) — the turn outranks the chain. Produces NO deliverable until Luke signals READY, then outputs a list, report, recommendation or next action. Never narrows; hands the field to !grilling."
    triggers: ["brainstorm", "let's think about", "open this up", "what are the options", "give me some angles on", "ideas for", "what am I missing", "think out loud with me", "what else could this be", "I don't know where to start with"]
  - name: "!write-a-skill"
    path: "System/Skillbank/GeneralPurposeSkills/!write-a-skill/skill.md"
    domain: "GeneralPurpose"
    intent: "Create a new agent skill with proper structure, progressive disclosure, and bundled resources — gathers requirements, drafts SKILL.md (+ reference files/scripts as needed), reviews with the user. Complements !Suggest (which outlines a reusable skill from repetitive work) by doing the actual authoring."
    triggers: ["create a skill", "write a new skill", "build a new skill", "author a skill", "skill structure"]
  - name: "!teach"
    path: "System/Skillbank/GeneralPurposeSkills/!teach/skill.md"
    domain: "GeneralPurpose"
    intent: "Stateful, multi-session teaching workspace for the user to learn a new skill or concept — tracks MISSION.md, resources, learning-records, glossary, and produces short self-contained HTML lessons tied to the mission and the user's zone of proximal development, built from reusable components under ./assets/."
    triggers: ["teach me", "teach me about", "I want to learn", "help me learn", "teach about"]
  - name: "!grilling"
