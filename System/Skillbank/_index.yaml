Medium/High by perceived complexity and lightly reworded on input, queryable at any time, in any phase. Its conflict scan (duplicate/overlap/conflict against the live PRD/specs) runs at Phase 1 read-back, Phase 2 propagate-change, and Phase 3's pre-freeze completeness check (new guardrail G-5); it stops for good once Phase 4 STEP 3 retires the PRD — not a gap, the expected end state, since there is nothing left to check against. The wishlist itself is explicitly excluded from that same retirement step and is carried forward into the permanent home as a fourth sibling beside _template/, _test/, refactor-registry.md, staying live through the refactor loop (accepted changes get marked built). 2026-09-02 — !Magpie added under GeneralPurposeSkills/ — surveys the top-ranked agent-skill repos on GitHub and brings back ideas/formats/names/code/whole skills; its deterministic half is reference/top-repos.md (the ranked ten as at 2026-09-02, plus an adjacency map from question-type to repo). Read-only outward, Sandbox-first inward; hands off to !write-a-skill / !Suggest, and promotion into the Skillbank is a !Checkpoint call. 2026-09-02 — !RefactoringUI, !UXHeuristics, !DesignEverydayThings, and !Microinteractions added under PersonalResearch/, at Luke's explicit instruction — four UI/UX skills lifted via !Magpie from wondelai/skills (MIT license) and re-cut to Lukeatron's ⚡TRIGGER/🛠️LOGIC/✅OUTPUT format. Each carries the source's scored diagnostic pattern (a fixed checklist, `score = round(satisfied/N×10)`, banded) rather than open-ended review prose. Cross-reference each other (visual polish / usability audit / affordance theory / interaction-detail polish) and are referenced as an advisory consult set from !AppDevelopment. 2026-09-02 — !AppDevelopment Phase 4 (phase4-refactor.md, v1.1.0) gained a Refactor Health Check — a scored eight-question pass (score = round(satisfied/8×10)) run once per refactor-board row immediately before the port in STEP 7, gating the port itself (8/8 closes the row, 6-7 ports with the gap named, <=5 does not port). Its score is recorded as a new Health column on the existing refactor board in templates/refactor-registry.md — no new template file, per the skill's own "if two documents say the same thing, one of them is wrong." Phases 1-3 untouched (their compliance-shaped checklists are already the right tool for documents, not running code). Applied at Luke's explicit approval of the proposal !Magpie's background exploration wrote to System/Sandbox/appdev-diagnostic-checklist-proposal.md, which found the concrete gap this closes: CurriculumPreparation's R-10 board row shipped dead code (functions built, tested, and never wired to the live UI) discovered only by incidental investigation, not by any existing check. CurriculumPreparation's own refactor-registry.md gained the Health column too — R-1 through R-10 marked `—` (not retroactively scored, they predate the check), R-11 onward scored. 2026-09-04 — !Brainstorm added under GeneralPurposeSkills/ (v1.0.0) — the divergent front end of the thinking pathway, sitting BEFORE !grilling: !Brainstorm widens the field, !grilling narrows it, !CreatePlan/!TechSpec* shape the survivor. Lifted via !Magpie (HUNT mode) from obra/superpowers skills/brainstorming/SKILL.md — the hard gate ("never implement before design approval") and the three-path Spark/Spread/Survey sizing with "when in doubt between two paths, take the heavier one" — and re-cut to Lukeatron's ⚡TRIGGER/🛠️LOGIC/✅OUTPUT format. Three parts are Lukeatron's own and are the deterministic half: (1) the 13-row METHOD DECK, each row with a "reach for it when" column, of which rows 4–9 reach outside the system; a method is never run unnamed. (2) The METHOD TEST — after each pass the METHOD (not the ideas) is scored on yield/spread/traction, and any failure forces a named, out-loud SWAP to a different row. (3) The READY GATE — the skill produces no deliverable of any kind until Luke signals ready; a method running dry, the field feeling complete, or Luke going quiet do NOT count, and the gate fails closed by asking. Proved on a live run the same day (the project-dashboard session, output at System/Sandbox/brainstorm-project-dashboard-2026-09-04.md — 42 options across four methods). That run exposed three gaps, closed in v0.3.0 before promotion: STEP 0 READ THE TURN (a six-signal table — REFRAME / CONSTRAINT / STEER / GROUND / CONTINUE / READY — that re-types the input every turn and PIVOTS the method when the ask changes shape, under the priority rule "the turn outranks the chain"; distinct from the internal test-failure SWAP); the outward-method prompt (if no row 4–9 method has run by the second check-in, one must be OFFERED by name and the field declared first-principles-and-analogy-only); and pivot/outward reporting in the output contract. Registered at Luke's explicit instruction — the v0.2.0 body had its proving run, the v0.3.0 additions have not, so this overrides !Checkpoint's Gate C hold in the same manner as !GenerateContent (2026-08-13); recorded, not silent. 2026-09-07 — !Magpie's reference/top-repos.md rebuilt from ten entries to eleven at Luke's explicit rejection of the 2026-09-02 list as "a useful starter mix, not the best list." Removed: hoodini/ai-agents-skills (too small/uneven), clean-code-agents/agents-md (404), b1rdmania/claude-plain-english-skill (too small for a top-10 slot, kept as a footnote only), kicad-ai/kicad-agent-skills (404, no maintained hardware repo replaces it yet). Corrected: wondel-ai/wondel-agent-skills → wondelai/skills; n8n-io/n8n-agent-skills → n8n-io/skills. Added: obra/superpowers, anthropics/skills, addyosmani/agent-skills (Core tier); agentskills/agentskills (the open spec, read as context not a raid target), VoltAgent/awesome-agent-skills (discovery index) (Meta tier). List now carries explicit tiers (Core / Meta / Stable overlay / Specialist-domain-conditional), a "Removed since" section with reasons, and an "Optional domain add