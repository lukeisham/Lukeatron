  - name: "!AppDevelopment"
    path: "System/Skillbank/PersonalResearch/!AppDevelopment/skill.md"
    domain: "PersonalResearch"
    intent: "Four-phase lifecycle taking an app (standalone web app) or widget (runs inside a host app or the local computer) from idea to a permanently housed template. Phase 1 !AppPRD interviews Luke and writes a short plain-English PRD plus a development registry into a new System/Sandbox/<name>/ folder. Phase 2 !AppSpecs derives a modular spec set from the PRD under the Vibe Coding Rules — always including exactly one documentation spec scoped narrowly to cross-widget/cross-app behaviour, key architectural and functional decisions, and a lightweight ASCII navigation map — builds mockups for feedback, and propagates any PRD rewrite back through the specs by marking them stale in the registry. Phase 3 !AppBuildPrep is a one-way door: refresh the registry, delete the mockups only once the specs are verified to carry everything they showed, and write build.md, a copy-paste prompt standing up an Opus boss agent with Haiku subagents for bulk grunt work and Sonnet subagents for specialised building and reviewing. Phase 4 !AppRefactor moves the build to a permanent home as _template/ — a raw, current-version instance carrying only the working code plus one short README.md folded down from the documentation spec (decisions and their reasons, cross-boundary behaviour, navigation map, granted rule exceptions); no spec survives Phase 4, since specs are rebuild instructions and the built thing describes itself — plus a TEST-labelled _test/ full of obviously fake data plus a refactor registry, all three permanent siblings, deleting the old design documents only after the new location is verified file-by-file; it runs cold on apps or widgets this skill set never built. Registry-driven throughout so an interrupted or context-refreshed agent resumes from disk."
    triggers: ["build an app", "build a widget", "make a new widget", "start a new app", "new app idea", "write a PRD", "spec out this app", "app development", "resume the app build", "where is the build up to", "refactor the widget", "make this a template", "give this a permanent home", "set up a test copy", "!AppPRD", "!AppSpecs", "!AppBuildPrep", "!AppRefactor"]
