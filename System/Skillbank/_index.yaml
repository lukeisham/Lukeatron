  - name: "!AppDevelopment"
    path: "System/Skillbank/PersonalResearch/!AppDevelopment/skill.md"
    domain: "PersonalResearch"
    intent: "Four-phase lifecycle taking an app (standalone web app) or widget (runs inside a host app or the local computer) from idea to a permanently housed template. Phase 1 !AppPRD interviews Luke and writes a short plain-English PRD plus a development registry into a new System/Sandbox/<name>/ folder. Phase 2 !AppSpecs derives a modular spec set from the PRD under the Vibe Coding Rules — always including exactly one documentation spec scoped narrowly to cross-widget/cross-app behaviour, key architectural and functional decisions, and a lightweight ASCII navigation map — builds mockups for feedback, and propagates any PRD rewrite back through the specs by marking them stale in the registry. Phase 3 !AppBuildPrep is a one-way door: refresh the registry, delete the mockups only once the specs are verified to carry everything they showed, and write build.md, a copy-paste prompt standing up an Opus boss agent with Haiku subagents for bulk grunt work and Sonnet subagents for specialised building and reviewing. Phase 4 !AppRefactor moves the build to a permanent home as _template/ — a raw, current-version instance carrying only the working code plus one short README.md folded down from the documentation spec (decisions and their reasons, cross-boundary behaviour, navigation map, granted rule exceptions); no spec survives Phase 4, since specs are rebuild instructions and the built thing describes itself — plus a TEST-labelled _test/ full of obviously fake data plus a refactor registry, all three permanent siblings, deleting the old design documents only after the new location is verified file-by-file; it runs cold on apps or widgets this skill set never built. Registry-driven throughout so an interrupted or context-refreshed agent resumes from disk. A cross-cutting !AppWishlist capability (wishlist.md) maintains a per-project, per-app/widget running backlog of future ideas — ranked Low/Medium/High by perceived complexity, lightly reworded on the way in, queryable at any time. It cross-checks itself against the live PRD/specs for duplicates, overlap, and conflicts at three points (Phase 1 read-back, Phase 2 propagate-change, Phase 3 pre-freeze completeness check); that scan stops once Phase 4 retires the PRD, but the wishlist itself is carried forward into the permanent home as a fourth sibling and keeps running through the refactor loop. 2026-09-02 — !teach re-synced against upstream (github.com/mattpocock/skills, skills/productivity/teach/), which had gained an `## Assets` section (reusable HTML components under ./assets/, e.g. a shared stylesheet) since the original July import; skill.md updated to match (Teaching Workspace bullet + new section), MISSION/RESOURCES/LEARNING-RECORD/GLOSSARY-FORMAT.md left as-is since they were already ahead stylistically. Upstream's agents/openai.yaml (OpenAI-specific interface config) has no Claude Code equivalent and was not imported. Same day — !grilling re-synced against upstream (skills/productivity/grilling/SKILL.md), which had grown a \"design tree / frontier / rounds\" mechanism since the original import: batch the whole open frontier per round (numbered, formatted Q&A blocks, one recommended answer each) instead of asking one question at a time, and dispatch sub-agents to find environment facts rather than asking the user. skills/productivity/grill-me/ was checked too — still just a one-line stub calling \"grilling\", confirming the existing decision to keep it folded into !grilling rather than re-adding as its own skill. Same day — !ProseDetox and !SimpleEnglish added under GeneralPurposeSkills/, imported from github.com/b1rdmania/claude-plain-english-skill (skills/plain-english/ and skills/simple-english/). Upstream's \"plain-english\" was renamed to !ProseDetox — Luke confirmed the rename (via AskUserQuestion) to avoid colliding with Lukeatron's own always-on core !PlainEnglish skill (.Claude/skills/!PlainEnglish/, form-governance for internal writing — a different job from this skill's AI-tic/prose detox). \"simple-english\" (ASD-STE100 technical-writing rules) had no naming conflict and was kept as !SimpleEnglish. Each skill's cross-reference to the other was updated to the new Skillbank names; each skill's own reference/ files were copied in unmodified."
    triggers: ["build an app", "build a widget", "make a new widget", "start a new app", "new app idea", "write a PRD", "spec out this app", "app development", "resume the app build", "where is the build up to", "refactor the app", "refactor the widget", "make this a template", "give this a permanent home", "set up a test copy", "add to the wishlist", "what's on the wishlist", "note this idea for", "rank the wishlist", "!AppPRD", "!AppSpecs", "!AppBuildPrep", "!AppRefactor", "!AppWishlist"]
