  - name: "!TheJesusWebsite-Wikipedia"
    path: "System/Skillbank/Church/!TheJesusWebsite-Wikipedia/skill.md"
    domain: "Church"
    intent: "Maintain the ranked 250-article Wikipedia list for The Jesus Website (Memory/Long-Term/The-Jesus-Website/Wikipedia/) — tops up the list toward the ceiling by crawling/selecting/scoring only what's missing when short, or just checks the existing files for internal consistency when the ceiling is already met. Also permanently excludes named articles on request (rank_engine.py exclude), removing them from the live data, not just the denylist. Keeps Wikipedia Articles.csv, Wikipedia Articles - Scoring Detail.csv, and the plain-text end point wiki-bulk-paste.txt always in sync. Follows the pool/selection/ranking criteria documented in that folder's Wikipedia Articles - Reference.md. Sibling of !TheJesusWebsite-Challenges, which owns the separate Popular/Academic Challenges trackers in the same parent folder."
