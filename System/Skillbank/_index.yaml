    path: "System/Skillbank/GeneralPurposeSkills/!Comprehension/skill.md"
    domain: "GeneralPurpose"
    intent: "Measure whether a finished artefact — prose AND layout — lets a reader recover the meaning it was written to carry. Meaning is a relation between text and reader, not a property of text, so the skill never inspects the writing: it pre-registers what the reader must end up holding and able to DO, hands the artefact and nothing else to N blind cold readers (clean-context subagents, no brief, no spec, no sight of each other), and diffs what comes back. Two SURFACES measured together and failing independently — PROSE (what the sentences assert) and FORMAT (what the layout silently claims: nesting = part-of, order = prerequisite, weight = importance, adjacency = belongs-with, repeated form = same-kind-of-thing, nested boxes = containment; full device-to-claim table in reference/format-propositions.md). A free mechanical pass runs first — unresolved referents, forward dependencies, orphan devices, device collisions, unmarked claims — then the cold reads, then a variance pass across readers, because disagreement is ambiguity however well any single read scored. Emits typed LOCATED defects and PASS/REPAIR/REJECT, never a score: a number becomes a target. Readability formulas banned outright — they measure word and sentence length, which undefined jargon passes easily. Fails closed: with no intent source independent of the artefact it runs REDUCED, reporting ambiguity and variance only and never PASS, because grading a text against itself always passes; and if no clean-context reader can be had it STOPS rather than let the author grade their own writing. Sibling of !ConceptFidelity (the clear/accurate cross-tab needs both); called by !GrammarFrame STEP 7B as criterion C32."
    triggers: ["can a reader follow this", "is this comprehensible", "comprehension check", "run a cold read", "does this actually communicate", "will they get it", "test this on a fresh reader", "check the layout reads right", "!Comprehension"]
  - name: "!ConceptFidelity"
    path: "System/Skillbank/GeneralPurposeSkills/!ConceptFidelity/skill.md"
    domain: "GeneralPurpose"
    intent: "Measure whether an artefact relays a CONCEPT accurately — the concept, not the wording. Paraphrase-invariant by construction: never compares strings, but decomposes ground and candidate into atomic claims (subject/relation/object/qualifier) and matches them by meaning, then runs BIDIRECTIONAL entailment — ground-to-candidate catches omission, candidate-to-ground catches fabrication, both mandatory because running only the first proves nothing was dropped and says nothing about what was invented. Four modes give the rubric instead of one blurry number: EXTENSION (the right set of cases, scored on boundary cases separately since the boundary IS the concept), INTENSION (defining features, with necessary told apart from incidental — the classic failure is a description true of every example given that names an accidental feature as essential), RELATION (ruling out the nearest confusable neighbour, where most close-but-wrong accounts die), INFERENTIAL ROLE (licensing what follows and blocking what must not). Sharpest instrument is the DISCRIMINATIVE TEST — a blind reader sees only the description and must pick it out of four near-misses (true concept, nearest neighbour, common misconception, over-general version), and WHICH wrong one they pick names the drift. An APPLICATION TEST then has them classify novel cases. Covers formatting too: nesting and parallel form make TAXONOMY claims no prose review sees, and a METAPHOR LANE tests which of a metaphor's own entailments the reader wrongly imports. Requires a GROUND (source text, canonical definition, or author's spec); with none it runs COHERENCE-ONLY and never emits an accuracy verdict, failing closed the way !FactCheck does. Measures transmission, never truth — a wrong ground passes every test, and that is !FactCheck's axis. Sibling of !Comprehension; called by !GrammarFrame STEP 7B as criterion C33."
    triggers: ["is this concept right", "does this describe it accurately", "concept check", "fidelity check", "is the idea intact", "did the meaning survive the rewrite", "does the metaphor distort this", "check this against the source", "!ConceptFidelity"]
  - name: "!GrammarFrame"
    path: "System/Skillbank/Teaching/!GrammarFrame/skill.md"
    domain: "Teaching"
    intent: "Turn English-grammar content Luke pastes into Memory/Long-Term/Grammar/Original_Content.md into two offline, self-contained HTML guides sharing ONE heading skeleton — Technical_Outline.html (authoritative on fact, !SimpleEnglish) and Theatre.html (Luke's own theatre metaphor, extracted from his paste and extended, never replaced) — plus grammar-content.json, the sidecar the Grammar app consumes, carrying both guides' prose paired so the app's Theatre/Technical toggle renders either view from one file. v2.0.0 restructured the skill around a single canonical CRITERIA set (63 criteria in five groups: A contracts, B governance, C content, D conventions, E decision tests), each asked forward while generating ('how best can this fulfil it?') and backward while measuring ('does this fulfil it?'), so the standard that shapes the work is the same standard that rules on it; each carries three properties — mechanical/judgement, autonomous/gated, form free/FIXED. Nothing restates a criterion: the VERB, STEP 9, the error paths and OUTPUT reference ids only, which is what stops two copies drifting. Distinctive: the TWO LANES rule (verifying quotes and fact-checking are autonomous and never ask; adding a heading, correcting Luke's grammar, restructuring or any significant addition are gated and never done alone, close calls gated, all surfaced at one hard sign-off gate that fails closed); DIAGNOSTICS ARE THE SPINE (binary, single-test, engine-answerable against a named span, serving both the app's fuzzy engine and Luke's eye, written twice through a discrimination test before shipping, carried word-for-word identical into all three outputs — a heading with no diagnostic is a failed heading); and reference/meaning-first.md, the governing frame — grammar is the shape meaning takes when it has to come out one word at a time, so no rule is rendered as arbitrary convention. Research is a CLOSED four-source set (eltconcourse, British Council, perfect-english-grammar, Purdue OWL) supplying the what; the frame supplies the why and outranks all four on reasoning. Quotes verified and attributed inline, never formally cited (deliberate exception to the house MLA convention). Original_Content.md is permanent and ever-growing — each run researches and gates only what is new or changed; Rejected_Proposals.table.md remembers every declined item so none is silently re-attempted. 2026-09-18 — v1.13.0's 'Theatre.html is never an abridgement' rule was traced to its predecessor (Framework_Instructions.md v0.4.0, which specified Theatre.html as the LIGHTER file; archived 2026-09-18 to Archive/Grammar-Framework_Instructions-2026-09-18/) and found to be an unmeasurable patch restated four times over surviving v0.4.0 language it contradicted. Luke ruled: Theatre.html MAY go lighter on technical granularity and NEVER on the metaphor. Replaced by C29 METAPHOR COVERAGE (the metaphor reaches every heading; a heading it cannot honestly reach is a flagged gap, never a lightly-dressed one), C30 METAPHOR COHERENCE (one concept dressed the same way throughout — new, previously untested), C31 DEPTH ASYMMETRY, and C22 narrowed so the technical file's authority covers FACT and nothing else. v2.2.0 named the pattern behind E1-E3/D9 as a standing principle — 🎛️ FORM FOLLOWS CONCEPT — every formatting decision (sections, sub-subsections, RULE vs NOTE, table vs paragraph, diagram count, cross-references) answers to what the concept itself needs, never a uniform template — and closed two gaps it exposed: E4 DIAGRAM MULTIPLICITY TEST (a heading earns more than one box diagram only when a single diagram cannot show every grouping claim it makes, never for symmetry) and E5 CROSS-REFERENCE TEST + new criterion D10 (a heading earns a hyperlink to another it genuinely depends on, distinct from D2's fixed glossary chain and C5's fixed SPLIT-section pointer; most headings have none). reference/schema.md bumped 1.5 -> 1.6: examples[].groups is now an array (one entry per E4 diagram) and headings gained cross_references[]."
    triggers: ["run the grammar framework", "process this grammar content", "regenerate the theatre guide", "regenerate the technical outline", "build the grammar guide", "grammar guide", "theatre metaphor grammar", "!GrammarFrame"]
  - name: "!AppDevelopment"
    path: "System/Skillbank/PersonalResearch/!AppDevelopment/skill.md"
    domain: "PersonalResearch"
    intent: "Four-phase lifecycle taking an app (standalone web app) or widget (runs inside a host app or the local computer) from idea to a permanently housed template. Phase 1 !AppPRD interviews Luke and writes a short plain-English PRD plus a development registry into a new System/Sandbox/<name>/ folder. Phase 2 !AppSpecs derives a modular spec set from the PRD under the Vibe Coding Rules — always including exactly one documentation spec scoped narrowly to cross-widget/cross-app behaviour, key architectural and functional decisions, and a lightweight ASCII navigation map — builds mockups for feedback, and propagates any PRD rewrite back through the specs by marking them stale in the registry. Phase 3 !AppBuildPrep is a one-way door: refresh the registry, delete the mockups only once the specs are verified to carry everything they showed, and write build.md, a copy-paste prompt standing up an Opus boss agent with Haiku subagents for bulk grunt work and Sonnet subagents for specialised building and reviewing. Phase 4 !AppRefactor moves the build to a permanent home as _template/ — a raw, current-version instance carrying only the working code plus one short README.md folded down from the documentation spec (decisions and their reasons, cross-boundary behaviour, navigation map, granted rule exceptions), plus, for an app, a StyleGuide.md sibling (the visual contract — palettes, type, spacing, motion, layout scope by file, read off the app's real tokens/CSS, never redrafted from memory) that README's navigation map always points to; no spec survives Phase 4, since specs are rebuild instructions and the built thing describes itself — plus a TEST-labelled _test/ full of obviously fake data plus a refactor registry, all three permanent siblings, deleting the old design documents only after the new location is verified file-by-file; it runs cold on apps or widgets this skill set never built, and StyleGuide.md is still written on a cold entry even when no build work has happened yet. Registry-driven throughout so an interrupted or context-refreshed agent resumes from disk. A cross-cutting !AppWishlist capability (wishlist.md) maintains a per-project, per-app/widget running backlog of future ideas — ranked Low/Medium/High by perceived complexity, lightly reworded on the way in, queryable at any time. It cross-checks itself against the live PRD/specs for duplicates, overlap, and conflicts at three points (Phase 1 read-back, Phase 2 propagate-change, Phase 3 pre-freeze completeness check); that scan stops once Phase 4 retires the PRD, but the wishlist itself is carried forward into the permanent home as a fourth sibling and keeps running through the refactor loop. 2026-09-02 — !teach re-synced against upstream (github.com/mattpocock/skills, skills/productivity/teach/), which had gained an `## Assets` section (reusable HTML components under ./assets/, e.g. a shared stylesheet) since the original July import; skill.md updated to match (Teaching Workspace bullet + new section), MISSION/RESOURCES/LEARNING-RECORD/GLOSSARY-FORMAT.md left as-is since they were already ahead stylistically. Upstream's agents/openai.yaml (OpenAI-specific interface config) has no Claude Code equivalent and was not imported. Same day — !grilling re-synced against upstream (skills/productivity/grilling/SKILL.md), which had grown a \"design tree / frontier / rounds\" mechanism since the original import: batch the whole open frontier per round (numbered, formatted Q&A blocks, one recommended answer each) instead of asking one question at a time, and dispatch sub-agents to find environment facts rather than asking the user. skills/productivity/grill-me/ was checked too — still just a one-line stub calling \"grilling\", confirming the existing decision to keep it folded into !grilling rather than re-adding as its own skill. Same day — !ProseDetox and !SimpleEnglish added under GeneralPurposeSkills/, imported from github.com/b1rdmania/claude-plain-english-skill (skills/plain-english/ and skills/simple-english/). Upstream's \"plain-english\" was renamed to !ProseDetox — Luke confirmed the rename (via AskUserQuestion) to avoid colliding with Lukeatron's own always-on core !PlainEnglish skill (.Claude/skills/!PlainEnglish/, form-governance for internal writing — a different job from this skill's AI-tic/prose detox). \"simple-english\" (ASD-STE100 technical-writing rules) had no naming conflict and was kept as !SimpleEnglish. Each skill's cross-reference to the other was updated to the new Skillbank names; each skill's own reference/ files were copied in unmodified."
    triggers: ["build an app", "build a widget", "make a new widget", "start a new app", "new app idea", "write a PRD", "spec out this app", "app development", "resume the app build", "where is the build up to", "refactor the app", "refactor the widget", "make this a template", "give this a permanent home", "set up a test copy", "add to the wishlist", "what's on the wishlist", "note this idea for", "rank the wishlist", "!AppPRD", "!AppSpecs", "!AppBuildPrep", "!AppRefactor", "!AppWishlist"]
