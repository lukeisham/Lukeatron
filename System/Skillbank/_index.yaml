tre sides. Removes the now-obsolete "the metaphor never enters JSON" rule from every place it appeared (schema.md's old field-rule row, skill.md STEP 5/8, and the STYLE GUIDE Rule row) — superseded by the pairing. Same day, v1.8.0 — two further changes, both at Luke's explicit instruction, retiring Form/Function/Meaning-Basis as flat heading-level fields entirely. (1) MEANING now has two kept-apart jobs (new "The standing epigraph" section in reference/meaning-first.md, and skill.md's new "🌱 MEANING — two aspects" section): a standing PRINCIPLE ("Grammar allows the communication of meaning...") rendered VERBATIM exactly once near the top of each guide (never per heading), and each rule's own specific why as sentence A2 inside its DEFINITION — a rule's A2 that only restates the PRINCIPLE has not done its own work and must be rewritten (new STEP 9 check + Error Path catch). The Definition's part order changes from three parts (A/B/C) to four: A1 (the rule itself, stated in full — what the old terse-only key-call-out under-specified), A2 (this rule's own why), B (context, now ONE sentence, larger-scope first then immediate — reversed from v1.6's immediate-first order), C (consistent-or-exception, unchanged). (2) Form and Function are no longer fixed prose fields — they are an ORGANISING LAYER, decided per heading by a new fixed, autonomous FORM/FUNCTION TEST (new "🏛️ FORM & FUNCTION" section): two yes/no questions (does the topic have a separable form at all; does knowing the form fully determine the function) yield omitted (no sub-heading — rules sit directly under the heading), combined (one sub-heading, "Form & Function" — e.g. Adjectives, where the two coincide), or split (two sub-headings, "Form" and "Function", each with its own rule(s)/definition(s)/key-call-out(s)/diagnostic(s) — e.g. Prepositions). A split section's Definition names the other section in its own B sentence, checked at STEP 9 and caught in the Error Path if missed. schema.md bumped to "1.4": headings gained `layer` and `sections[]` (replacing flat `form`/`function`/`meaning_basis`/`rules`/`diagnostics`), and the file root gained `meaning_principle` (paired technical/theatre, written once). skill.md STEP 4/5/6/7/8/9, the TWO LANES table, STYLE GUIDE, OUTPUT section and Error Path updated throughout to match; version 1.8.0. Same day, v1.9.0 — quality feedback from a live mockup review (System/Sandbox equivalent — the "GrammarFrame Rule Block Mockup" canvas), comparing Adjectives (good) against Prepositions (flawed), converted into three standing rules. (1) KEY CALL-OUTS must be CONCRETE and APPLICABLE — the rule's own content (a pattern/order/sequence/test usable directly against a real phrase) — never an ABSTRACT classification of what kind of rule it is. Canonical good example, Luke's own: "Opinion → Size → Age → Shape → Colour → Origin → Material → Purpose." Canonical bad example, also Luke's own flag: "One fixed word, or one fixed phrase — never inflected" describes the rule's category without giving its content and is useless against a real word — new STEP 9 check + Error Path catch require a rewrite into the actual concrete content. (2) DEFINITIONS now pass a FUNCTIONAL test, not a formal one: does the paragraph do all four jobs (A1/A2/B/C), not does it have four dedicated sentences. Parts merge into as few sentences as the content allows; a simple rule may do all four in one sentence. Padding toward an assumed one-sentence-per-part quota — the thing v1.8.0 had accidentally encouraged — is now named as the failure mode directly, with a matching STEP 9 check and Error Path catch. (3) DIAGNOSTICS gained two standing quality rules in the "🔍 DIAGNOSTICS" section: stay as SHORT as the single test allows (no padded context), and the STEP 5B nearest-miss must be a GENUINELY CONFUSABLE case, not an incidental property unrelated non-members share too — Luke's flagged example: testing whether a word resists -ed/-s/-ing does not discriminate a preposition, since adverbs, conjunctions and articles all fail the identical test. schema.md's `question` and `tested_on` field-rules, and skill.md's STYLE GUIDE Diagnostic-questions/Rule rows, updated to match. No mockup was refreshed this round — Luke reviewed the existing one directly and gave feedback via its own selection state. 2026-09-17 — !GrammarFrame v1.10.0, from a THIRD live mockup review (a fresh Sandbox mockup working out Adjectives in full under the then-current v1.9.0 render contract, at Grammar-framework-mockup/*.mockup.v2.html) plus two scope requests made in the same session. (1) A new STEP 5C ACCURACY REVIEW, distinct from STEP 2's verification of Luke's own quotes/claims — checks that every definition, diagnostic claim and example [bracket] tagging THIS SKILL composed is actually TRUE against the four sources and the frame, not merely internally consistent or STEP 5B-discrimination-tested; my own drafting errors are corrected autonomously (a new TWO LANES row), anything tracing to Luke's own content is routed to the STEP 3 gate instead. (2) Two rendering rules from the mockup itself: every example (inline, worked-example box, table cell) now renders in italics with any annotation on it ([bracket] tags, attribution, table header/category labels) upright; and a diagnostic renders as a standalone question by default — no yes/no outcome note — with a note added only where its absence would leave the question genuinely ambiguous out of context. (3) A new 🐝 FLEET MODE section, at Luke's explicit request, maps the procedure onto a boss agent running a fleet of subagents: STEP 0/1/3/4/9/10 and every file write stay boss-only; STEP 2 and STEP 5/5B/5C fan out one subagent per NEW/CHANGED heading, each returning a finished self-checked result; the boss reconciles first-use glossary order and tag-vocabulary normalisation across headings before STEP 6/7/8 render, which may itself run as three subagents off the same locked content. skill.md's TWO LANES table, STEP 9 VALIDATE, STYLE GUIDE (three new/updated rows), OUTPUT section and Error Path updated to match throughout; the Skillbank catalog intent above gained points (10)-(12). The two Sandbox mockup.v2.html files were updated in place to demonstrate the italics and standalone-diagnostic rules (not yet re-demonstrating STEP 5C or Fleet Mode, which have no visual surface of their own). Same day, v1.11.0 — Luke flagged the standing MEANING PRINCIPLE epigraph itself as too verbose ("Grammar allows the communication of meaning. Every rule in this guide exists because of what it lets a speaker mean — grammar is the shape meaning takes when it has to come out one word at a time."). Tightened to the single clause meaning-first.md's own "The one claim underneath everything" section had already isolated as the load-bearing part — "Grammar is the shape meaning takes when it has to come out one word at a time." — cutting the redundant lead-in sentence that restated the same idea twice before landing on it. Updated at its one source, reference/meaning-first.md's epigraph blockquote (the PRINCIPLE is "never redrafted" per-run, so this is a genuine source edit, not a regeneration); propagated to reference/schema.md's JSON example and both Sandbox mockup.v2.html files. The v1.8.0 changelog entry above, which quotes the original longer wording as it stood when the PRINCIPLE was first introduced, is left as a historical record and not rewritten. Same day, v1.12.0 — Luke corrected v1.11.0's cut: he wants HIS ORIGINAL CLAUSE kept, not the frame's internal metaphor. The rendered epigraph is now "Grammar allows the communication of meaning." — full stop, dropping "grammar is the shape meaning takes when it has to come out one word at a time" entirely from the PRINCIPLE. That sentence remains, untouched, as reference/meaning-first.md's separate "The one claim underneath everything" section (line 15) — the frame's own internal doctrine grounding the seven principles and every rule's A2 — which is NOT the same text as the rendered epigraph and is not required to be. The two now read as deliberately distinct: a plain, short, Luke-authored PRINCIPLE for the guides' readers, and a richer internal thesis for the frame's own reasoning. Propagated to reference/schema.md's JSON example and both Sandbox mockup.v2.html files. Same day, v1.13.0 — Luke asked for two structural flexes plus a visual one, all folded into a new "🗒️ SUB-SUBSECTIONS AND NOTES" section and a new "📦 BOX DIAGRAMS" section: (1) the SUBDIVISION TEST, an escape valve for a section that is genuinely too broad for one set of rules — subdivides into sub-subsections, each a section in miniature with its own diagnostic requirement, used sparingly; (2) the WEIGHT TEST, an escape valve for a point too minor to need a diagnostic or a four-part definition — renders as a lightweight NOTE (sentence or small table) instead, additive only, never substituting for a diagnostic a section actually owes; (3) BOX DIAGRAMS, for any heading tagged Syntax + Clause/Sentence/Phrase — nested HTML/CSS boxes over the worked example showing how spans GROUP (which a flat [bracket] tag cannot), structurally checked at the new STEP 5C pass. All three are mechanical/autonomous like the FORM/FUNCTION TEST — they shape approved content, they never authorize new content; a NOTE or box diagram introducing something Luke never stated is still a TWO LANES gate case. skill.md's STEP 5/6/7/8/9, STYLE GUIDE, OUTPUT and Error Path updated throughout; reference/schema.md bumped to 1.5 with `subdivided`/`subsections`, `notes[]`, and `examples[].groups`, plus a new compact `relative-clauses` heading and a subdivided `prepositions-function` (Place/Time) illustrating all three at once. Demonstrated live by extending the two Sandbox mockup.v2.html files: a NOTE (irregular/absolute adjectives) and a sub-subsection (Compound Adjectives) added under the existing Adjectives heading, plus a new Relative Clauses heading with a box diagram. 2026-09-18 — !Comprehension and !ConceptFidelity added under GeneralPurposeSkills/: the system's first MEASUREMENT skills, as opposed to the prescriptive writing skills (!PlainEnglish, !SimpleEnglish, !ProseDetox) that tell you how to write and never grade the result. Both work by BLIND RECONSTRUCTION — a clean-context subagent receives the artefact and nothing else, and the diff against a pre-registered spec IS the measurement; both cover FORMATTING as well as prose, on the principle that every layout decision is a silent proposition (nesting claims part-of, weight claims importance, parallel form claims same-kind-of-thing). Both fail closed: !Comprehension runs REDUCED with no independent intent source and stops outright with no blind reader; !ConceptFidelity runs COHERENCE-ONLY with no ground, mirroring !FactCheck's discipline. Neither emits a score. !GrammarFrame bumped 2.0.0 -> 2.1.0 to call both at a new STEP 7B TRANSMISSION REVIEW (criteria C32/C33), running on the RENDERED guides because half of what they assert is asserted by layout that does not exist until STEP 6/7 — STEP 5B asks whether a diagnostic WORKS, STEP 5C whether it is TRUE, STEP 7B whether any of it ARRIVES and whether the concept received is the concept held. Same day, !GrammarFrame v2.1.0 -> v2.2.0 — at Luke's explicit request that the arrangement of material (sections, sub-subsections, RULE vs NOTE, table vs paragraph, diagram count, cross-references) be shaped by what each concept needs rather than a uniform template. Added a new standing section, 🎛️ FORM FOLLOWS CONCEPT, naming E1-E3/D9's existing pattern as one governing principle and tabling all seven formatting decisions against the test that answers each. Closed two gaps that review surfaced: E4 DIAGRAM MULTIPLICITY TEST (a heading may need more than one box diagram — only when a single diagram cannot show every grouping claim it makes, e.g. two attachment readings, or Form's grouping differing from Function's under a SPLIT heading — never for symmetry) and E5 CROSS-REFERENCE TEST + new criterion D10 (a heading may earn a hyperlink to another heading it genuinely depends on, decided per heading against the locked skeleton — distinct from D2's fixed glossary chain and C5's fixed SPLIT-section pointer, and most headings will have none). Both wired into STEP 5 (decide), STEP 6/7 (render Technical, carry into Theatre), and the Error Paths. reference/schema.md bumped 1.5 -> 1.6: examples[].groups changed from a single tree to an array (one entry per E4 diagram) and headings gained cross_references[] (target heading id + paired note).
skills:
  - name: "!GenerateSupportiveContent"
    path: "System/Skillbank/GeneralPurposeSkills/!GenerateSupportiveContent/skill.md"
    domain: "GeneralPurpose"
    intent: "Generate content that serves an EXISTING target (repo, file, widget, report, email, project, wiki page, sermon, argument, web artefact) — matching that target's own tone and style, and emphasising / supporting / illustrating / defending what it already claims. Never freestanding, never introduces a new claim. Three deterministic gates: LOCATE (kind, path, audience, mode — ask, never guess), DISCOVER (adjacent assets, Skillbank hits, !Tone source, Long-Term stores), VERIFY (every quote, figure, citation, name, code signature and claim-about-the-target checked against a primary source, plus a 13-row slop scan). Strict abstention rule: unconfirmed or under-contexted means NO content at all, delivered as an abstention ledger — nothing beats slop, and the rule is not overridable."
    triggers: ["generate supportive content", "write something to back this up", "make the case for this", "add supporting content to", "illustrate this", "defend this", "write a companion piece for", "expand on this in its own voice", "support this argument", "!GenerateSupportiveContent"]
  - name: "!Magpie"
    path: "System/Skillbank/GeneralPurposeSkills/!Magpie/skill.md"
    domain: "GeneralPurpose"
    intent: "Searching and surveying top-ranked agent skills on GitHub, then observing patterns and/or extracting ideas, code, nomenclature or whole skills. Three modes (SURVEY / HUNT / LIFT) over a deterministic ranked list of ten repos in reference/top-repos.md, with an adjacency map from question-type to repo. Read-only outward, Sandbox-first inward — nothing lands in the Skillbank without !Checkpoint."
