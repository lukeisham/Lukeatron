    intent: "Interview the user relentlessly about a plan or design until reaching shared understanding — maps the decision space as a design tree, works it in rounds by asking the whole open frontier at once (numbered, each with a recommended answer), and dispatches sub-agents (never the user) to find facts from the environment rather than blocking the round on them."
    triggers: ["grill me", "stress-test this plan", "stress-test this design", "get grilled on design", "pressure-test decisions", "pressure-test this plan"]
  - name: "!handoff"
