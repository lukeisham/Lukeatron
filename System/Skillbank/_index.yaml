ple, diagnostic, heading, correction, restructure or formatting call — Luke's own gate rulings (STEP 3) and autonomous discards (an unverifiable quote at STEP 2, a diagnostic that fails STEP 5B's discrimination test twice) alike — checked before anything is proposed a second time, closing the gap where STEP 3's "not re-proposed on a later run" promise had no persisted state to keep it. (3) STEP 9's VALIDATE and the OUTPUT section's Validation Check (Self-Test) had grown into two near-duplicate ~20-item checklists; the Self-Test is now a pointer to STEP 9 (the single canonical copy) plus the two items unique to it, per the same "if two documents say the same thing, one of them is wrong" principle already applied to AppDevelopment's Health Check (2026-09-02). Same day, v1.5.0 — two changes at Luke's explicit instruction. (1) Every rule now pairs a TERSE BOLD statement (the rule in as few words as possible — what the leading `*` callout headline shows, re-phrased through the metaphor in Theatre.html) with a three-part !SimpleEnglish DEFINITION beneath it: (A) the precise, particular aspect of grammar the rule describes, (B) how it fits its immediate context and contributes to the larger one, and (C) whether it is a consistent pattern or one with exceptions/variations — distinct from the existing meaning basis, which explains why rather than what/where/how-reliable. grammar-content.json's `rules[]` gained a `definition` field alongside `text` (schema.md, "1.2" shape note updated); STEP 9's VALIDATE and the Error Path gained matching checks. (2) Heading/sub-heading TEXT may now be lightly reworded to match house heading style/format when topic and scope are unchanged (a new named exception to STEP 1's wording-fidelity assert, listed as its own row in the TWO LANES autonomous column) — order and nesting still follow the paste as closely as possible, and anything beyond wording-only convention stays a gated RESTRUCTURE. Same day, v1.6.0 — Luke clarified the rule/definition