# System/Skillbank/_index.yaml
# On-demand skill catalog. Loaded at boot (triggers only); skill bodies load when a trigger fires.
# Add a one-line entry here for every !SkillName/SKILL.md, or the skill is invisible.
# Change history lives in Memory/Long-Term/Logs/history.log — keep this catalog to entries only.
last_updated: 2026-10-10
