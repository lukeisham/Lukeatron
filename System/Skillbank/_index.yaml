  - name: "!TheJesusWebsite-Challenges"
    path: "System/Skillbank/Church/!TheJesusWebsite-Challenges/skill.md"
    domain: "Church"
    intent: "Maintain the two ranked-challenge lists for The Jesus Website — Popular Challenges (Memory/Long-Term/The-Jesus-Website/Popular Challenges/) and Academic Challenges (.../Academic Challenges/) to Jesus' historicity. One skill, mode-switched (--mode popular|academic): tops up whichever list is below its 10-challenge ceiling by searching/selecting/scoring only what's missing, or just checks internal consistency when the ceiling is already met. Popular is ranked by current YouTube/Reddit/forum/social-media popularity (academic sources excluded); Academic is ranked by persistence in scholarly literature over time (citation counts, publication span, distinct-era representation), popularity excluded. Also permanently excludes named challenges on request. Follows the search/ranking criteria documented in each mode's own Reference.md. Sibling of !TheJesusWebsite-Wikipedia, which owns the separate Wikipedia-article tracker in the same parent folder."
    triggers: ["top up the popular challenges list", "top up the academic challenges list", "check the challenges ranking", "popular challenges to jesus historicity", "academic challenges to jesus historicity", "exclude this challenge", "the jesus website challenges"]
