<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.55; }
    a { color:#185FA5; } a:hover { color:#0C447C; }
  </style>
</helmet>

<div style="width:1180px; background:#faf9f5; color:#1a1a17; padding:0 0 26px;">

  <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 24px; border-bottom:1px solid #e3e1d9; background:#fff;">
    <div style="display:flex; align-items:center; gap:10px; font-weight:600; font-size:17px;">
      <span style="display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:7px; background:#1a1a17; color:#fff; font-family:Georgia,serif; font-weight:bold; font-size:15px;">C</span>
      <span>Year 10 History</span>
      <span style="font-weight:400; color:#9a9891; font-size:13px;">— lessons &amp; topics</span>
    </div>
    <div style="display:flex; align-items:center; gap:6px;">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
        <button style="{{t.style}}">{{t.name}}</button>
      </sc-for>
    </div>
  </div>

  <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 24px 10px;">
    <div style="font-size:13px; color:#5f5e5a;"><strong style="color:#1a1a17;">3 topics</strong> · 8 lessons · 3 assessments — the whole unit</div>
    <div style="display:flex; align-items:center; gap:14px; font-size:11px; color:#9a9891;">
      <span style="display:flex; align-items:center; gap:5px;"><span style="width:9px; height:9px; border-radius:50%; background:#1F6B41; display:inline-block;"></span>Complete</span>
      <span style="display:flex; align-items:center; gap:5px;"><span style="width:9px; height:9px; border-radius:50%; background:#fff; border:1.5px solid #c9c7bd; display:inline-block;"></span>Not yet</span>
    </div>
  </div>

  <div style="margin:0 24px; display:flex; flex-direction:column; gap:14px;">
    <sc-for list="{{topics}}" as="top" hint-placeholder-count="3">
      <div style="background:#fff; border:1px solid #c9c7bd; border-radius:8px; overflow:hidden;">
        <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:{{top.headerBg}}; border-bottom:1px solid #e3e1d9;">
          <div style="font-size:14.5px; font-weight:600;">{{top.title}}</div>
          <div style="font-size:11px; font-weight:600; color:{{top.statusColor}};">{{top.statusLabel}}</div>
        </div>
        <div>
          <sc-for list="{{top.items}}" as="it" hint-placeholder-count="4">
            <div style="display:flex; align-items:center; gap:11px; padding:9px 16px 9px 26px; border-bottom:1px solid #f0efea; background:{{it.rowBg}};">
              <span style="{{it.dotStyle}}"></span>
              <span style="{{it.tagStyle}}">{{it.tag}}</span>
              <span style="flex-grow:1; font-size:12.5px;">{{it.label}}</span>
              <span style="font-size:10.5px; color:#9a9891;">{{it.meta}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const tab = (name, on) => ({
      name,
      style: 'font:inherit; font-size:13.5px; padding:6px 12px; border-radius:8px; cursor:pointer; '
        + (on ? 'border:1px solid #1a1a17; background:#1a1a17; color:#fff;'
              : 'border:1px solid #c9c7bd; background:#fff; color:#1a1a17;')
    });
    const dot = (done) => 'width:9px; height:9px; border-radius:50%; flex-shrink:0; '
      + (done ? 'background:#1F6B41;' : 'background:#fff; border:1.5px solid #c9c7bd;');
    const rowBg = (done) => done ? '#F4FAF6' : '#fff';
    const lessonTag = 'font-size:10px; font-weight:700; color:#5f5e5a; background:#f4f3ee; border-radius:4px; padding:2px 6px; flex-shrink:0;';
    const assessTag = 'font-size:9.5px; font-weight:700; letter-spacing:.04em; color:#0C447C; background:#E6F1FB; border-radius:4px; padding:2px 6px; flex-shrink:0;';
    const lesson = (n, idea, done) => ({
      tag: 'L' + n, tagStyle: lessonTag, label: 'Big idea: ' + idea, meta: '',
      dotStyle: dot(done), rowBg: rowBg(done)
    });
    const assessment = (kind, name, done) => ({
      tag: kind.toUpperCase(), tagStyle: assessTag, label: name, meta: 'assessment',
      dotStyle: dot(done), rowBg: rowBg(done)
    });
    const topic = (title, statusLabel, statusColor, headerBg, items) => ({ title, statusLabel, statusColor, headerBg, items });
    return {
      tabs: [tab('Curriculum'), tab('Lessons & Topics', true), tab('Coverage'), tab('Assessment'), tab('Matrix'), tab('Resources')],
      topics: [
        topic('Causes & experience of war', 'Complete', '#1F6B41', '#E4F4E9', [
          lesson(1, 'Cause & consequence', true),
          lesson(2, 'Cause & consequence', true),
          lesson(3, 'Experience of war', true),
          lesson(5, 'Experience of war', true),
          lesson(6, 'Cause & consequence', true),
          assessment('mini', 'Timeline check', true),
        ]),
        topic('Evidence & rights', 'In progress', '#185FA5', '#E6F1FB', [
          lesson(4, 'Evidence & reliability', true),
          assessment('mini', 'Source reliability drill', false),
        ]),
        topic('Memory & meaning', 'Not started', '#9a9891', '#f4f3ee', [
          lesson(7, 'Contested memory', false),
          lesson(8, 'Contested memory', false),
          assessment('final', 'Was the Anzac legend made in 1915?', false),
        ]),
      ],
    };
  }
}
</script>
</body>
</html>
