<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.55; }
  </style>
</helmet>

<!-- A4 portrait at 96dpi = 794 x 1123. Print artboard: no tabs/buttons/hover, content only. -->
<div style="width:794px; height:1123px; background:#fff; color:#1a1a17; padding:40px 44px; box-sizing:border-box; display:flex; flex-direction:column;">

  <div style="font-size:12.5px; font-weight:600; color:#5f5e5a; letter-spacing:.02em;">Year 10 History</div>
  <div style="display:flex; align-items:baseline; justify-content:space-between; border-bottom:1.5px solid #1a1a17; padding-bottom:8px; margin:2px 0 0;">
    <div style="font-size:18px; font-weight:600;">Lessons &amp; Topics</div>
    <div style="font-size:10.5px; color:#5f5e5a;">Page 1 of 1</div>
  </div>

  <!-- summary + legend: legend marks are shape-coded (filled vs outline) so they survive greyscale printing -->
  <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; margin:10px 0 16px;">
    <div style="font-size:11px; color:#5f5e5a;"><strong style="color:#1a1a17;">{{topicCount}} topics</strong> · {{lessonCount}} lessons · {{assessCount}} assessments — the whole unit</div>
    <div style="display:flex; align-items:center; gap:14px; font-size:10px; color:#5f5e5a; flex-shrink:0;">
      <span style="display:flex; align-items:center; gap:5px;"><span style="width:9px; height:9px; border-radius:50%; background:#0F7B6C; display:inline-block;"></span>Complete</span>
      <span style="display:flex; align-items:center; gap:5px;"><span style="width:9px; height:9px; border-radius:50%; background:#fff; border:1.5px solid #c9c7bd; display:inline-block;"></span>Not yet</span>
    </div>
  </div>

  <div style="display:flex; flex-direction:column; gap:12px;">
    <sc-for list="{{topics}}" as="top" hint-placeholder-count="3">
      <div style="border:1px solid #c9c7bd; border-radius:8px; overflow:hidden;">
        <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:{{top.headerBg}}; border-bottom:1px solid #e3e1d9;">
          <div style="font-size:15px; font-weight:600;">{{top.title}}</div>
          <div style="font-size:11px; font-weight:600; color:{{top.statusColor}};">{{top.statusLabel}}</div>
        </div>
        <div>
          <sc-for list="{{top.items}}" as="it" hint-placeholder-count="4">
            <div style="display:flex; align-items:center; gap:9px; padding:9px 16px 9px 24px; border-bottom:1px dotted #e3e1d9; background:{{it.rowBg}};">
              <span style="{{it.dotStyle}}"></span>
              <span style="{{it.tagStyle}}">{{it.tag}}</span>
              <span style="flex-grow:1; font-size:13.5px; text-wrap:pretty;">{{it.label}}</span>
              <span>{{it.dateHtml}}</span>
              <span>{{it.periodHtml}}</span>
              <span style="font-size:10px; color:#9a9891; flex-shrink:0;">{{it.meta}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow:1;"></div>

  <div style="border-top:1px solid #e3e1d9; padding-top:8px; margin-top:12px; font-size:10px; color:#9a9891;">
    <span>Year 10 History</span>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const dot = (done) => 'width:9px; height:9px; border-radius:50%; flex-shrink:0; '
      + (done ? 'background:#0F7B6C;' : 'background:#fff; border:1.5px solid #c9c7bd;');
    const rowBg = (done) => done ? '#E0F3EF' : '#fff';
    const lessonTag = 'font-size:10px; font-weight:700; color:#5f5e5a; background:#f4f3ee; border-radius:4px; padding:2px 6px; flex-shrink:0;';
    const assessTag = 'font-size:9.5px; font-weight:700; letter-spacing:.04em; color:#4A3172; background:#EEE8F8; border-radius:4px; padding:2px 6px; flex-shrink:0;';
    // Date/period print only when set (FR-TOP-13a) — no empty field, no placeholder, same convention as the lesson-plan sidebar (FR-LP-19).
    const calSvg = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; vertical-align:-1px;"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="16" y1="3" x2="16" y2="7"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
    const clockSvg = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; vertical-align:-1px;"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>';
    const pillStyle = 'display:inline-flex; align-items:center; gap:3px; font-size:10px; font-weight:600; border-radius:10px; padding:2px 8px; flex-shrink:0; white-space:nowrap;';
    const datePill = (date) => date ? `<span style="${pillStyle} color:#185FA5; background:#EAF1FB; border:1px solid #C9DCEF;">${calSvg}${date}</span>` : '';
    const periodPill = (period) => period ? `<span style="${pillStyle} color:#8A6D1D; background:#FBF1DD; border:1px solid #E9D6A6;">${clockSvg}${period}</span>` : '';
    const glyph = (domain) => {
      if (domain === 'skill') return '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#0F7B6C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; vertical-align:-1px;"><path d="M4 20l1.5-5.5L16 3.5l4 4L9.5 18z"/><path d="M14 6.5l4 4"/></svg> ';
      if (domain === 'knowledge') return '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#B23A6B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; vertical-align:-1px;"><rect x="3.5" y="3" width="17" height="18" rx="2"/><line x1="8" y1="3" x2="8" y2="21"/><line x1="11.5" y1="8" x2="17.5" y2="8"/><line x1="11.5" y1="13" x2="17.5" y2="13"/></svg> ';
      return '';
    };
    // Big idea's glyph set is the union of its covered nodes' domains — derived, never stored (FR-BI-15).
    const bigIdeaDomains = {
      'Cause & consequence': ['skill'],
      'Experience of war': ['knowledge'],
      'Evidence & reliability': ['skill'],
      'Contested memory': ['skill', 'knowledge'],
    };
    const bigIdeaGlyphs = (idea) => (bigIdeaDomains[idea] || []).map(glyph).join('');
    const lesson = (n, idea, done, date, period) => ({
      tag: 'L' + n, tagStyle: lessonTag, label: bigIdeaGlyphs(idea) + 'Big idea: ' + idea, meta: '',
      dotStyle: dot(done), rowBg: rowBg(done), done, isLesson: true,
      dateHtml: datePill(date), periodHtml: periodPill(period)
    });
    const assessment = (kind, name, done, date, period) => ({
      tag: kind.toUpperCase(), tagStyle: assessTag, label: name, meta: 'assessment',
      dotStyle: dot(done), rowBg: rowBg(done), done, isLesson: false,
      dateHtml: datePill(date), periodHtml: periodPill(period)
    });
    // Topic status is derived from its items, never stored: all done -> Complete, none done -> Not started, else In progress.
    const topic = (title, items) => {
      const allDone = items.every(i => i.done);
      const noneDone = items.every(i => !i.done);
      const statusLabel = allDone ? 'Complete' : (noneDone ? 'Not started' : 'In progress');
      const statusColor = allDone ? '#0F7B6C' : (noneDone ? '#9a9891' : '#6E4FA3');
      const headerBg = allDone ? '#E0F3EF' : (noneDone ? '#f4f3ee' : '#EEE8F8');
      return { title, statusLabel, statusColor, headerBg, items };
    };
    const topics = [
      topic('Causes & experience of war', [
        lesson(1, 'Cause & consequence', true, 'Mon 3 Aug', 'Mon 3rd P'),
        lesson(2, 'Cause & consequence', true, 'Wed 5 Aug', 'Wed 1st–2nd P'),
        lesson(3, 'Experience of war', true, 'Mon 10 Aug', 'Mon 3rd P'),
        lesson(5, 'Experience of war', true, 'Fri 14 Aug', 'Fri 5th P'),
        lesson(6, 'Cause & consequence', true, 'Mon 17 Aug', 'Mon 3rd P'),
        assessment('mini', 'Timeline check', true, 'Wed 19 Aug', 'Wed 1st–2nd P'),
      ]),
      topic('Evidence & rights', [
        lesson(4, 'Evidence & reliability', true, 'Wed 12 Aug', 'Wed 4th P'),
        assessment('mini', 'Source reliability drill', false, null, null),
      ]),
      topic('Memory & meaning', [
        lesson(7, 'Contested memory', false, null, 'Mon 3rd P'),
        lesson(8, 'Contested memory', false, 'Mon 24 Aug', 'Mon 3rd P'),
        assessment('final', 'Was the Anzac legend made in 1915?', false, 'Fri 28 Aug', 'Fri 1st–2nd P'),
      ]),
    ];
    const lessonCount = topics.reduce((sum, t) => sum + t.items.filter(i => i.isLesson).length, 0);
    const assessCount = topics.reduce((sum, t) => sum + t.items.filter(i => !i.isLesson).length, 0);
    return {
      topicCount: topics.length,
      lessonCount,
      assessCount,
      topics,
    };
  }
}
</script>
</body>
</html>
