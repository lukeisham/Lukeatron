<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.55; }
  </style>
</helmet>

<!-- A4 portrait at 96dpi = 794 x 1123. Same document as LessonsAndTopicsPrint.dc.html, grouped by
     date instead of topic (FR-TOP-14/14a) — the same items, same completion state, only the
     heading and ordering differ (FR-TOP-14b). Compare against LessonsAndTopicsPrint.dc.html: L4
     (Evidence & rights) interleaves between L3 and L5 (Causes & experience of war) here by date,
     and every undated item collects under one trailing Unscheduled heading. -->
<div style="width:794px; height:1123px; background:#fff; color:#1a1a17; padding:40px 44px; box-sizing:border-box; display:flex; flex-direction:column;">

  <div style="font-size:12.5px; font-weight:600; color:#5f5e5a; letter-spacing:.02em;">Year 10 History</div>
  <div style="display:flex; align-items:baseline; justify-content:space-between; border-bottom:1.5px solid #1a1a17; padding-bottom:8px; margin:2px 0 0;">
    <div style="font-size:18px; font-weight:600;">Lessons &amp; Topics <span style="font-weight:400; color:#9a9891; font-size:12px;">— grouped by date</span></div>
    <div style="font-size:10.5px; color:#5f5e5a;">Page 1 of 1</div>
  </div>

  <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; margin:10px 0 16px;">
    <div style="font-size:11px; color:#5f5e5a;"><strong style="color:#1a1a17;">{{topicCount}} topics</strong> · {{lessonCount}} lessons · {{assessCount}} assessments — the whole unit</div>
    <div style="display:flex; align-items:center; gap:14px; font-size:10px; color:#5f5e5a; flex-shrink:0;">
      <span style="display:flex; align-items:center; gap:5px;"><span style="width:9px; height:9px; border-radius:50%; background:#0F7B6C; display:inline-block;"></span>Complete</span>
      <span style="display:flex; align-items:center; gap:5px;"><span style="width:9px; height:9px; border-radius:50%; background:#fff; border:1.5px solid #c9c7bd; display:inline-block;"></span>Not yet</span>
    </div>
  </div>

  <div style="display:flex; flex-direction:column; gap:12px;">
    <sc-for list="{{groups}}" as="grp" hint-placeholder-count="8">
      <div style="border:1px solid #c9c7bd; border-radius:8px; overflow:hidden;">
        <div style="display:flex; align-items:center; justify-content:space-between; padding:8px 16px; background:{{grp.headerBg}}; border-bottom:1px solid #e3e1d9;">
          <div style="font-size:13.5px; font-weight:600; color:{{grp.headerColor}};">{{grp.heading}}</div>
        </div>
        <div>
          <sc-for list="{{grp.items}}" as="it" hint-placeholder-count="2">
            <div style="display:flex; align-items:center; gap:9px; padding:7px 16px 7px 24px; border-bottom:1px dotted #e3e1d9; background:{{it.rowBg}};">
              <span style="{{it.dotStyle}}"></span>
              <span style="{{it.tagStyle}}">{{it.tag}}</span>
              <span style="{{it.topicChipStyle}}">{{it.topicTitle}}</span>
              <span style="flex-grow:1; font-size:12.5px; text-wrap:pretty;">{{it.label}}</span>
              <span>{{it.periodHtml}}</span>
              <span style="font-size:10px; color:#9a9891; flex-shrink:0;">{{it.meta}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow:1;"></div>

  <div style="border-top:1px solid #e3e1d9; padding-top:8px; margin-top:12px; font-size:10px; color:#9a9891;">
    <span>Year 10 History</span>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const dot = (done) => 'width:9px; height:9px; border-radius:50%; flex-shrink:0; '
      + (done ? 'background:#0F7B6C;' : 'background:#fff; border:1.5px solid #c9c7bd;');
    const rowBg = (done) => done ? '#E0F3EF' : '#fff';
    const lessonTag = 'font-size:10px; font-weight:700; color:#5f5e5a; background:#f4f3ee; border-radius:4px; padding:2px 6px; flex-shrink:0;';
    const assessTag = 'font-size:9.5px; font-weight:700; letter-spacing:.04em; color:#4A3172; background:#EEE8F8; border-radius:4px; padding:2px 6px; flex-shrink:0;';
    // Date drives the section heading in this view, so it prints once per group, not per row (FR-TOP-14a).
    // Period stays per-row — a recurring timetable slot is independent of the date it's grouped under.
    const clockSvg = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; vertical-align:-1px;"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>';
    const periodPill = (period) => period
      ? `<span style="display:inline-flex; align-items:center; gap:3px; font-size:10px; font-weight:600; color:#8A6D1D; background:#FBF1DD; border:1px solid #E9D6A6; border-radius:10px; padding:2px 8px; flex-shrink:0; white-space:nowrap;">${clockSvg}${period}</span>`
      : '';
    const glyph = (domain) => {
      if (domain === 'skill') return '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#0F7B6C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; vertical-align:-1px;"><path d="M4 20l1.5-5.5L16 3.5l4 4L9.5 18z"/><path d="M14 6.5l4 4"/></svg> ';
      if (domain === 'knowledge') return '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#B23A6B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; vertical-align:-1px;"><rect x="3.5" y="3" width="17" height="18" rx="2"/><line x1="8" y1="3" x2="8" y2="21"/><line x1="11.5" y1="8" x2="17.5" y2="8"/><line x1="11.5" y1="13" x2="17.5" y2="13"/></svg> ';
      return '';
    };
    // Big idea's glyph set is the union of its covered nodes' domains — derived, never stored (FR-BI-15).
    const bigIdeaDomains = {
      'Cause & consequence': ['skill'],
      'Experience of war': ['knowledge'],
      'Evidence & reliability': ['skill'],
      'Contested memory': ['skill', 'knowledge'],
    };
    const bigIdeaGlyphs = (idea) => (bigIdeaDomains[idea] || []).map(glyph).join('');
    // Topic colours mirror the topic-grouped view's header backgrounds (LessonsAndTopicsPrint.dc.html),
    // carried here as a small in-row chip instead of a section heading (FR-TOP-14a).
    const topicColor = {
      'Causes & experience of war': { bg: '#E0F3EF', text: '#0F7B6C' },
      'Evidence & rights': { bg: '#EEE8F8', text: '#6E4FA3' },
      'Memory & meaning': { bg: '#f4f3ee', text: '#5f5e5a' },
    };
    const topicChipStyle = (topicTitle) => {
      const c = topicColor[topicTitle] || { bg: '#f4f3ee', text: '#5f5e5a' };
      return `font-size:9.5px; font-weight:600; color:${c.text}; background:${c.bg}; border-radius:4px; padding:2px 7px; flex-shrink:0; white-space:nowrap;`;
    };
    const lesson = (n, idea, done, topicTitle, date, period) => ({
      tag: 'L' + n, tagStyle: lessonTag, label: bigIdeaGlyphs(idea) + 'Big idea: ' + idea, meta: '',
      dotStyle: dot(done), rowBg: rowBg(done), topicTitle, topicChipStyle: topicChipStyle(topicTitle),
      periodHtml: periodPill(period), date
    });
    const assessment = (kind, name, done, topicTitle, date, period) => ({
      tag: kind.toUpperCase(), tagStyle: assessTag, label: name, meta: 'assessment',
      dotStyle: dot(done), rowBg: rowBg(done), topicTitle, topicChipStyle: topicChipStyle(topicTitle),
      periodHtml: periodPill(period), date
    });
    // Same items as LessonsAndTopicsPrint.dc.html's topic groups, flattened with each item's own topic and date carried along.
    const allItems = [
      lesson(1, 'Cause & consequence', true, 'Causes & experience of war', 'Mon 3 Aug', 'Mon 3rd P'),
      lesson(2, 'Cause & consequence', true, 'Causes & experience of war', 'Wed 5 Aug', 'Wed 1st–2nd P'),
      lesson(3, 'Experience of war', true, 'Causes & experience of war', 'Mon 10 Aug', 'Mon 3rd P'),
      lesson(4, 'Evidence & reliability', true, 'Evidence & rights', 'Wed 12 Aug', 'Wed 4th P'),
      lesson(5, 'Experience of war', true, 'Causes & experience of war', 'Fri 14 Aug', 'Fri 5th P'),
      lesson(6, 'Cause & consequence', true, 'Causes & experience of war', 'Mon 17 Aug', 'Mon 3rd P'),
      assessment('mini', 'Timeline check', true, 'Causes & experience of war', 'Wed 19 Aug', 'Wed 1st–2nd P'),
      lesson(8, 'Contested memory', false, 'Memory & meaning', 'Mon 24 Aug', 'Mon 3rd P'),
      assessment('final', 'Was the Anzac legend made in 1915?', false, 'Memory & meaning', 'Fri 28 Aug', 'Fri 1st–2nd P'),
      // Unscheduled — no date; sorts last, in unit order (FR-TOP-14a). L7 keeps a recurring period with no locked date.
      lesson(7, 'Contested memory', false, 'Memory & meaning', null, 'Mon 3rd P'),
      assessment('mini', 'Source reliability drill', false, 'Evidence & rights', null, null),
    ];
    // Group by date (chronological; items sharing a date collect into one heading), undated items
    // collected under one trailing "Unscheduled" heading — FR-TOP-14a. `allItems` is already in date
    // order for this fixture, so building groups in array order reproduces chronological order without
    // a separate sort step.
    const dated = allItems.filter(i => i.date);
    const undated = allItems.filter(i => !i.date);
    const groups = [];
    dated.forEach(i => {
      const last = groups[groups.length - 1];
      if (last && last.heading === i.date) { last.items.push(i); }
      else { groups.push({ heading: i.date, headerBg: '#faf9f5', headerColor: '#1a1a17', items: [i] }); }
    });
    if (undated.length) {
      groups.push({ heading: 'Unscheduled', headerBg: '#f4f3ee', headerColor: '#9a9891', items: undated });
    }
    const topicCount = 3;
    const lessonCount = allItems.filter(i => i.tag.startsWith('L')).length;
    const assessCount = allItems.length - lessonCount;
    return { topicCount, lessonCount, assessCount, groups };
  }
}
</script>
</body>
</html>
