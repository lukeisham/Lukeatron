<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.55; }
    a { color:#185FA5; } a:hover { color:#0C447C; }
  </style>
</helmet>

<div style="width:1180px; background:#faf9f5; color:#1a1a17; padding:0 0 26px;">

  <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 24px; border-bottom:1px solid #e3e1d9; background:#fff;">
    <div style="display:flex; align-items:center; gap:10px; font-weight:600; font-size:17px;">
      <span style="display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:7px; background:#1a1a17; color:#fff; font-family:Georgia,serif; font-weight:bold; font-size:15px;">C</span>
      <span>Year 10 History</span>
      <span style="font-weight:400; color:#9a9891; font-size:13px;">— resources</span>
    </div>
    <div style="display:flex; align-items:center; gap:6px;">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
        <button style="{{t.style}}">{{t.name}}</button>
      </sc-for>
    </div>
  </div>

  <!-- add bar -->
  <div style="margin:18px 24px 0; display:flex; align-items:center; gap:10px; background:#fff; border:1px solid #c9c7bd; border-radius:8px; padding:10px 14px;">
    <span style="font-size:13px; color:#9a9891; flex-grow:1;">Paste a link, drop an image, or start typing…</span>
    <button style="font:inherit; font-size:13px; padding:5px 13px; border:1px solid #c9c7bd; border-radius:8px; background:#fff; color:#1a1a17;">Link</button>
    <button style="font:inherit; font-size:13px; padding:5px 13px; border:1px solid #c9c7bd; border-radius:8px; background:#fff; color:#1a1a17;">Image</button>
    <button style="font:inherit; font-size:13px; padding:5px 13px; border:1px solid #c9c7bd; border-radius:8px; background:#fff; color:#1a1a17;">Text</button>
  </div>

  <!-- the list -->
  <div style="margin:14px 24px 0; background:#fff; border:1px solid #e3e1d9; border-radius:8px; overflow:hidden;">
    <sc-for list="{{items}}" as="r" hint-placeholder-count="7">
      <div style="display:flex; gap:13px; align-items:flex-start; padding:13px 16px; border-bottom:1px solid #f0efea;">
        <span style="font-size:11px; color:#c9c7bd; padding-top:3px; cursor:grab; flex-shrink:0;">⠿</span>
        <span style="{{r.badge}}">{{r.kind}}</span>
        <div style="flex-grow:1; min-width:0;">
          <div style="{{r.titleStyle}}">{{r.title}}</div>
          <div style="font-size:11.5px; color:#5f5e5a; margin-top:2px; text-wrap:pretty;">{{r.note}}</div>
        </div>
        <span style="font-size:11px; color:#c9c7bd; flex-shrink:0; padding-top:3px;">edit · remove</span>
      </div>
    </sc-for>

    <!-- image item rendered inline -->
    <div style="display:flex; gap:13px; align-items:flex-start; padding:13px 16px;">
      <span style="font-size:11px; color:#c9c7bd; padding-top:3px; cursor:grab; flex-shrink:0;">⠿</span>
      <span style="font-size:9.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:#703508; background:#FCEEE2; border:1px solid #9A4E12; border-radius:4px; padding:1px 6px; white-space:nowrap;">image</span>
      <div style="flex-grow:1;">
        <div style="width:250px; height:120px; border:1px solid #e3e1d9; border-radius:6px; background:#f4f3ee; display:flex; align-items:center; justify-content:center; color:#9a9891; font-size:11.5px;">[PASTED IMAGE]</div>
        <div style="font-size:11.5px; color:#5f5e5a; margin-top:5px;">Recruitment poster, 1915 — used in lesson 3.</div>
      </div>
      <span style="font-size:11px; color:#c9c7bd; flex-shrink:0; padding-top:3px;">edit · remove</span>
    </div>
  </div>

  <div style="margin:11px 24px 0; font-size:11.5px; color:#9a9891;">
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const tab = (name, on) => ({
      name,
      style: 'font:inherit; font-size:13.5px; padding:6px 12px; border-radius:8px; cursor:pointer; '
        + (on ? 'border:1px solid #1a1a17; background:#1a1a17; color:#fff;'
              : 'border:1px solid #c9c7bd; background:#fff; color:#1a1a17;')
    });
    const B = {
      link: 'font-size:9.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:#0C447C; background:#E6F1FB; border:1px solid #185FA5; border-radius:4px; padding:1px 6px; white-space:nowrap;',
      text: 'font-size:9.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:#14502F; background:#E4F4E9; border:1px solid #1F6B41; border-radius:4px; padding:1px 6px; white-space:nowrap;',
    };
    const item = (kind, title, note) => ({
      kind, title, note,
      badge: B[kind],
      titleStyle: kind === 'link'
        ? 'font-size:13px; color:#185FA5; text-decoration:underline; overflow-wrap:anywhere;'
        : 'font-size:13px; color:#1a1a17; text-wrap:pretty;'
    });
    return {
      tabs: [tab('Curriculum'), tab('Lessons & Topics'), tab('Coverage'), tab('Assessment'), tab('Matrix'), tab('Resources', true)],
      items: [
        item('link', 'awm.gov.au/collection/[RECORD]', 'AWM collection record — the 1915 poster, high resolution.'),
        item('text', 'Ask the librarian about the 1965 editorial microfilm', 'She said Tuesdays are quietest.'),
        item('link', 'abc.net.au/news/[ARTICLE]', 'The 2015 centenary coverage — good for the "made since" argument.'),
        item('text', 'Two spare copies of the source booklet live in the bottom drawer', ''),
        item('link', 'vcaa.vic.edu.au/[PAGE]', 'Where the curriculum text came from.'),
      ]
    };
  }
}
</script>
</body>
</html>
